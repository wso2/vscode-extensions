openapi: 3.0.3
info:
  title: Integration Platform API Service
  description: >
    BFF between the integration platform console and OpenChoreo. Exposes
    project, component, deployment and runtime operations to the console
    (the `cloud` build of wso2/integration-control-plane) and other consumers.
    All endpoints except /health require a JWT Bearer token (see
    `bearerAuth`).

    Several routes have no OpenChoreo backing; those return a documented safe
    default rather than fabricated data, and say so in their description.
  version: 1.0.0

servers:
  - url: /
    description: >
      Service root. The external gateway rewrites the
      /integration-platform-api-service-integration-platform-api-http prefix
      to /integration-platform-api/v1.0 and the internal gateway strips that
      prefix, so the paths below are the paths the pod receives.

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Unauthenticated liveness probe.
  - name: Projects
    description: Projects in the caller's organization, backed by OpenChoreo Projects.
  - name: Components
    description: Integrations, backed by OpenChoreo Components.
  - name: Builds
    description: Build workflow runs of a component and their logs.
  - name: Deployments
    description: Per-environment deployment state of a component, backed by ReleaseBindings.
  - name: Deployment Tracks
    description: The branches an integration builds and deploys independently.
  - name: Deployment Pipelines
    description: Promotion paths between environments.
  - name: Environments
    description: Environments in the caller's organization.
  - name: Data Planes
    description: Data planes environments can be placed on.
  - name: Schedules
    description: Cron schedules of scheduled-task components, held on the ReleaseBinding.
  - name: Executions
    description: Runs of scheduled-task and manually triggered components.
  - name: Resource Tree
    description: Kubernetes resources rendered for a component-environment, with their events and logs.
  - name: Runtime
    description: Pods, events, logs and metrics of a deployed release.
  - name: Loggers
    description: Runtime log levels of a deployed integration.
  - name: File Mounts
    description: Config and secret files mounted into a component's container.
  - name: Env Groups
    description: Groups of environment variables set on a component-environment.
  - name: Config Schema
    description: Configurable values a component declares, and the values saved for them.
  - name: Secrets
    description: JWT secrets of a component-environment, issued by ICP.
  - name: Health Check
    description: Liveness and readiness probes of a component-environment.
  - name: Autoscaling
    description: Horizontal pod autoscaling of a component-environment.
  - name: Containers
    description: The container spec of a deployed component.
  - name: Endpoints
    description: Endpoints of a component and the API resources they serve.
  - name: API Exposure
    description: Expose/unexpose a deployed endpoint as a managed API.
  - name: Endpoint Security
    description: API keys, test keys, and the single active auth mode on an exposed API.
  - name: Endpoint Policies
    description: CORS and request rate limiting on an exposed API.
  - name: Applications
    description: Consumer applications (their credential is an api-key on the exposed endpoint).
  - name: Alert Rules
    description: Log and metric alert rules of a component.
  - name: Cloud Editor
    description: Browser-based code editor (code-server) for a component.
  - name: Organizations
    description: The caller's organization, its plan and limits.
  - name: Repositories
    description: Branch and file listings of GitHub repositories, for the create-component flow.
  - name: Ballerina Central
    description: The organization's Ballerina Central access token.
  - name: Proxies
    description: Pass-through subtrees forwarded to the observability and git services.
  - name: Databases
    description: >
      Managed PostgreSQL databases (Platform Services), provisioned on WSO2
      PaaS as one account-scoped service key. Each organization is a PaaS
      tenant and its databases live in that tenant's `default` project.
  - name: Temporal
    description: >
      Managed Temporal servers (Platform Services), provisioned on WSO2 PaaS
      in the same tenant and project as the organization's databases. Each
      server is a dedicated Temporal cluster with one namespace, `default`,
      which workers reach at its public endpoint with its API key.
  - name: Agent Traces
    description: >
      Execution traces of an AI agent component, read from
      agent-manager-observer.

paths:

  /health:
    get:
      summary: Health check
      description: >
        Liveness probe. Registered outside the JWT middleware, so it is the only
        route that needs no token. The body is JSON, but no Content-Type is set,
        so it is served as `text/plain` by content sniffing.
      operationId: healthCheck
      security: []
      tags: [Health]
      responses:
        "200":
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  # ── Cloud editor ────────────────────────────────────────────────────────────

  /code-server:
    post:
      summary: Get or create the caller's Cloud Editor
      description: >
        Idempotent get-or-create of the caller's Cloud Editor (code-server) for
        a project, optionally scoped to a source component. The editor runs as a
        hidden OpenChoreo component whose name is derived from (user, project,
        component), so repeated calls address the same editor with no stored
        state. The editor identity is the token's `sub` claim; `userId` is only
        a consistency check.

        An existing editor on the same image with unchanged deployment settings
        is resumed in place (`resumed`) — a redeploy would restart the pod and
        discard any uncommitted workspace state. A resumed editor that is
        serving is still restarted once when its stored platform token is
        missing or within two minutes of expiry, since the token refresh is a
        write to its environment. A changed image or changed settings redeploys
        it. The call waits up to `CODE_SERVER_PROVISION_TIMEOUT` seconds
        (default 20) for the editor to serve — counted from after the create or
        deploy calls, and bounded by the server's 30 s write timeout — then
        hands over to the client: `editorUrl` is set only once the editor
        answers, and otherwise the client polls `GET /code-server` until `ready`
        is true. There is no failed status — a stalled editor keeps reporting
        `provisioning` or `starting`.
      operationId: createCodeServer
      tags: [Cloud Editor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCodeServerInput"
      responses:
        "200":
          description: Editor created, resumed, or still coming up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeServerResult"
        "400":
          description: >
            Invalid body, missing `projectId`, or an `imageUrl` whose repository
            differs from the configured editor image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >
            Missing or malformed bearer token, a required claim is absent, an
            upstream rejected the token, or the token has no `sub` claim (the
            editor identity).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`userId` does not match the authenticated user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            The project cannot host an editor because it has no data-plane
            namespace. Not retryable — the project has to be recreated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The Cloud Editor is not configured in this environment (`CODE_SERVER_IMAGE` unset)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: >
            The client went away or the gateway timed out mid-provision. The
            rollout continues; retry the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      summary: Poll the caller's Cloud Editor
      description: >
        Read-only status/URL poll used while a create is still provisioning.
        Same response shape as the POST; `status` is `provisioning` (not routed
        yet), `starting` (address known in `pendingEditorUrl`, editor not
        serving) or `created` (`editorUrl` set, `ready` true). Never creates or
        resumes an editor.
      operationId: getCodeServer
      tags: [Cloud Editor]
      parameters:
        - name: projectId
          in: query
          required: true
          description: Project name the editor belongs to.
          schema:
            type: string
          example: default-project
        - name: componentId
          in: query
          required: false
          description: >
            Source component the editor was opened for. Empty or the literal
            `null` addresses the project-level editor.
          schema:
            type: string
        - name: userId
          in: query
          required: false
          description: >
            Advisory. The editor identity comes from the token's `sub` claim; a
            value that disagrees with it is rejected with 403.
          schema:
            type: string
      responses:
        "200":
          description: Current editor status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeServerResult"
        "400":
          description: Missing `projectId`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >
            Missing or malformed bearer token, a required claim is absent, an
            upstream rejected the token, or the token has no `sub` claim (the
            editor identity).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`userId` does not match the authenticated user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No editor exists for this user, project and component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The Cloud Editor is not configured in this environment (`CODE_SERVER_IMAGE` unset)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: The client went away or the gateway timed out; retry the poll.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /samples/images:
    get:
      summary: List deployable sample images
      description: >
        Advertises the configured Cloud Editor image as the only sample image.
        The list is empty when `CODE_SERVER_IMAGE` is unset, which makes the
        console hide its editor entry points — that is the feature's on/off
        switch from the console's point of view.
      operationId: listSampleImages
      tags: [Cloud Editor]
      responses:
        "200":
          description: Zero or one sample image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleImageList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Organizations ───────────────────────────────────────────────────────────

  /orgs:
    get:
      summary: List the caller's organizations
      description: >
        Returns the caller's organization as a one-element list. Tokens are
        org-scoped, so the handle comes from the JWT `ouHandle` claim. The UUID
        is the organization id from the billing service when
        `BILLING_SERVICE_BASE_URL` is set (falling back to the JWT `ouId` claim
        if billing fails), and the `ouId` claim otherwise.

        The billing lookup passes `BILLING_PRODUCT_CODE`; per the billing
        client, the billing service then also activates the organization's
        subscription for that product on first login, so this GET can have
        that side effect.
      operationId: listOrgs
      tags: [Organizations]
      responses:
        "200":
          description: The caller's organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgEntryList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orgs/validate:
    get:
      summary: Validate an organization name
      description: >
        Safe default: always reports the name as available. Organizations are
        provisioned out of band, never from the console, so there is no name
        to check here.
      operationId: validateOrgName
      tags: [Organizations]
      responses:
        "200":
          description: 'Always `{"available": true}`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orgs/{orgNumericId}/projects:
    parameters:
      - $ref: "#/components/parameters/orgNumericId"

    get:
      summary: List projects by numeric organization id
      description: >
        Safe default: always an empty list. Organizations have no numeric id on
        this platform; projects are listed through `GET /projects`, which scopes
        by the caller's token.
      operationId: listOrgProjects
      tags: [Organizations]
      responses:
        "200":
          description: Always an empty list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orgs/{orgNumericId}/projects/default:
    parameters:
      - $ref: "#/components/parameters/orgNumericId"

    post:
      summary: Create the organization's default project
      description: >
        Safe default: creates nothing and always returns
        `{"id": "", "handler": "default"}`. Organization bootstrap happens out
        of band, not from the console.
      operationId: createOrgDefaultProject
      tags: [Organizations]
      responses:
        "200":
          description: Placeholder default-project reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultProjectRef"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orgs/{orgUuid}/component-limits:
    parameters:
      - $ref: "#/components/parameters/orgUuid"

    get:
      summary: Get the organization's component counts
      description: >
        Safe default: always zero counts. OpenChoreo has no component-quota
        concept to read from; plan limits are enforced upstream on create and
        surface as 402 there. `orgUuid` is ignored.
      operationId: getOrgComponentLimits
      tags: [Organizations]
      responses:
        "200":
          description: Always zero counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgComponentLimits"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orgs/{orgUuid}/subscriptions:
    parameters:
      - $ref: "#/components/parameters/orgUuid"

    get:
      summary: List the organization's subscriptions
      description: >
        Returns the active subscription for the configured billing product
        (`BILLING_PRODUCT_CODE`) as reported by the billing service for the
        caller's token. `orgUuid` is ignored — the organization is the one the
        token is scoped to. The list is empty when `BILLING_SERVICE_BASE_URL`
        is unset, when the organization has no subscription, or when the
        billing call fails (logged, not surfaced). Per the billing client, the
        billing service activates the organization's subscription for
        `BILLING_PRODUCT_CODE` on first login, so this GET can have that side
        effect.
      operationId: listOrgSubscriptions
      tags: [Organizations]
      responses:
        "200":
          description: Zero or one subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSubscriptionList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Repositories ────────────────────────────────────────────────────────────

  /repos/{owner}/{repo}/branches:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"

    get:
      summary: List a GitHub repository's branches
      description: >
        Populates the branch picker in the create-component flow. Calls the
        GitHub API (`GITHUB_API_BASE_URL`), authenticated with `GITHUB_TOKEN`
        when set and anonymously otherwise, which covers public repositories
        within GitHub's rate limits. Returns at most the first 100 branches;
        `isDefault` is false on every branch when the default-branch lookup
        fails. Any GitHub failure yields an empty list rather than an error.
      operationId: listRepoBranches
      tags: [Repositories]
      responses:
        "200":
          description: Branches of the repository (empty on any upstream failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoBranchList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /repos/{owner}/{repo}/contents:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"

    get:
      summary: Get a GitHub repository's file tree
      description: >
        Returns the whole tree of a branch in one call (a single recursive
        trees-API request to GitHub), nested from the repository root, so the
        create-component flow can browse and pick a subdirectory. GitHub
        truncates very large trees; a truncated tree is returned as-is. Any
        GitHub failure yields an empty list rather than an error.
      operationId: getRepoContents
      tags: [Repositories]
      parameters:
        - name: branch
          in: query
          required: false
          description: Branch or other ref. Defaults to the repository's default branch.
          schema:
            type: string
          example: main
      responses:
        "200":
          description: Top-level tree entries with nested children (empty on any upstream failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoTree"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Ballerina Central ───────────────────────────────────────────────────────

  /ballerina-central/token:
    get:
      summary: Get the organization's Ballerina Central token status
      description: >
        Reports whether the organization has a Ballerina Central access token
        configured, and when it was added and expires. The token value itself
        is never returned. Reports `configured: false` when token management
        is not configured (`SECRET_MANAGER_API_BASE_URL` unset). `expiresOn`
        is read from a stored label that saving a token without an `exp` claim
        does not clear, so after such a save it can still report the previous
        token's expiry. Any org member may call this.
      operationId: getBallerinaCentralToken
      tags: [Ballerina Central]
      responses:
        "200":
          description: Token status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalCentralTokenDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      summary: Save the organization's Ballerina Central token
      description: >
        Verifies the token against Ballerina Central, then stores it as the
        organization's single Ballerina Central secret, which Ballerina builds
        mount to pull private packages. Replacing an active token keeps its
        original `addedOn`; `expiresOn` is recomputed from the new token's
        `exp` claim and is omitted when the token is not a JWT with one. Any
        org member may call this.
      operationId: saveBallerinaCentralToken
      tags: [Ballerina Central]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveBalCentralTokenRequest"
      responses:
        "200":
          description: Token verified and saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalCentralTokenDetails"
        "400":
          description: >
            Invalid body, missing `token`, or Ballerina Central rejected the
            token. Do not retry with the same token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: >
            Ballerina Central could not verify the token: a network error, a
            timeout, or any Ballerina Central status other than 2xx, 401 or 403
            (e.g. 429, 5xx). The token may be valid; retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Token management is not configured (`SECRET_MANAGER_API_BASE_URL` unset)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      summary: Remove the organization's Ballerina Central token
      description: >
        Blanks the stored token and marks it inactive. The secret itself is kept
        so builds already pointed at it sync to an empty value instead of a dead
        reference. Idempotent — succeeds when no token was ever configured.
      operationId: removeBallerinaCentralToken
      tags: [Ballerina Central]
      responses:
        "204":
          description: Token removed (or none was configured)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Token management is not configured (`SECRET_MANAGER_API_BASE_URL` unset)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Proxies ─────────────────────────────────────────────────────────────────
  # Both proxies are wildcard subtrees in the router: every method under the
  # prefix is forwarded. OpenAPI cannot express a multi-segment wildcard, so each
  # is documented as a single {proxyPath} item.

  /observability/{proxyPath}:
    parameters:
      - name: proxyPath
        in: path
        required: true
        description: >
          Remainder of the request path after `/observability`. Spans any number
          of segments (e.g. `api/v1/logs/query`); the client sends it unencoded.
        schema:
          type: string
    description: >
      Transparent proxy to the observability service at
      `OBSERVABILITY_SERVICE_BASE_URL`, with the `/observability` prefix
      stripped. Every method is forwarded with the caller's headers (minus
      hop-by-hop headers), query string, body and bearer token; the upstream
      status, headers and body are returned verbatim — including upstream
      401, 502 and 503 responses, whose bodies are the upstream's. Responds
      503 when `OBSERVABILITY_SERVICE_BASE_URL` is unset. Errors produced by
      the proxy itself (500, 502, 503) carry an ErrorResponse-shaped body
      served as `text/plain`. The forwarded path is the decoded request path.
    get:
      summary: Forward a GET to the observability service
      operationId: proxyObservabilityGet
      tags: [Proxies]
      responses:
        default:
          description: Upstream response, passed through verbatim
        "401":
          description: >
            Missing or malformed bearer token or a required claim is absent
            (JSON ErrorResponse), or the same status returned by the upstream
            (body passed through)
        "500":
          description: >
            The proxy could not build the upstream request (ErrorResponse-shaped
            body served as `text/plain`)
        "502":
          description: Upstream request failed, or the same status returned by the upstream
        "503":
          description: >
            Observability proxy not configured (`OBSERVABILITY_SERVICE_BASE_URL`
            unset), or the same status returned by the upstream
    post:
      summary: Forward a POST to the observability service
      operationId: proxyObservabilityPost
      tags: [Proxies]
      responses:
        default:
          description: Upstream response, passed through verbatim
        "401":
          description: >
            Missing or malformed bearer token or a required claim is absent
            (JSON ErrorResponse), or the same status returned by the upstream
            (body passed through)
        "500":
          description: >
            The proxy could not build the upstream request (ErrorResponse-shaped
            body served as `text/plain`)
        "502":
          description: Upstream request failed, or the same status returned by the upstream
        "503":
          description: >
            Observability proxy not configured (`OBSERVABILITY_SERVICE_BASE_URL`
            unset), or the same status returned by the upstream
    put:
      summary: Forward a PUT to the observability service
      operationId: proxyObservabilityPut
      tags: [Proxies]
      responses:
        default:
          description: Upstream response, passed through verbatim
        "401":
          description: >
            Missing or malformed bearer token or a required claim is absent
            (JSON ErrorResponse), or the same status returned by the upstream
            (body passed through)
        "500":
          description: >
            The proxy could not build the upstream request (ErrorResponse-shaped
            body served as `text/plain`)
        "502":
          description: Upstream request failed, or the same status returned by the upstream
        "503":
          description: >
            Observability proxy not configured (`OBSERVABILITY_SERVICE_BASE_URL`
            unset), or the same status returned by the upstream
    patch:
      summary: Forward a PATCH to the observability service
      operationId: proxyObservabilityPatch
      tags: [Proxies]
      responses:
        default:
          description: Upstream response, passed through verbatim
        "401":
          description: >
            Missing or malformed bearer token or a required claim is absent
            (JSON ErrorResponse), or the same status returned by the upstream
            (body passed through)
        "500":
          description: >
            The proxy could not build the upstream request (ErrorResponse-shaped
            body served as `text/plain`)
        "502":
          description: Upstream request failed, or the same status returned by the upstream
        "503":
          description: >
            Observability proxy not configured (`OBSERVABILITY_SERVICE_BASE_URL`
            unset), or the same status returned by the upstream
    delete:
      summary: Forward a DELETE to the observability service
      operationId: proxyObservabilityDelete
      tags: [Proxies]
      responses:
        default:
          description: Upstream response, passed through verbatim
        "401":
          description: >
            Missing or malformed bearer token or a required claim is absent
            (JSON ErrorResponse), or the same status returned by the upstream
            (body passed through)
        "500":
          description: >
            The proxy could not build the upstream request (ErrorResponse-shaped
            body served as `text/plain`)
        "502":
          description: Upstream request failed, or the same status returned by the upstream
        "503":
          description: >
            Observability proxy not configured (`OBSERVABILITY_SERVICE_BASE_URL`
            unset), or the same status returned by the upstream

  /git/{proxyPath}:
    parameters:
      - name: proxyPath
        in: path
        required: true
        description: >
          Remainder of the request path after `/git`. Spans any number of
          segments; the client sends it unencoded.
        schema:
          type: string
    description: >
      Transparent proxy to the git integration (git-app-service), which sits
      behind the same platform API gateway as OpenChoreo:
      `PLATFORM_API_SERVICE_BASE_URL` with the `/git` prefix kept, and the
      `PLATFORM_API_SERVICE_HOST` Host header when set. Every method is
      forwarded with the caller's headers (minus hop-by-hop headers), query
      string, body and bearer token; the upstream status, headers and body are
      returned verbatim. A POST to any path ending in `/build-secret` is
      refused with 403: clone secrets are minted by the build trigger, never
      by the console. Upstream 401 and 502 responses pass through with the
      upstream's body. Errors produced by the proxy itself (403, 500, 502)
      carry an ErrorResponse-shaped body served as `text/plain`. The forwarded
      path is the decoded request path. `PLATFORM_API_SERVICE_BASE_URL` is a
      required setting, so this proxy is always configured.
    get:
      summary: Forward a GET to the git integration
      operationId: proxyGitGet
      tags: [Proxies]
      responses:
        default:
          description: Upstream response, passed through verbatim
        "401":
          description: >
            Missing or malformed bearer token or a required claim is absent
            (JSON ErrorResponse), or the same status returned by the upstream
            (body passed through)
        "500":
          description: >
            The proxy could not build the upstream request (ErrorResponse-shaped
            body served as `text/plain`)
        "502":
          description: Upstream request failed, or the same status returned by the upstream
    post:
      summary: Forward a POST to the git integration
      operationId: proxyGitPost
      tags: [Proxies]
      responses:
        default:
          description: Upstream response, passed through verbatim
        "401":
          description: >
            Missing or malformed bearer token or a required claim is absent
            (JSON ErrorResponse), or the same status returned by the upstream
            (body passed through)
        "500":
          description: >
            The proxy could not build the upstream request (ErrorResponse-shaped
            body served as `text/plain`)
        "403":
          description: The path ends in `/build-secret`; build secrets are provisioned by the build trigger
        "502":
          description: Upstream request failed, or the same status returned by the upstream
    put:
      summary: Forward a PUT to the git integration
      operationId: proxyGitPut
      tags: [Proxies]
      responses:
        default:
          description: Upstream response, passed through verbatim
        "401":
          description: >
            Missing or malformed bearer token or a required claim is absent
            (JSON ErrorResponse), or the same status returned by the upstream
            (body passed through)
        "500":
          description: >
            The proxy could not build the upstream request (ErrorResponse-shaped
            body served as `text/plain`)
        "502":
          description: Upstream request failed, or the same status returned by the upstream
    patch:
      summary: Forward a PATCH to the git integration
      operationId: proxyGitPatch
      tags: [Proxies]
      responses:
        default:
          description: Upstream response, passed through verbatim
        "401":
          description: >
            Missing or malformed bearer token or a required claim is absent
            (JSON ErrorResponse), or the same status returned by the upstream
            (body passed through)
        "500":
          description: >
            The proxy could not build the upstream request (ErrorResponse-shaped
            body served as `text/plain`)
        "502":
          description: Upstream request failed, or the same status returned by the upstream
    delete:
      summary: Forward a DELETE to the git integration
      operationId: proxyGitDelete
      tags: [Proxies]
      responses:
        default:
          description: Upstream response, passed through verbatim
        "401":
          description: >
            Missing or malformed bearer token or a required claim is absent
            (JSON ErrorResponse), or the same status returned by the upstream
            (body passed through)
        "500":
          description: >
            The proxy could not build the upstream request (ErrorResponse-shaped
            body served as `text/plain`)
        "502":
          description: Upstream request failed, or the same status returned by the upstream

  /analytics/id-token:
    description: >
      Proxy to platform-api's Moesif viewer-token route for the API Insights
      page: `CLOUD_ANALYTICS_UPSTREAM_URL` (platform-api's root, which is not
      reachable from the browser) at `/cloud/analytics/id-token`, and the
      `PLATFORM_API_SERVICE_HOST` Host header when set. The caller's headers
      and bearer token are forwarded; platform-api derives the organization
      from the token. The upstream status, headers and body are returned
      verbatim. Only this route is proxied: the other `/cloud/analytics`
      routes return collector credentials and stay internal.
    get:
      summary: Get a Moesif dashboard-viewer token for the caller's organization
      operationId: proxyAnalyticsViewerToken
      tags: [Proxies]
      responses:
        "200":
          description: "`{ \"token\": \"...\" }`, passed through from platform-api; every response is `Cache-Control: no-store`"
        default:
          description: Upstream response, passed through verbatim
        "401":
          description: >
            Missing or malformed bearer token or a required claim is absent
            (JSON ErrorResponse), or the same status returned by the upstream
            (body passed through)
        "502":
          description: Upstream request failed, or the same status returned by the upstream
        "503":
          description: "`CLOUD_ANALYTICS_UPSTREAM_URL` is not set (ErrorResponse-shaped body served as `text/plain`)"

  # ── Projects ────────────────────────────────────────────────────────────────

  /projects:
    get:
      summary: List projects
      description: >
        Lists the projects of the caller's organization (from the JWT). At most
        20 projects are returned per call. `cursor` is forwarded to OpenChoreo,
        but the response carries no continuation cursor.
      operationId: listProjects
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Projects of the caller's organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      summary: Create a project
      description: >
        Creates the project and then its per-environment release bindings. A
        repository link in the body is stored only when gitProvider,
        gitOrganization, repository and branch are all present; an incomplete
        link is dropped rather than rejected, so a create never fails over
        optional metadata.

        Creating a project whose name already exists succeeds when the existing
        project matches the request (same display name, description, and — when
        sent — pipeline and repository link), and completes any release bindings
        a previous attempt left missing. That makes a create that failed with
        503 safe to retry as-is. A mismatching project is a 409.

        400 covers only a malformed body or a missing `name`; a request
        OpenChoreo rejects (e.g. a name it does not accept) fails with 500.
      operationId: createProject
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created (or a matching existing project reused)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A different project with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >
            The project was created but its release bindings are incomplete.
            Retrying the same request completes them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/handler-availability:
    get:
      summary: Check whether a project handler is free
      description: >
        The handler is the project's resource name, so the check is a lookup of
        that name in the caller's organization. When it is taken, a suffixed
        alternative (at most 25 characters) is proposed so the console can offer
        it instead of only rejecting the input.
      operationId: checkProjectHandlerAvailability
      tags: [Projects]
      parameters:
        - name: candidate
          in: query
          required: true
          description: Proposed project handler.
          schema:
            type: string
          example: my-project
      responses:
        "200":
          description: Availability of the candidate handler
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHandlerAvailability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectName}:
    parameters:
      - $ref: "#/components/parameters/projectName"

    get:
      summary: Get a project
      operationId: getProject
      tags: [Projects]
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      summary: Update a project
      description: >
        Applies only the fields that are set; empty fields leave the current
        value in place. The repository link is not touched — use
        `PUT /projects/{projectName}/repository` for that.
      operationId: updateProject
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      summary: Delete a project
      description: >
        Deletes the project's Cloud Editor components first and refuses to
        continue (500) if any of them cannot be deleted: billing counts editors
        only from their own delete, so an editor removed as part of the project
        would stay on the organization's quota. The APIs of exposed endpoints in
        the project are unexposed after the delete (best-effort). Deletion is
        asynchronous — until it completes the project keeps appearing with
        `deleting: true`.
      operationId: deleteProject
      tags: [Projects]
      responses:
        "204":
          description: Delete accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectName}/repository:
    parameters:
      - $ref: "#/components/parameters/projectName"

    put:
      summary: Link a git repository to a project
      description: >-
        Records the repository a project is linked to. Repository metadata only —
        linking triggers no build, webhook or component discovery. Every field is
        rewritten on every call, so gitProvider, gitOrganization, repository and
        branch are jointly required, and `directoryPath`/`isPublicRepo` are stored
        as sent ("" and false are values, not "leave untouched").
      operationId: linkProjectRepository
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkProjectRepositoryRequest"
      responses:
        "200":
          description: Project with the linked repository
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectName}/contributors:
    parameters:
      - $ref: "#/components/parameters/projectName"

    get:
      summary: List project contributors
      description: >
        Aggregates commit authors (by email) across the recent commit history of
        the project's first 100 components, sorted by contribution count,
        highest first. Commits with no author email are not counted, and a
        component whose history no git provider can answer contributes nothing,
        so the list can be partial or empty rather than an error.
      operationId: getProjectContributors
      tags: [Projects]
      responses:
        "200":
          description: Contributors to the project's components
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectContributorList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /knowledge-bases:
    get:
      summary: List the organization's knowledge bases
      operationId: listKnowledgeBases
      tags: [Knowledge Bases]
      responses:
        "200":
          description: Knowledge bases, with their data sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      summary: Create a knowledge base
      description: >
        Deploys a KB Service to the organization's development environment and
        stores its settings in a Config Group linked to it. With `dataSource`, also
        adds that data source; the knowledge base is created even if the data source
        is not, and the response says whether its first ingestion started.
      operationId: createKnowledgeBase
      tags: [Knowledge Bases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeBaseRequest"
      responses:
        "201":
          description: Knowledge base created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The name is taken, or the organization has no development environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /knowledge-bases/{knowledgeBase}:
    parameters:
      - name: knowledgeBase
        in: path
        required: true
        schema:
          type: string
        example: docs-kb

    get:
      summary: Get a knowledge base and its data sources
      operationId: getKnowledgeBase
      tags: [Knowledge Bases]
      responses:
        "200":
          description: Knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      summary: Update a knowledge base's settings
      description: >
        Replaces the settings in the knowledge base's Config Group, which the KB
        Service and every data source read, then restarts the KB Service. A data
        source picks them up on its next run.
      operationId: updateKnowledgeBase
      tags: [Knowledge Bases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKnowledgeBaseRequest"
      responses:
        "200":
          description: Knowledge base updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      summary: Delete a knowledge base
      description: >
        Refused with 409 while data sources still feed it; delete them first
        through the component routes. The vector store itself is not touched.
      operationId: deleteKnowledgeBase
      tags: [Knowledge Bases]
      responses:
        "200":
          description: Knowledge base deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The knowledge base still has data sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /knowledge-bases/{knowledgeBase}/data-sources:
    parameters:
      - name: knowledgeBase
        in: path
        required: true
        schema:
          type: string
        example: docs-kb

    post:
      summary: Add a data source to a knowledge base
      description: >
        Deploys an ingestion job that uses the knowledge base's settings. With a
        `cronExpression` it runs on that schedule; without one it runs once,
        now. Its schedule, runs and deletion are then served by the component
        routes.
      operationId: createKnowledgeBaseDataSource
      tags: [Knowledge Bases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeBaseDataSourceRequest"
      responses:
        "201":
          description: Data source created and deploying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseDataSource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The name is used by another component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /knowledge-bases/{knowledgeBase}/retrieve:
    parameters:
      - name: knowledgeBase
        in: path
        required: true
        schema:
          type: string
        example: docs-kb

    post:
      summary: Query a knowledge base
      description: >
        Forwards the body and its content type to the KB Service's
        `POST /retrieve` and returns its JSON response unchanged. 503 while the
        service is not routed or still starting.
      operationId: retrieveFromKnowledgeBase
      tags: [Knowledge Bases]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [user_query]
              properties:
                rag_component_id:
                  type: string
                user_query:
                  type: string
                max_retrieve_chunks:
                  type: integer
                  example: 5
                min_similarity_threshold:
                  type: number
                  example: 0.7
      responses:
        "200":
          description: The KB Service's response
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  retrieved_chunks:
                    type: array
                    items:
                      type: object
                      properties:
                        text:
                          type: string
                        source:
                          type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          description: The body is neither form-encoded nor JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

# ── Components ───────────────────────────────────────────────────────────────

  /projects/{projectName}/components:
    parameters:
      - $ref: "#/components/parameters/projectName"

    get:
      summary: List a project's components
      description: >
        Same as `GET /components?projectName={projectName}`. Cloud Editor
        instances are system-managed and are excluded. At most 100 components
        are returned; the response carries no continuation cursor.
      operationId: listProjectComponents
      tags: [Components]
      parameters:
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Components of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      summary: Create a component in a project
      description: >
        Same as `POST /components`. The owning project is taken from the body's
        `spec.owner.projectName`; the `projectName` path segment is not used to
        place the component.
      operationId: createProjectComponent
      tags: [Components]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComponentRequest"
      responses:
        "201":
          description: >
            Component created. Read the final name from `id`/`handler`; it
            carries a suffix when the requested name was taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedComponent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "409":
          description: >
            The name and every suffixed retry conflicted with existing
            components. For `proxy/agent-api` components there is no suffixed
            retry: agent-manager's 409 (name in use, or configuration left by a
            deleted agent) is returned directly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: An AI agent component was requested but agent-manager is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectName}/components/name-availability:
    parameters:
      - $ref: "#/components/parameters/projectName"

    get:
      summary: Check whether a component name is free
      description: >
        Component names are org-scoped in OpenChoreo (the project is only a
        label), so the candidate is looked up org-wide and the `projectName` path
        segment does not affect the result. When the name is taken, a suffixed
        alternative is proposed.
      operationId: checkComponentNameAvailability
      tags: [Components]
      parameters:
        - name: candidate
          in: query
          required: true
          description: Proposed component name.
          schema:
            type: string
          example: hello-world-service
      responses:
        "200":
          description: Availability of the candidate name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentNameAvailability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectName}/components/{componentName}:
    parameters:
      - $ref: "#/components/parameters/projectName"
      - $ref: "#/components/parameters/componentName"

    get:
      summary: Get component detail
      description: >
        The component with its deployment tracks. Each track is also listed in
        `apiVersions`, carrying the track's API version (empty for a
        component created without tracks), for console pages that select a
        track as a version. A component of another project is a 404, the same
        as one that does not exist.
      operationId: getProjectComponent
      tags: [Components]
      responses:
        "200":
          description: The component and its deployment tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      summary: Update a component in a project
      description: Same as `PUT /components/{componentName}?projectName={projectName}`.
      operationId: updateProjectComponent
      tags: [Components]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComponentRequest"
      responses:
        "200":
          description: Updated component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      summary: Delete a component in a project
      description: Same as `DELETE /components/{componentName}?projectName={projectName}`.
      operationId: deleteProjectComponent
      tags: [Components]
      responses:
        "204":
          description: Delete accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /components:
    get:
      summary: List components
      description: >
        Lists the components of one project. Cloud Editor instances are
        system-managed and are excluded. At most 100 components are returned;
        the response carries no continuation cursor.
      operationId: listComponents
      tags: [Components]
      parameters:
        - name: projectName
          in: query
          required: false
          description: >
            Project to list. Sent upstream as the label selector
            `openchoreo.dev/project=<projectName>`, so omitting it does not widen
            the list to the whole organization.
          schema:
            type: string
          example: default-project
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Components of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      summary: Create a component
      description: >
        Creates the component from a K8s-style body that mirrors the OpenChoreo
        Component resource; the owning project is `spec.owner.projectName`.

        Component names are org-scoped, so a name minted from a display label
        can collide with a component in any project. On a conflict the create is
        retried with a random suffix and the original name kept as the display
        name — act on the `id`/`handler` in the response, not the name that was
        sent. 409 is returned only when every suffixed retry also conflicted.

        With `spec.autoDeploy` the project's release bindings are ensured first.
        With `spec.autoBuild` the initial build is started; a failure to start it
        does not fail the create. For private repositories, `githubApp` or
        `azureDevOps` carries the source binding, which is stored under the final component
        name and never forwarded to OpenChoreo; if storing it fails, the initial
        build is skipped and `warning` says so. Components of type
        `proxy/agent-api` (AI agents) are created through agent-manager instead.

        Only `metadata.name` is validated here (400 when empty). The rest of the
        body goes upstream as sent, so a spec OpenChoreo rejects — for example
        one without `spec.owner.projectName` — fails with 500.
      operationId: createComponent
      tags: [Components]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComponentRequest"
            examples:
              ballerina:
                summary: Ballerina integration exposed as an API
                value:
                  metadata:
                    name: hello-world-service
                    annotations:
                      openchoreo.dev/display-name: Hello World Service
                  spec:
                    owner:
                      projectName: default-project
                    componentType:
                      kind: ComponentType
                      name: deployment/integration-as-api
                    autoDeploy: true
                    autoBuild: true
                    workflow:
                      kind: ClusterWorkflow
                      name: ballerina-buildpack-builder
                      parameters:
                        repository:
                          url: https://github.com/wso2/integration-samples.git
                          revision:
                            branch: main
                          appPath: /ballerina-integrator/hello-world-service
      responses:
        "201":
          description: >
            Component created. Read the final name from `id`/`handler`; it
            carries a suffix when the requested name was taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedComponent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "409":
          description: >
            The name and every suffixed retry conflicted with existing
            components. For `proxy/agent-api` components there is no suffixed
            retry: agent-manager's 409 (name in use, or configuration left by a
            deleted agent) is returned directly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: An AI agent component was requested but agent-manager is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /components/{componentName}:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/projectNameQuery"

    put:
      summary: Update a component
      description: >
        Updates the display name, description and labels. Empty strings leave
        the current value in place; `labels` omitted leaves the labels untouched,
        while an empty array clears them.
      operationId: updateComponent
      tags: [Components]
      parameters:
        - name: projectName
          in: query
          required: false
          description: Accepted but unused.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComponentRequest"
      responses:
        "200":
          description: Updated component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      summary: Delete a component
      description: >
        Deletes the component and then unexposes the APIs of its exposed
        endpoints (best-effort; the delete is not failed over them). When
        `projectName` is omitted it is resolved from the component's owner. AI
        agent components are deleted through agent-manager. Deletion is
        asynchronous — until it completes the component keeps appearing with
        `deleting: true`.
      operationId: deleteComponent
      tags: [Components]
      responses:
        "204":
          description: Delete accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/build-parameters:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/projectNameQuery"

    put:
      summary: Update a component's build configuration
      description: >
        Sends OpenChoreo a PATCH of the component carrying the new workflow
        (build type, repository, revision, app path) and
        `spec.owner.projectName` from the `projectName` query parameter. Only
        the workflow is mutable through this call.
      operationId: updateBuildParameters
      tags: [Builds]
      parameters:
        - name: projectName
          in: query
          required: false
          description: >
            Sent as `spec.owner.projectName` in the patch; omitting it sends an
            empty owner project.
          schema:
            type: string
          example: default-project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBuildParametersRequest"
      responses:
        "200":
          description: >
            Updated component, in the internal (OpenChoreo-normalized) shape
            rather than the `Component` shape the other component routes return.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentModel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/repository:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/projectNameQuery"

    get:
      summary: Get a component's source repository
      description: >
        Derived from the component's workflow repository
        (`spec.workflow.parameters.repository`): provider, organization and repo
        name are parsed from the URL, and `treeUrl` links to the repository tree
        at the component's branch and app path. A component with no repository
        configured returns an empty object. `projectName` is accepted but unused.
      operationId: getComponentRepository
      tags: [Components]
      responses:
        "200":
          description: Repository of the component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentRepository"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Lookup failed, including when the component does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /components/{componentName}/buildpack-config:
    parameters:
      - $ref: "#/components/parameters/componentName"

    put:
      summary: Update a component's build settings
      description: >
        GET-then-PUT of the component's build workflow parameters
        (`spec.workflow.parameters.unitTest`, `submodules` and `buildEnv`),
        applied in one write; later builds use them. Fields left out are
        unchanged. Disabling unit tests or submodule pulls, or clearing
        variables, on a build workflow without that support is a no-op.
      operationId: updateBuildpackConfig
      tags: [Builds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBuildpackConfigRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "400":
          description: >
            Malformed body, an invalid build environment variable, or a setting
            the component's build workflow does not support.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/commit-history:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/projectNameQuery"

    get:
      summary: List recent commits of a component's source
      description: >
        Up to 30 recent commits, newest first, read from the git provider:
        through the GitHub App binding for private repositories, otherwise from
        GitHub directly (scoped to the component's app path). Build records are
        not used as a fallback — they name a commit but carry no message or
        author — so when no provider can answer (non-GitHub host, provider
        unavailable) the list is empty, not an error.
      operationId: getCommitHistory
      tags: [Components]
      parameters:
        - name: branch
          in: query
          required: false
          description: Branch to read. Defaults to the component's configured branch.
          schema:
            type: string
          example: main
      responses:
        "200":
          description: Recent commits (possibly empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /components/{componentName}/deployment-track:
    parameters:
      - $ref: "#/components/parameters/componentName"

    get:
      summary: Get a component's default deployment track
      description: >
        The track a request that names none acts on. For a component created
        with deployment tracks, that is its oldest track. A component created
        without them has a single track, synthesized from the component's
        workflow repository (branch, commit, URL, app path); one with no
        repository configured returns an empty track.
      operationId: getDeploymentTrack
      tags: [Deployment Tracks]
      responses:
        "200":
          description: The component's default deployment track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentTrack"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /components/{componentName}/deployment-tracks:
    parameters:
      - $ref: "#/components/parameters/componentName"

    get:
      summary: List a component's deployment tracks
      description: >
        Each track of a component created with deployment tracks builds one
        branch and deploys independently. A component created without them
        lists its single synthesized track.
      operationId: listDeploymentTracks
      tags: [Deployment Tracks]
      responses:
        "200":
          description: The component's deployment tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentTrackList"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      summary: Create a deployment track
      description: >
        Adds a track that builds `branch`. Only a component created with
        deployment tracks can have more than one; another component answers
        409. Each branch can belong to one track of a component. The track id is
        derived from the component and branch, so a retried create returns the
        same track.

        The track's API version is `apiVersion`, which must look like
        `v1.0` and be unique among the component's tracks (400 "API version
        must look like v1.0", 400 "API version vX.Y is already used by another
        deployment track"). Left out, it is the minor after the highest version
        the component's tracks have (v1.0, v1.3 and v2.1 give v2.2), or `v1.0`
        when none has one.
      operationId: createDeploymentTrack
      tags: [Deployment Tracks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeploymentTrackRequest"
      responses:
        "201":
          description: The created track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentTrack"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The component has a single track, or another track already builds the branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /components/{componentName}/deployment-tracks/{trackId}:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/trackId"

    put:
      summary: Update a deployment track
      description: >
        Changes only the fields sent. Changing the branch keeps the track's id;
        the new branch must not belong to another track of the component.

        A track's `apiVersion` never changes once it has one: sending a
        different one is a 400 "A deployment track's API version can't be
        changed", and sending the same one is accepted. A track that has
        none may be given one, validated as on create.
      operationId: updateDeploymentTrack
      tags: [Deployment Tracks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeploymentTrackRequest"
      responses:
        "200":
          description: The updated track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentTrack"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The component has a single track, or another track already builds the branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Delete a deployment track
      description: >
        Undeploys the track from every environment and removes its releases,
        secrets and saved configuration. Refused with 409, and the reason, when
        `deletable` would say it can't be deleted.
      operationId: deleteDeploymentTrack
      tags: [Deployment Tracks]
      responses:
        "200":
          description: The track is being deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The track can't be deleted; the message says why
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /components/{componentName}/deployment-tracks/{trackId}/deletable:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/trackId"

    get:
      summary: Check whether a deployment track can be deleted
      description: >
        An integration keeps at least one track. The default track can't be
        deleted while the integration has an exposed API, because the API routes
        to the default track's deployment. A component created without tracks
        deletes its only track with the component.
      operationId: checkDeploymentTrackDeletable
      tags: [Deployment Tracks]
      responses:
        "200":
          description: Whether the track can be deleted, and why not
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentTrackDeletable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Builds ───────────────────────────────────────────────────────────────────

  /components/{componentName}/builds:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/projectNameQuery"

    post:
      summary: Trigger a build
      description: >
        Starts a manual build workflow run. With no body (or no `sha`) the build
        uses the branch tip; `sha` pins it to that commit. Other fields the
        console sends are ignored. For private GitHub repositories the per-run
        clone secret is provisioned as part of the trigger. AI agent builds go
        through agent-manager and ignore `sha`.
      operationId: triggerBuild
      tags: [Builds]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerBuildRequest"
      responses:
        "201":
          description: Build triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerBuildResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: >
            The git integration failed: the component's source binding could
            not be read, or a private repository's clone secret could not be
            provisioned. The binding is read before every non-agent build, so
            this can affect public repositories too; retry the build.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: List builds
      description: >
        Lists the at-most-20 build workflow runs OpenChoreo returns for the
        component, sorted newest first. The sort happens after the page is
        fetched, so with more than 20 runs the newest are not guaranteed to be
        included. `cursor` is forwarded upstream but the response carries no
        continuation cursor.
      operationId: listBuilds
      tags: [Builds]
      parameters:
        - $ref: "#/components/parameters/cursor"
        - name: projectName
          in: query
          required: false
          description: Accepted but unused.
          schema:
            type: string
      responses:
        "200":
          description: Workflow runs of the component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRunList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/builds/{buildName}:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/buildName"
      - $ref: "#/components/parameters/projectNameQuery"

    get:
      summary: Get build status
      description: >
        Returns the workflow run. A build name that does not exist surfaces as a
        500, not a 404. The run is looked up by `buildName` alone;
        `componentName` and `projectName` are not checked against it.

        For an AI agent, reading a Succeeded run also reconciles the agent's
        input interface with agent-manager and redeploys it if that changed
        (best-effort; the read itself does not fail over it).
      operationId: getBuildStatus
      tags: [Builds]
      parameters:
        - name: projectName
          in: query
          required: false
          description: Accepted but unused.
          schema:
            type: string
      responses:
        "200":
          description: Build workflow run details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/builds/{buildName}/logs:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/buildName"
      - $ref: "#/components/parameters/projectNameQuery"

    get:
      summary: Get build logs
      description: >
        Returns the build's log lines from the observability service, wrapped in
        an init/build/deploy envelope for the console's log viewer: every line
        (prefixed with its timestamp when known) is in `build.log`, and `init`
        and `deploy` are always empty. At most 1000 lines from the last 30 days
        are returned, oldest first.

        Returns 503 when neither `OBSERVABILITY_SERVICE_BASE_URL` nor
        `CLOUD_OBS_LOGS_API_URL` is set. Build logs are read from
        `OBSERVABILITY_SERVICE_BASE_URL`, so with only `CLOUD_OBS_LOGS_API_URL`
        set the call fails with 500.
      operationId: getBuildLogs
      tags: [Builds]
      responses:
        "200":
          description: Build logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildRunLogs"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Deployments ─────────────────────────────────────────────────────────────

  /components/{componentName}/deployments:
    parameters:
      - $ref: "#/components/parameters/componentName"

    get:
      summary: Get the component's deployment in an environment
      description: >
        Reads the component's ReleaseBinding for the environment and returns the
        bound release, its live deployment status, the cron schedule (scheduled
        tasks) and the build that produced the deployed image. When the component
        has never been deployed to the environment the response is 200 with an
        empty body, not 404.
      operationId: getComponentDeployment
      tags: [Deployments]
      parameters:
        - name: environmentId
          in: query
          required: false
          description: Environment name. Without it no binding resolves and the body is empty.
          schema:
            type: string
          example: development
        - name: orgHandler
          in: query
          required: false
          description: >
            Accepted for console parity; ignored — component names are
            org-scoped and the org comes from the JWT.
          schema:
            type: string
        - name: orgUuid
          in: query
          required: false
          description: Accepted for console parity; ignored.
          schema:
            type: string
        - name: versionId
          in: query
          required: false
          description: Accepted for console parity; ignored.
          schema:
            type: string
      responses:
        "200":
          description: >
            The deployment, or an empty body when the component has no
            ReleaseBinding in this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentDeployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      summary: Deploy a build to an environment
      description: >
        Deploys the build named by `imageId` (a build's WorkflowRun name, as
        listed by GET .../releases). OpenChoreo's generate-release snapshots only
        the current Workload, so the Workload's image is first pinned to that
        build's image; if the build or its image cannot be resolved the current
        Workload is released as-is rather than failing. The release is then bound
        to `environmentId` (ReleaseBinding created or updated, state Active).
        `cron`/`cronTimezone` set the schedule of a scheduled task;
        `jobTimeoutSeconds` and `cronJobAllowConcurrency` are component-wide
        settings and a failure to apply them does not fail the deploy.

        AI agent components deploy through agent-manager instead, which always
        targets the pipeline's first non-production environment regardless of
        `environmentId`. For an agent an unresolvable `imageId` (unknown build,
        or a build that published no image) fails with 500 instead of falling
        back, and the schedule fields (`cron`, `cronTimezone`,
        `jobTimeoutSeconds`, `cronJobAllowConcurrency`) are ignored.
      operationId: deployDeploymentTrack
      tags: [Deployments]
      parameters:
        - $ref: "#/components/parameters/projectNameQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployDeploymentTrackInput"
      responses:
        "200":
          description: >
            Deployed. `message` is the bound release name — or, for an AI agent,
            the environment agent-manager deployed to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: >
            AI agent only — the agent has no published endpoint yet; deploy once a
            build has completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/deployments/history:
    parameters:
      - $ref: "#/components/parameters/componentName"

    get:
      summary: List the component's current deployments as build runs
      description: >
        One entry per environment the component is bound to (its current
        ReleaseBindings — OpenChoreo keeps no history of past bindings),
        rendered in the BuildRun shape. Only `sha`, `started_at`/`completed_at`
        (the release's creation time), `status`/`conclusion` (SUCCESS, FAILED or
        PENDING) and `name` (release name) carry data; the remaining fields are
        zero-valued.
      operationId: getDeploymentHistory
      tags: [Deployments]
      responses:
        "200":
          description: Current deployments, one per environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildRunList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/release-mgt-deployments:
    parameters:
      - $ref: "#/components/parameters/componentName"

    get:
      summary: List the component's current deployments (release-management shape)
      description: >
        Same source as GET .../deployments/history — the component's current
        ReleaseBindings, one per environment — returned in the
        ReleaseMgtDeployment shape. OpenChoreo has no release-management ids, so
        `release_mgt_id` is always empty and `id` is `<component>-<environment>`.
      operationId: getReleaseMgtDeployments
      tags: [Deployments]
      responses:
        "200":
          description: Current deployments, one per environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseMgtDeploymentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/deployments/promote:
    parameters:
      - $ref: "#/components/parameters/componentName"

    post:
      summary: Promote a release to another environment
      description: >
        Reads the source environment's active ReleaseBinding and binds that
        immutable ComponentRelease to the target after validating the hop against
        the project's server-resolved deployment pipeline. The compatibility
        fields `sourceReleaseId` and `deploymentPipelineId` must match that live
        state. Service promotion commits first; APIP proxy convergence is
        asynchronous. AI agent components remain on the agent-manager path.
      operationId: promote
      tags: [Deployments]
      parameters:
        - $ref: "#/components/parameters/projectNameQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteInput"
      responses:
        "200":
          description: >
            Promoted. `message` is the bound release name — or, for an AI agent,
            the environment it was promoted to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            The deployment pipeline does not allow this source → target hop (or
            source equals target), or the caller lacks permission on the pipeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Deployment pipeline not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The supplied release or pipeline does not match server-resolved source state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/deployments/redeploy:
    parameters:
      - $ref: "#/components/parameters/componentName"

    post:
      summary: Redeploy the component in an environment
      description: >
        Sets the environment's ReleaseBinding to Active and forces a pod rollout.
        The rollout is unconditional: redeploying a binding that is already
        Active would otherwise change nothing and restart nothing.
      operationId: redeployDeployment
      tags: [Deployments]
      parameters:
        - name: environment
          in: query
          required: true
          description: Environment name.
          schema:
            type: string
          example: development
      responses:
        "200":
          description: Redeployed (`message` is "redeployed")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The component has no deployment in this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/releases/{releaseId}/redeploy:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/releaseId"

    post:
      summary: Redeploy the environment a release is bound to
      description: >
        Same as POST .../deployments/redeploy, addressed by release: the
        environment is the one whose ReleaseBinding currently binds `releaseId`.
        The console's environment card carries the release, not the environment.
      operationId: redeployDeploymentByRelease
      tags: [Deployments]
      responses:
        "200":
          description: Redeployed (`message` is "redeployed")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No environment of the component is bound to this release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/deploy:
    parameters:
      - $ref: "#/components/parameters/componentName"

    post:
      summary: Release the current Workload to an environment
      description: >
        Generates a release from the component's current Workload and binds it to
        the environment (ReleaseBinding created or updated, state Active). Unlike
        POST .../deployments it does not pin a specific build. AI agent
        components deploy through agent-manager to the pipeline's first
        non-production environment.
      operationId: deploy
      tags: [Deployments]
      parameters:
        - $ref: "#/components/parameters/projectNameQuery"
        - name: environment
          in: query
          required: false
          description: Environment name.
          schema:
            type: string
            default: development
      responses:
        "200":
          description: >
            Deployed. Only `releaseId`, `cron`, `cronTimezone` (always "UTC") and
            `releaseMgtDeployment` are populated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentDeployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/deploy-prebuilt:
    parameters:
      - $ref: "#/components/parameters/componentName"

    post:
      summary: Deploy a prebuilt container image
      description: >
        Deploys a ready-made image without a build. A prebuilt component has no
        build and so no Workload; this materializes one carrying the image, the
        config schema and endpoints read from the component's repository, and the
        config values (from `configurations`, else those saved during setup),
        then generates a release and binds it to the project's first environment
        — where the project's deployment pipeline starts, else the first
        environment in the org's environment list (not promotion order). Config assembly is best-effort and does not fail the deploy.
      operationId: deployPrebuilt
      tags: [Deployments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployPrebuiltInput"
      responses:
        "202":
          description: Deployed (`message` is "deployed"); the rollout continues asynchronously
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/deployments/stop:
    parameters:
      - $ref: "#/components/parameters/componentName"

    put:
      summary: Stop the component in an environment
      description: >
        Sets the environment's ReleaseBinding to Undeploy, which removes the
        running resources but keeps the binding so the release can be redeployed.
        Only `environment` is read from the body; the other fields are accepted
        for console parity and ignored. `environment` is not validated: omitting
        it yields 404 (500 for an AI agent), not 400.
      operationId: stopDeployment
      tags: [Deployments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopDeploymentInput"
      responses:
        "200":
          description: Stopped (`message` is "stopped")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >
            The component has no deployment in this environment, or
            `environment` was omitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/releases:
    parameters:
      - $ref: "#/components/parameters/componentName"

    get:
      summary: List the component's deployable builds
      description: >
        The component's successful builds among the first 20 WorkflowRuns
        OpenChoreo returns for it, sorted newest first, in the
        DeploymentTrackImage shape. The 20-run limit is applied upstream before
        sorting, so with more than 20 builds the list is not guaranteed to hold
        the newest ones. A ComponentRelease is only created at deploy
        time, so the deployable artifacts are the builds, not the releases:
        `imageId` and `runId` are both the build's WorkflowRun name — pass it as
        `imageId` to POST .../deployments. Commit message and author are joined
        from the repository's commit history when available.
      operationId: getDeploymentTrackImages
      tags: [Deployments]
      responses:
        "200":
          description: Deployable builds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentTrackImageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/auto-deploy:
    parameters:
      - $ref: "#/components/parameters/componentName"

    patch:
      summary: Enable or disable auto-deploy
      description: >
        Sets the component's autoDeploy flag. Enabling it first ensures the
        project's environment bindings exist, so the control plane's automatic
        deploy after a build has an environment to land in.
      operationId: updateAutoDeployEnabled
      tags: [Deployments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAutoDeployInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [id, autoDeployEnabled]
                properties:
                  id:
                    type: string
                    description: The component name.
                    example: hello-world-service
                  autoDeployEnabled:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/auto-build:
    parameters:
      - $ref: "#/components/parameters/componentName"

    patch:
      summary: Enable or disable auto-build on git push
      description: >
        Auto-build is the component's own setting. For a component with
        deployment tracks it applies to all of them: a push builds each track
        whose branch it is to.
      operationId: updateAutoBuildEnabled
      tags: [Deployments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAutoBuildInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [autoBuildEnabled]
                properties:
                  autoBuildEnabled:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Deployment pipelines ────────────────────────────────────────────────────

  /deploymentpipelines:
    get:
      summary: List deployment pipelines
      operationId: listDeploymentPipelines
      tags: [Deployment Pipelines]
      responses:
        "200":
          description: Deployment pipelines of the caller's organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentPipelineList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      summary: Create a deployment pipeline
      operationId: createDeploymentPipeline
      tags: [Deployment Pipelines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeploymentPipelineRequest"
      responses:
        "201":
          description: Deployment pipeline created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentPipeline"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A deployment pipeline with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /deploymentpipelines/{pipelineName}:
    parameters:
      - $ref: "#/components/parameters/pipelineName"

    get:
      summary: Get a deployment pipeline
      operationId: getDeploymentPipeline
      tags: [Deployment Pipelines]
      responses:
        "200":
          description: Deployment pipeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentPipeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      summary: Update a deployment pipeline
      description: >
        Partial update: an empty `displayName` or `description` keeps the current
        value, and `promotionPaths` replaces the pipeline's paths only when
        present.
      operationId: updateDeploymentPipeline
      tags: [Deployment Pipelines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeploymentPipelineRequest"
      responses:
        "200":
          description: Updated deployment pipeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentPipeline"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      summary: Delete a deployment pipeline
      operationId: deleteDeploymentPipeline
      tags: [Deployment Pipelines]
      responses:
        "204":
          description: Deployment pipeline deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Environments ────────────────────────────────────────────────────────────

  /environments:
    get:
      summary: List environments
      operationId: listEnvironments
      tags: [Environments]
      responses:
        "200":
          description: Environments of the caller's organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      summary: Create an environment
      description: >
        The request uses OpenChoreo's vocabulary (`isProduction`,
        `dataPlaneRef`); the response uses the console's (`critical`, `dpId`).
      operationId: createEnvironment
      tags: [Environments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentRequest"
      responses:
        "201":
          description: Environment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "409":
          description: An environment with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /environments/{environmentName}:
    parameters:
      - $ref: "#/components/parameters/environmentName"

    get:
      summary: Get an environment
      operationId: getEnvironment
      tags: [Environments]
      responses:
        "200":
          description: Environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      summary: Update an environment
      description: >
        Partial update: an empty `displayName` or `description` keeps the current
        value, and `isProduction` changes only when present.
      operationId: updateEnvironment
      tags: [Environments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEnvironmentRequest"
      responses:
        "200":
          description: Updated environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      summary: Delete an environment
      operationId: deleteEnvironment
      tags: [Environments]
      responses:
        "204":
          description: Environment deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Data planes ─────────────────────────────────────────────────────────────

  /dataplanes:
    get:
      summary: List data planes
      description: Data planes an environment can be placed on (`dataPlaneRef` on environment create).
      operationId: listDataPlanes
      tags: [Data Planes]
      responses:
        "200":
          description: Data planes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataPlaneList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Schedules ───────────────────────────────────────────────────────────────
  #
  # A "schedule" is the component's OpenChoreo ReleaseBinding for one
  # environment. The cron fields only matter for scheduled-task components; the
  # same binding also carries state, image-pull policy, replicas and sizing for
  # every component type.

  /components/{componentName}/schedules:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/deploymentTrackId"
      - $ref: "#/components/parameters/scheduleReleaseId"

    get:
      summary: List the component's release bindings
      description: >
        Returns one ReleaseBinding per environment the component is bound to.
        `backoffLimit`, `activeDeadlineSeconds` and `concurrencyPolicy` are
        component-wide settings read from the Component's parameters and copied
        onto every item; they are omitted when those parameters cannot be read.
      operationId: listSchedules
      tags: [Schedules]
      parameters:
        - name: projectName
          in: query
          required: false
          description: Accepted but ignored; bindings are matched by component name.
          schema:
            type: string
          example: default-project
      responses:
        "200":
          description: Release bindings across environments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseBindingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      summary: Create or update the release binding for one environment
      description: >
        Creates the component's ReleaseBinding in `environment` when none exists,
        otherwise updates it. An empty or omitted `cronExpression` is written as
        a never-firing schedule (read back as "") on create and on update alike,
        so a write that should keep a running schedule — a state-only or
        resources-only write included — must resend the current cron.

        On update, an empty `releaseName` or `state` keeps the binding's current
        value, so a schedule-only write does not redeploy a stopped workload. On
        create, an empty `releaseName` generates a new ComponentRelease from the
        component's current Workload and binds it, so the first write to an
        environment deploys the component there.

        `backoffLimit`, `activeDeadlineSeconds` and `concurrencyPolicy` are
        component-wide: when any is set the Component's parameters are patched
        too (best-effort — a failed patch is logged and the binding write still
        succeeds). The response carries only the component-wide fields this
        request set, and only when that patch succeeded; GET the binding for the
        full set.
      operationId: upsertSchedule
      tags: [Schedules]
      parameters:
        - name: projectName
          in: query
          required: false
          description: >
            Project that owns the binding. Used only when the binding is created;
            when omitted the component's own project is looked up, and a project
            that cannot be resolved fails with 500.
          schema:
            type: string
          example: default-project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertReleaseBindingRequest"
            examples:
              hourly:
                summary: Run a scheduled task hourly
                value:
                  environment: development
                  cronExpression: "0 * * * *"
                  cronTimezone: Asia/Colombo
      responses:
        "200":
          description: The binding as written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseBinding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/schedules/{environment}:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environment"
      - $ref: "#/components/parameters/deploymentTrackId"
      - $ref: "#/components/parameters/scheduleReleaseId"

    get:
      summary: Get the release binding for one environment
      operationId: getSchedule
      tags: [Schedules]
      responses:
        "200":
          description: The component's binding in this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseBinding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      summary: Delete the release binding for one environment
      description: >
        Deletes the component's ReleaseBinding in this environment. This removes
        the component's deployment from the environment, not only its schedule.
      operationId: deleteSchedule
      tags: [Schedules]
      responses:
        "204":
          description: Binding deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Executions ──────────────────────────────────────────────────────────────

  /components/{componentName}/schedules/{environment}/executions:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environment"

    post:
      summary: Run a scheduled task once, now
      description: >
        Creates one run of the component's deployed CronJob through OpenChoreo's
        release-binding trigger (served on its v1alpha1 surface). The run shows
        up in the resource tree, logs and execution history like any scheduled
        run. `args`, when non-empty, overrides the container args for this run
        only; an omitted or empty `args` keeps the CronJob's own args. Only the
        job name is known at creation time, so the response carries `jobId` and
        `status: Unknown` and nothing else.
      operationId: triggerExecution
      tags: [Executions]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerExecutionRequest"
      responses:
        "201":
          description: Run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
        "400":
          description: >
            OpenChoreo rejected the trigger — it rejects any workload that is not
            a CronJob, so this normally means the component is not a scheduled task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The component has no release binding in this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          description: The control plane exposes no manual-trigger route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /components/{componentName}/releases/{releaseId}/executions:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/releaseId"

    post:
      summary: Run a scheduled task once, addressed by release
      description: >
        Same as `POST /components/{componentName}/schedules/{environment}/executions`,
        for callers that hold a release rather than an environment: the
        environment is the one whose binding currently points at `releaseId`.
      operationId: triggerExecutionByRelease
      tags: [Executions]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerExecutionRequest"
      responses:
        "201":
          description: Run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
        "400":
          description: >
            OpenChoreo rejected the trigger — it rejects any workload that is not
            a CronJob, so this normally means the component is not a scheduled task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No environment's binding points at this release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          description: The control plane exposes no manual-trigger route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /components/{componentName}/environments/{environment}/executions/history:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environment"
      - $ref: "#/components/parameters/deploymentTrackId"

    get:
      summary: List a scheduled task's past runs
      description: >
        Runs reconstructed from OpenChoreo Observer Kubernetes-event logs,
        newest first, covering up to the last 30 days (the Observer's range
        cap) — including runs whose Jobs have already been garbage-collected
        from the cluster. Page backwards by passing `nextCursor` as `before`.
        Returns an empty page when neither `OBSERVABILITY_SERVICE_BASE_URL` nor
        `CLOUD_OBS_LOGS_API_URL` is set; with only `CLOUD_OBS_LOGS_API_URL`
        unset it fails with 500. For a component with deployment tracks, only
        the track's runs are listed, told apart by the name of the track's
        CronJob; a track with no CronJob in the environment has none.
      operationId: listExecutionHistory
      tags: [Executions]
      parameters:
        - name: projectName
          in: query
          required: false
          description: >
            Sent as the Observer event query's `searchScope.project`; left out of
            the query when empty.
          schema:
            type: string
          example: default-project
        - name: limit
          in: query
          required: false
          description: >
            Runs per page. Defaults to 20; values above 100 are lowered to 100,
            and values ≤ 0 or non-integers use the default.
          schema:
            type: integer
            default: 20
        - name: before
          in: query
          required: false
          description: >
            Exclusive upper bound on a run's trigger time (RFC3339) — the previous
            page's `nextCursor`. Defaults to now. An unparseable value is ignored.
          schema:
            type: string
            format: date-time
        - name: from
          in: query
          required: false
          description: >
            Lower bound on trigger time (RFC3339). Defaults to 30 days before
            now; a value earlier than 30 days before `before` is raised to it,
            and one at or after `before` returns an empty page. An unparseable
            value is ignored.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: One page of runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionHistoryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /releases/{releaseId}/executions/history:
    parameters:
      - $ref: "#/components/parameters/releaseId"

    get:
      summary: List a scheduled task's past runs, addressed by release
      description: >
        Same as the environment-addressed history, including its behaviour when
        observability is not configured. The component and project come from
        the ComponentRelease's owner and the environment from the binding that
        points at `releaseId`, and the runs are those of the release's own
        deployment track. Returns an empty page (not 404) when no binding
        points at the release yet; an unknown `releaseId` fails with 500.
      operationId: listExecutionHistoryByRelease
      tags: [Executions]
      parameters:
        - name: limit
          in: query
          required: false
          description: >
            Runs per page. Defaults to 20; values above 100 are lowered to 100,
            and values ≤ 0 or non-integers use the default.
          schema:
            type: integer
            default: 20
        - name: before
          in: query
          required: false
          description: >
            Exclusive upper bound on a run's trigger time (RFC3339) — the previous
            page's `nextCursor`. Defaults to now. An unparseable value is ignored.
          schema:
            type: string
            format: date-time
        - name: from
          in: query
          required: false
          description: >
            Lower bound on trigger time (RFC3339). Defaults to 30 days before
            now; a value earlier than 30 days before `before` is raised to it,
            and one at or after `before` returns an empty page. An unparseable
            value is ignored.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: One page of runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionHistoryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/execution-configs:
    parameters:
      - $ref: "#/components/parameters/componentName"

    get:
      summary: Get a scheduled task's job configuration
      description: >
        Proxied to the ICP GraphQL API (`executionConfigs`), with
        `componentName` sent as the component id. Fails with 500 when
        `ICP_GRAPHQL_URL` is not configured. Fields ICP does not return are
        omitted.
      operationId: getExecutionConfigs
      tags: [Executions]
      parameters:
        - name: releaseId
          in: query
          required: false
          description: Forwarded to ICP as `releaseId`; omitted sends an empty string.
          schema:
            type: string
      responses:
        "200":
          description: Job configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionConfigs"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/executions/{runId}/arguments:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/runId"

    get:
      summary: Get the arguments a run was started with
      description: >
        Proxied to the ICP GraphQL API (`execution.arguments`), with
        `componentName` sent as the component id. Returns an empty array when
        ICP has no record of the run; fails with 500 when `ICP_GRAPHQL_URL` is
        not configured.
      operationId: getExecutionArguments
      tags: [Executions]
      parameters:
        - name: releaseId
          in: query
          required: false
          description: Forwarded to ICP as `releaseId`; omitted sends an empty string.
          schema:
            type: string
      responses:
        "200":
          description: The run's arguments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExecutionArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/job-configs:
    parameters:
      - $ref: "#/components/parameters/componentName"

    put:
      summary: Update a scheduled task's job configuration
      description: >
        Forwarded as-is to the ICP GraphQL `updateJobConfigs` mutation. The
        component is identified by `componentId` in the body; the
        `componentName` path segment is not read. Fails with 500 when
        `ICP_GRAPHQL_URL` is not configured.
      operationId: updateJobConfigs
      tags: [Executions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobConfigsInput"
      responses:
        "200":
          description: Mutation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateJobConfigsResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Resource Tree ───────────────────────────────────────────────────────────

  /components/{componentName}/environments/{environment}/resource-tree:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environment"

    get:
      summary: Get the rendered Kubernetes resources of a component-environment
      description: >
        OpenChoreo's release-binding resource tree: every Kubernetes object
        rendered for the component in this environment, grouped by rendered
        release, with each node's raw object and health. Every upstream error,
        including a component not deployed to this environment, yields 500.
      operationId: getResourceTree
      tags: [Resource Tree]
      responses:
        "200":
          description: Resource tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceTreeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/environments/{environment}/resource-tree/executions:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environment"

    get:
      summary: List a scheduled task's runs still live in the cluster
      description: >
        Runs derived from the Job nodes currently in the resource tree, newest
        first. Only Jobs the cluster still retains appear — use
        `.../executions/history` for a month of history. When a GitHub client
        is configured and the component builds from a repository subdirectory,
        `revisionId` is the last commit that touched that subdirectory rather
        than the repository HEAD at build time. Returns an empty list when the
        component is not deployed to the environment.
      operationId: getExecutionsFromTree
      tags: [Resource Tree]
      responses:
        "200":
          description: Live runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/environments/{environment}/resource-events:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environment"

    get:
      summary: Get Kubernetes events for one resource in the tree
      description: >
        Every upstream error, including a component not deployed to this
        environment, yields 500.
      operationId: getResourceEvents
      tags: [Resource Tree]
      parameters:
        - name: group
          in: query
          required: false
          description: API group of the resource; empty for the core group.
          schema:
            type: string
          example: batch
        - name: version
          in: query
          required: true
          schema:
            type: string
          example: v1
        - name: kind
          in: query
          required: true
          schema:
            type: string
          example: Job
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Events for the resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceEventsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/environments/{environment}/resource-logs:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environment"

    get:
      summary: Get logs of one pod in the tree
      description: >
        Every upstream error, including a component not deployed to this
        environment, yields 500.
      operationId: getResourceLogs
      tags: [Resource Tree]
      parameters:
        - name: podName
          in: query
          required: true
          schema:
            type: string
        - name: sinceSeconds
          in: query
          required: false
          description: Only return entries newer than this many seconds.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Pod log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodLogsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Runtime ─────────────────────────────────────────────────────────────────
  #
  # Addressed by release: the environment is the one whose binding currently
  # points at `releaseId`. A release no binding points at yields the "nothing
  # deployed" result of each endpoint rather than 404.

  /components/{componentName}/releases/{releaseId}/runtime:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/releaseId"

    get:
      summary: Get the runtime snapshot of a release
      description: >
        Which environment the release runs in, whether it is deployed, how many
        Pod objects its resource tree holds and the image they run. Best-effort:
        fields that cannot be resolved are omitted rather than guessed, and a
        release with no binding returns `undeployed: true` with `replicas: 0`.
      operationId: getReleaseRuntimeDetails
      tags: [Runtime]
      responses:
        "200":
          description: Runtime snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseRuntimeDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/releases/{releaseId}/pods:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/releaseId"

    get:
      summary: List a release's live pods
      description: >
        Pods from the release binding's resource tree, trimmed to the fields of
        the Kubernetes Pod object the runtime page needs. Empty when the release
        has no binding or nothing is rendered yet.
      operationId: getReleasePods
      tags: [Runtime]
      responses:
        "200":
          description: Live pods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClusterPod"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/releases/{releaseId}/metrics:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/releaseId"

    get:
      summary: Get a release's CPU and memory usage
      description: >
        `podLevelMetrics` is always empty: OpenChoreo has no per-pod metrics
        source. `componentLevelMetrics` is real usage aggregated across the
        release's pods by the OpenChoreo Observer, with limits summed from the
        live pod specs (requests where a container sets no limit). It is omitted
        — not zeroed — when it cannot be resolved (no binding, observability not
        configured, or the Observer query failed).
      operationId: getReleaseMetrics
      tags: [Runtime]
      responses:
        "200":
          description: Release metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseMetrics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/releases/{releaseId}/pods/{podName}/events:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/releaseId"
      - $ref: "#/components/parameters/podName"

    get:
      summary: List a pod's recent lifecycle events
      description: >
        The events `kubectl describe pod` shows. The cluster retains them for
        about an hour, so an empty list is normal. An unknown pod or a release
        with no binding also yields an empty list.
      operationId: getPodEvents
      tags: [Runtime]
      responses:
        "200":
          description: Pod events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PodEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/releases/{releaseId}/pods/{podName}/logs:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/releaseId"
      - $ref: "#/components/parameters/podName"

    get:
      summary: Get a pod's container logs
      description: >
        Logs as one newline-joined string, each line prefixed by its timestamp,
        tailed to at most 5000 lines. When `containerName` is omitted and the
        entries span more than one container, each line is also prefixed with
        `[container]`. A release with no binding yields `logs: ""`.
      operationId: getPodLogs
      tags: [Runtime]
      parameters:
        - name: containerName
          in: query
          required: false
          schema:
            type: string
        - name: previous
          in: query
          required: false
          description: >
            Logs of the container's previous instance. OpenChoreo has no
            equivalent, so the literal value `true` is rejected with 400 rather
            than served as current logs; any other value is treated as false.
          schema:
            type: boolean
        - name: sinceSeconds
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: maxTailLines
          in: query
          required: false
          description: >
            Caps the number of lines returned. Values ≤ 0 or above 5000 use the
            5000-line default.
          schema:
            type: integer
      responses:
        "200":
          description: Container logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodLogsText"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Pod or container not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Loggers ─────────────────────────────────────────────────────────────────

  /components/{componentName}/loggers:
    parameters:
      - $ref: "#/components/parameters/componentName"

    get:
      summary: List a component's runtime loggers
      description: >
        Proxied to the ICP GraphQL API (`loggersByEnvironmentAndComponent`),
        with `componentName` sent as the component id. Fails with 500 when
        `ICP_GRAPHQL_URL` is not configured.
      operationId: listLoggers
      tags: [Loggers]
      parameters:
        - name: environmentId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Loggers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoggerList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      summary: Change a logger's level
      description: >
        Forwarded as-is to the ICP GraphQL `updateLogLevel` mutation. The
        component is identified by `componentName` in the body; the path
        segment is not read. Fails with 500 when `ICP_GRAPHQL_URL` is not
        configured.
      operationId: updateLogLevel
      tags: [Loggers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLogLevelInput"
      responses:
        "200":
          description: Mutation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateLogLevelResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Agent traces ───────────────────────────────────────────────────────────

  /components/{componentName}/environments/{environment}/traces:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environment"

    get:
      summary: List the execution traces of an AI agent
      description: >
        Returns a page of trace overviews for an agent component, read from
        agent-manager-observer and passed through unchanged. Each trace carries
        the observer's own enrichment — root-span input and output, token usage,
        status and, when asked for with `include`, the models, tools and MCP
        servers the trace used. That shape is the observer's, documented in its
        own OpenAPI document, and gains fields as upstream recognises more
        instrumentation conventions; this service adds nothing to it.


        Only components of type `proxy/agent-api` are instrumented, so any other
        component type yields 400. 503 means no agent-observer base URL is
        configured in this deployment; 403 means the caller's token carries no
        `amp:observability:trace-read` scope.


        Page with the previous response's `nextCursor`, keeping the same window,
        sort order and `include`. Narrowing the window instead loses traces that
        were still running at its edge.
      operationId: listAgentTraces
      tags: [Agent Traces]
      parameters:
        - $ref: "#/components/parameters/traceStartTime"
        - $ref: "#/components/parameters/traceEndTime"
        - name: limit
          in: query
          required: false
          description: Page size. The observer defaults it to 10 and caps it at 1000.
          schema:
            type: integer
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - name: cursor
          in: query
          required: false
          description: >
            The `nextCursor` of the previous page. Opaque, and valid only with
            the same window, sort order and filters as that page.
          schema:
            type: string
        - name: include
          in: query
          required: false
          description: >
            Comma-separated opt-in fields (`models`, `tools`, `mcpServers`).
            Each costs the observer extra reads per trace.
          schema:
            type: string
          example: models,tools
      responses:
        "200":
          description: >
            The observer's trace page, unwrapped. See agent-manager-observer's
            `TraceOverviewListResponse`.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /components/{componentName}/environments/{environment}/traces/{traceId}/spans:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environment"
      - $ref: "#/components/parameters/traceId"

    get:
      summary: List the spans of one trace
      description: >
        Span summaries — name, parent, timing and error flag — for building the
        trace tree. Attributes are not on this route; read one span's attributes
        from the span detail route.


        The listing is narrowed to the component in the path, so a trace that is
        not this component's comes back with no spans rather than an error.
      operationId: listAgentTraceSpans
      tags: [Agent Traces]
      parameters:
        - $ref: "#/components/parameters/traceStartTime"
        - $ref: "#/components/parameters/traceEndTime"
        - name: limit
          in: query
          required: false
          description: Page size. The observer defaults it to 10 and caps it at 1000.
          schema:
            type: integer
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - name: cursor
          in: query
          required: false
          description: >
            The `nextCursor` of the previous page. Opaque, and valid only with
            the same window, sort order and filters as that page.
          schema:
            type: string
        - name: include
          in: query
          required: false
          description: >
            Comma-separated opt-in fields, forwarded to the observer as given.
          schema:
            type: string
      responses:
        "200":
          description: >
            The observer's span page, unwrapped. See agent-manager-observer's
            `SpanSummaryListResponse`.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /components/{componentName}/environments/{environment}/traces/{traceId}/spans/{spanId}:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environment"
      - $ref: "#/components/parameters/traceId"
      - name: spanId
        in: path
        required: true
        schema:
          type: string

    get:
      summary: Get one span with its attributes
      description: >
        The full span: OTEL attributes and the observer's derived fields (its
        semantic kind, input and output, token usage, tool calls).


        The span is served only when the component's own span listing for that
        trace names it; a span belonging to another component or organization
        yields 404. The time window is required for that reason — it is the
        window the listing is made over, so it must be one the trace falls in.


        That listing asks for the observer's whole page (1000 spans, its
        `maxLimit`, which it clamps to rather than rejecting). A trace longer
        than the listing reaches yields 422 for a span beyond it, rather than
        404: the listing cannot tell an absent span from one it never got to.
      operationId: getAgentSpanDetail
      tags: [Agent Traces]
      parameters:
        - $ref: "#/components/parameters/traceStartTime"
        - $ref: "#/components/parameters/traceEndTime"
      responses:
        "200":
          description: >
            The observer's span, unwrapped. See agent-manager-observer's
            `EnrichedSpan`.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            The trace has more spans than the listing that authorises a span
            read can reach, so this span's membership cannot be settled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The observer's span listing could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── File mounts ────────────────────────────────────────────────────────────

  /components/{componentName}/environments/{environmentName}/files:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"
      - name: projectName
        in: query
        required: false
        description: >
          Accepted but ignored.
        schema:
          type: string
        example: default-project

    get:
      summary: List mounted config/secret files
      description: >
        Returns the config and secret files mounted into the component's
        container for the given environment, read from the ReleaseBinding's
        workload overrides. Metadata only — no file content is returned here,
        not even for non-sensitive files; fetch a single file to read its
        content. The platform-managed `Config.toml` is never listed.
      operationId: listFileMounts
      tags: [File Mounts]
      responses:
        "200":
          description: Files mounted for the component-environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMountListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/environments/{environmentName}/files/{fileName}:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/fileName"
      - name: projectName
        in: query
        required: false
        description: >
          Ignored by GET. On PUT and DELETE it scopes the secret store that
          holds sensitive file contents.
        schema:
          type: string
        example: default-project

    get:
      summary: Get a mounted file
      description: >
        Returns one mounted file so the console can prefill it for editing.
        A non-sensitive file is stored inline and includes its `content`;
        a sensitive file is secret-backed and its content is not readable,
        so `content` is omitted and must be re-entered on edit. The first
        file with this name is returned regardless of mount path.
      operationId: getFileMount
      tags: [File Mounts]
      responses:
        "200":
          description: The mounted file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMountItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      summary: Create or replace a mounted file
      description: >
        Mounts a file into the component's container for the given environment.
        Non-sensitive files are mounted inline on the ReleaseBinding; sensitive
        files are stored in a SecretReference and mounted by reference
        (valueFrom.secretKeyRef). A file with the same name and mount path is
        replaced. The file name comes from the path and must not contain path
        separators; the body carries the mount path and content (at most
        1 MiB, counted in bytes as sent). The reserved name `Config.toml` is
        rejected with 409 (a request that also lacks `mountPath` gets 400
        first). Sensitive files require the secret manager to be configured
        (400 otherwise). The secret store is keyed by file name only, so
        sensitive files that share a name across mount paths share one stored
        value — writing one changes the other. Triggers a pod rollout.
      operationId: upsertFileMount
      tags: [File Mounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileMount"
      responses:
        "200":
          description: File mounted; a pod rollout is triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The file name is reserved by the platform (`Config.toml`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      summary: Unmount a file
      description: >
        Removes the file mounted at (`mountPath`, `fileName`) from the
        component-environment. Removing a file that is not mounted succeeds.
        The secret store is keyed by file name only, so every delete — of an
        inline file too — also removes the stored secret named `fileName`
        (best-effort — a failure there is logged, not returned), including one
        that backs a sensitive file of the same name at another mount path.
        Triggers a pod rollout when the file existed. The reserved name
        `Config.toml` is rejected with 409.
      operationId: deleteFileMount
      tags: [File Mounts]
      parameters:
        - $ref: "#/components/parameters/mountPathQuery"
      responses:
        "200":
          description: File unmounted (or already absent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The file name is reserved by the platform (`Config.toml`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Env groups ─────────────────────────────────────────────────────────────

  /components/{componentName}/environments/{environmentName}/env-groups:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"
      - name: projectName
        in: query
        required: false
        description: >
          Accepted but ignored.
        schema:
          type: string
        example: default-project

    get:
      summary: List environment-variable groups
      description: >
        Returns the named environment-variable groups projected into the
        component's container for the given environment, sorted by name.
        OpenChoreo has no config-group concept, so the grouping is kept as a
        marker annotation on the ReleaseBinding alongside the env vars
        themselves. Names and keys only — values are returned by the
        single-group endpoint.
      operationId: listEnvGroups
      tags: [Env Groups]
      responses:
        "200":
          description: Env-var groups for the component-environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvVarGroupListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/environments/{environmentName}/env-groups/{groupName}:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/groupName"
      - name: projectName
        in: query
        required: false
        description: >
          Ignored by GET. On PUT and DELETE it scopes the secret store that
          holds a sensitive group's values.
        schema:
          type: string
        example: default-project

    get:
      summary: Get an environment-variable group
      description: >
        Returns the group with its values in `data`. Secret values are
        write-only: for a sensitive group every value is returned as an empty
        string.
      operationId: getEnvGroup
      tags: [Env Groups]
      responses:
        "200":
          description: The env-var group, with values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvVarGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      summary: Create or replace an environment-variable group
      description: >
        Replaces the group's variables with `data`: keys the group held before
        but `data` omits are removed from the container. The group name comes
        from the path. A sensitive group's values are stored in a secret and
        injected by reference; a non-sensitive group's values are set inline
        on the ReleaseBinding. A sensitive group requires the secret manager
        (`SECRET_MANAGER_API_BASE_URL`); without it the request fails with 500.
        Triggers a pod rollout.
      operationId: upsertEnvGroup
      tags: [Env Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvVarGroup"
            example:
              sensitive: false
              data:
                LOG_LEVEL: DEBUG
                API_BASE_URL: https://api.example.com
      responses:
        "200":
          description: Group written; a pod rollout is triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      summary: Delete an environment-variable group
      description: >
        Removes the group and all of its variables from the container. For a
        sensitive group the backing secret keys are also removed
        (best-effort — a failure there is logged, not returned). Without the
        secret manager (`SECRET_MANAGER_API_BASE_URL`) deleting a sensitive
        group fails with 500 and the group stays. Triggers a pod rollout.
      operationId: deleteEnvGroup
      tags: [Env Groups]
      responses:
        "200":
          description: Group deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Config schema ──────────────────────────────────────────────────────────

  /components/{componentName}/environments/{environmentName}/config-schema:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"
      - name: projectName
        in: query
        required: false
        description: >
          Part of the secret-store key the values are saved under, and narrows
          the Workload lookup. Send the same value on GET and POST (including
          omitting it on both): a GET with a different `projectName` reads a
          different key and does not see what POST saved.
        schema:
          type: string
        example: default-project

    get:
      summary: Get the component's configurable schema and saved values
      description: >
        Returns the JSON Schema of the component's Ballerina configurables plus
        the values saved for this environment. Without `commitHash` the schema
        comes from the Workload's `openchoreo.dev/config-schema` annotation,
        falling back to the most recent succeeded build; with `commitHash` it
        comes from the most recent build of that commit, whatever its status,
        among the component's last 100 builds (a failed build yields an empty
        `jsonSchema`). Saved values are read from the secret store; sensitive
        values are redacted (empty `value`, `isSet: true`). When the store
        holds nothing, the values are read back from the base Workload; when
        the store is unreachable, from the ReleaseBinding, then the Workload —
        so the form reflects what is running. `configurations` is null when no
        values are saved or deployed.
      operationId: getConfigSchema
      tags: [Config Schema]
      parameters:
        - name: commitHash
          in: query
          required: false
          description: >
            Pin the schema to a build of this commit. Full or short SHA —
            matched by prefix, in either direction, against the build's
            commit.
          schema:
            type: string
          example: 7223cb07
      responses:
        "200":
          description: Schema and saved configuration values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigSchemaResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No build matches `commitHash`, or no succeeded build exists and the Workload carries no schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      summary: Save configuration values
      description: >
        Persists configuration values for this environment in the secret store,
        assembles them into the component's `Config.toml`, and projects that
        onto the ReleaseBinding so the running pod picks them up (projection
        is best-effort — a failure there is logged and the save still
        succeeds). Merge rules: a sensitive key sent with an empty value keeps
        its stored value (the console sends "" when the user did not retype
        it); a non-sensitive key sent with an empty value is deleted; keys not
        mentioned are kept, and stay sensitive if they were. Returns the
        merged values, redacted. Store reads and writes are best-effort too:
        if the secret store is unreachable the call still returns 200, the
        values are not readable via GET until the store recovers, and — with
        no prior values to merge — keys not in this request are dropped from
        the projected `Config.toml` and sensitive keys sent as "" lose their
        values.
      operationId: saveConfigSchema
      tags: [Config Schema]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveConfigSchemaRequest"
      responses:
        "200":
          description: >
            The merged configuration values, redacted. `jsonSchema` is always
            empty and `buildName` is omitted in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigSchemaResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Secrets ────────────────────────────────────────────────────────────────

  /components/{componentName}/environments/{environmentName}/jwt-secret:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"

    post:
      summary: Generate a JWT secret for the component-environment
      description: >
        Forwards to the ICP GraphQL `generateComponentEnvironmentJwtSecret`
        mutation, passing the path values as the component and environment
        ids, and returns the secret it issues. Requires `ICP_GRAPHQL_URL`;
        every upstream failure surfaces as 500.
      operationId: generateJwtSecret
      tags: [Secrets]
      responses:
        "201":
          description: Secret generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwtSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/environments/{environmentName}/jwt-secret/rotate:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"

    put:
      summary: Rotate the component-environment's JWT secret
      description: >
        Forwards to the ICP GraphQL `rotateComponentEnvironmentJwtSecret`
        mutation and returns the new secret. Requires `ICP_GRAPHQL_URL`;
        every upstream failure surfaces as 500.
      operationId: rotateJwtSecret
      tags: [Secrets]
      responses:
        "200":
          description: Secret rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwtSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Health check ───────────────────────────────────────────────────────────

  /components/{componentName}/environments/{environmentName}/health-check:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"

    get:
      summary: Get the liveness and readiness probes
      description: >
        Returns the probes set on the component's ReleaseBinding for this
        environment, so they are per-environment. Probe values are validated
        when the release renders, not on write: a rejected probe shows up here
        as `syncStatus`/`syncMessage` from the binding's failing Ready
        condition.
      operationId: getHealthCheck
      tags: [Health Check]
      responses:
        "200":
          description: Probes and render status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      summary: Replace the liveness and readiness probes
      description: >
        Replaces both probes on the ReleaseBinding. A probe the request omits
        is cleared, not left alone. Each probe must set exactly one of
        `httpGet`, `tcpSocket` or `exec`, and a liveness probe's
        `successThreshold` must be 1 or omitted (Kubernetes rejects anything
        else). The
        probe change alters the pod template, so the pods roll.
      operationId: updateHealthCheck
      tags: [Health Check]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHealthCheckRequest"
            example:
              livenessProbe:
                httpGet:
                  path: /health
                  port: 9090
                initialDelaySeconds: 10
                periodSeconds: 15
              readinessProbe:
                tcpSocket:
                  port: 9090
      responses:
        "200":
          description: Probes replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      summary: Clear both probes
      description: Removes the liveness and readiness probes from the ReleaseBinding.
      operationId: deleteHealthCheck
      tags: [Health Check]
      responses:
        "200":
          description: Probes cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Autoscaling ────────────────────────────────────────────────────────────

  /components/{componentName}/environments/{environmentName}/autoscaling:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/deploymentTrackId"

    get:
      summary: Get the horizontal pod autoscaling settings
      description: >
        Returns the autoscaling settings stored on the component's
        ReleaseBinding for this environment, plus what the console needs to
        render them. `supported` says whether the component's type can
        autoscale at all; `effective` says whether the release deployed here
        renders the setting (a release built before the type could autoscale
        does not, until the component is deployed again);
        `maxReplicasLimit` is the highest bound a write may set. `status` is
        the live HPA's own report, present once the HPA exists; OpenChoreo
        reports every HPA as healthy, so its conditions are where a missing
        CPU metric or a scale capped at `maxReplicas` shows up.
        `syncStatus`/`syncMessage` report any failing Ready condition on the
        binding, such as a rejected render, not only autoscaling ones. A
        binding that never set autoscaling reports `enabled: false` with no
        bounds.
      operationId: getAutoscaling
      tags: [Autoscaling]
      responses:
        "200":
          description: Autoscaling settings, support and live status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Autoscaling"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The component does not exist, or is not deployed to this environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      summary: Replace the horizontal pod autoscaling settings
      description: >
        Replaces the modeled autoscaling settings on the ReleaseBinding; other
        keys in the block are kept. Autoscaling is a paid feature: a write with
        `enabled: true` needs the organization's integration platform
        subscription to be on a plan billing types as paid, with an active,
        trial or past-due status, read from billing with the caller's token
        (402 otherwise, 503 when the plan cannot be read). Turning
        autoscaling off is always allowed. `enabled` is required, and enabling
        requires `minReplicas`, `maxReplicas` and `cpuUtilizationPercentage`,
        so nothing falls back to a default the caller never saw.
        `memoryUtilizationPercentage` is optional: set, the HPA also targets
        memory and scales on whichever metric asks for more replicas; omitted,
        it scales on CPU alone and any stored memory target is removed. Each replica
        bound must be between 1 and `maxReplicasLimit` (the service's
        `AUTOSCALING_MAX_REPLICAS`, default 5) with `minReplicas <=
        maxReplicas`; bounds sent while disabled are validated and kept for
        display. Unknown fields are rejected, since a misspelt field read as
        absent would clear a bound or turn autoscaling off. Only
        `deployment/integration-as-api` and `deployment/event-integration`
        components can autoscale. `deployment/mcp-server` is left out because
        an MCP server keeps each session in the memory of the replica that
        opened it, so another replica cannot serve it. Every change to the
        settings rolls the component's pods, because OpenChoreo hashes the
        HPA into the pod template. Enabling hands the replica count to the
        HPA: the Deployment drops to one replica once before the HPA raises
        it to `minReplicas`. Disabling applies the environment's fixed replica
        count (default 1) at once, so set that first on a scaled-out
        component. Event integrations scale safely only on brokers that share
        work among consumers, such as Kafka consumer groups or RabbitMQ
        queues; topic and broadcast subscriptions process every message once
        per replica.
      operationId: updateAutoscaling
      tags: [Autoscaling]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAutoscalingRequest"
            example:
              enabled: true
              minReplicas: 2
              maxReplicas: 4
              cpuUtilizationPercentage: 70
      responses:
        "200":
          description: Autoscaling settings replaced, or already as requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The component does not exist, or is not deployed to this environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            The release deployed to this environment was built before the
            component's type could autoscale, so it would ignore the setting or
            fight the HPA over the replica count; or a memory target was sent
            and the deployed release predates memory support (see
            `memoryEffective`), so it would drop the target. Deploy the
            component to this environment again, then retry. Disabling is never
            refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: >
            The organization's subscription is not on a paid plan, so autoscaling
            cannot be enabled or changed. Disabling is never refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >
            The organization's plan could not be read from billing, or billing is
            not configured, so enabling is refused rather than granted. Retry later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Containers ─────────────────────────────────────────────────────────────

  /components/{componentName}/environments/{environmentName}/containers:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"

    get:
      summary: Get the component's deployed container spec
      description: >
        Returns the component's container spec (image, resources, ports,
        image-pull policy, last-updated time) for the given environment, read
        from the live rendered Deployment (or StatefulSet/CronJob/Job).
        OpenChoreo's Workload CRD models exactly one container per component
        (no sidecars), so the list is always 0 or 1 items — empty when the
        component has a ReleaseBinding here but nothing is rendered yet. A
        component with no ReleaseBinding in this environment yields 500.
      operationId: listContainers
      tags: [Containers]
      responses:
        "200":
          description: The component's container(s) for this environment (0 or 1)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseContainerList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/environments/{environmentName}/containers/{containerId}:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/containerId"

    put:
      summary: Update the container's resources and pull policy
      description: >
        Sets cpu/memory/limits/imagePullPolicy on the ReleaseBinding
        (reconciled against the currently bound release — visible on the next
        GET once the rollout completes). This call fully replaces the
        component's resource sizing, so all four sizes are required and must
        be greater than zero. `ports` and `command`/`args` are accepted but
        ignored: no product's UI edits a container's ports, and command/args
        editing is not offered for cloud.
      operationId: updateContainer
      tags: [Containers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContainerRequest"
      responses:
        "200":
          description: Container updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Endpoints ────────────────────────────────────────────────────────────────

  /components/{componentName}/environments/{environmentName}/api-resources:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"

    get:
      summary: List a component's endpoints and API resources in an environment
      description: >
        Returns the endpoints of the release bound to this environment, each with
        its metadata (type, port, base path), resolved URLs, APIP-backed
        visibility state, and the
        API resources (paths and HTTP operations) parsed from the OpenAPI schema
        attached to the Workload endpoint. Endpoints are sorted by name.

        This is a read-only operation. Project visibility is implicit; Public and
        organization visibility and their URLs are derived from live APIP deployment state.
      operationId: getAPIResources
      tags: [Endpoints]
      parameters:
        - name: projectName
          in: query
          required: false
          description: Accepted; has no effect.
          schema:
            type: string
      responses:
        "200":
          description: Endpoints of the environment's bound release (empty when the release has none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResourcesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The component has no deployment (or no bound release) in this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/environments/{environmentName}/api-proxy-reconciliation:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/projectNameQuery"
      - $ref: "#/components/parameters/endpointAPITrackId"
    get:
      summary: Get API proxy reconciliation status
      description: Derives convergence from the target ReleaseBinding, ComponentRelease, and APIP deployments.
      operationId: getAPIProxyReconciliation
      tags: [Deployments]
      responses:
        "200":
          description: Current derived reconciliation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyReconciliationStatus"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /components/{componentName}/environments/{environmentName}/api-proxy-reconciliation/retry:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/projectNameQuery"
      - $ref: "#/components/parameters/endpointAPITrackId"
    post:
      summary: Retry API proxy reconciliation immediately
      operationId: retryAPIProxyReconciliation
      tags: [Deployments]
      responses:
        "202":
          description: Retry queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyReconciliationSummary"

  /components/{componentName}/environments/{environmentName}/endpoints:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"

    get:
      summary: List a component's endpoints in an environment
      description: >
        Same handler and response as
        `GET /components/{componentName}/environments/{environmentName}/api-resources`,
        without changing either Workload or APIP state.
      operationId: getEnvironmentEndpoints
      tags: [Endpoints]
      parameters:
        - name: projectName
          in: query
          required: false
          description: Accepted; has no effect.
          schema:
            type: string
      responses:
        "200":
          description: Endpoints of the environment's bound release (empty when the release has none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResourcesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The component has no deployment (or no bound release) in this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/releases/{releaseId}/endpoints:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/releaseId"
      - $ref: "#/components/parameters/projectNameQuery"

    get:
      summary: List the endpoints of a bound release
      description: >
        Resolves the environment the release is bound to (the console's
        environment card carries the release, not the environment) and returns
        that environment's endpoints, exactly as the environment-scoped route
        does. A release that is not bound to any environment yields an empty
        list rather than a 404, so an undeployed card renders cleanly.
        `projectName` is accepted but has no effect: bindings are looked up by
        component name only.
      operationId: getReleaseEndpoints
      tags: [Endpoints]
      responses:
        "200":
          description: Endpoints of the release (empty when the release is not bound)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResourcesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/endpoints:
    parameters:
      - $ref: "#/components/parameters/componentName"

    get:
      summary: List a component's endpoints (safe default)
      description: >
        Safe-default response: always an empty list. Real endpoint data comes
        from the environment- and release-scoped endpoint routes.
      operationId: getComponentEndpoints
      tags: [Endpoints]
      responses:
        "200":
          description: 'Always `{"items": []}`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /components/{componentName}/endpoints/{endpointId}/spec:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/endpointId"

    get:
      summary: Get an endpoint's API definition (safe default)
      description: >
        Safe-default response: always `{"spec": null}`. The OpenAPI content of a
        deployed endpoint is returned base64-encoded in `schemaContent` by the
        environment- and release-scoped endpoint routes instead.
      operationId: getEndpointSpec
      tags: [Endpoints]
      responses:
        "200":
          description: 'Always `{"spec": null}`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointSpecResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /components/{componentName}/endpoints/generate:
    parameters:
      - $ref: "#/components/parameters/componentName"

    post:
      summary: Generate endpoints from source (safe default)
      description: >
        Safe-default response: always an empty list; the request body is not
        read and nothing is generated. A component's endpoints are the ones its
        Workload declares, served by the environment- and release-scoped
        endpoint routes.
      operationId: generateEndpoints
      tags: [Endpoints]
      responses:
        "200":
          description: 'Always `{"items": []}`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvEndpointList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /components/{componentName}/environments/{environmentName}/endpoints/{endpointName}/visibility:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/endpointName"
      - $ref: "#/components/parameters/projectNameRequiredQuery"
      - $ref: "#/components/parameters/endpointAPITrackId"

    put:
      summary: Reconcile an endpoint's environment visibility through APIP
      description: >
        Project visibility is implicit and cannot be disabled. Public and
        Organization are exclusive: one APIP deployment serves the endpoint on
        its main vhost, the external hostname for Public or the internal
        hostname for Organization, or the endpoint is not on the gateway at
        all. Sending both is a 400. APIP sandbox is not used because it
        represents a distinct sandbox upstream. Only the pipeline's entry
        environment takes a change (409 `CHANGE_REQUIRES_ENTRY_ENVIRONMENT`
        elsewhere); a promotion copies the source's visibility to the target.
        The operation is asynchronous when APIP is transitioning and never
        mutates the Workload, ComponentRelease, or ReleaseBinding.
        Organization visibility requires the environment's default gateway to
        advertise a valid internal URL.
      operationId: setEndpointVisibility
      tags: [Endpoints]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEndpointVisibilityRequest"
      responses:
        "200":
          description: Visibility was already converged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointVisibilityResponse"
        "202":
          description: APIP is enabling or disabling Public or Organization visibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointVisibilityResponse"
        "400":
          description: Missing `visibility`, an unreadable body, or an unrecognized visibility value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The deployed release has no endpoint with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The endpoint is not routable yet or its protocol is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >
            APIP is unavailable, the environment has no active default regular
            gateway, or the gateway does not advertise the external/internal URL
            required by the requested visibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/endpoints/{endpointName}/visibility:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/endpointName"
    put:
      deprecated: true
      summary: Deprecated environmentless visibility operation
      description: Always returns 410. Use the environment-scoped visibility route.
      operationId: setEndpointVisibilityDeprecated
      tags: [Endpoints]
      responses:
        "410":
          description: The environmentless route is no longer supported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── API exposure ─────────────────────────────────────────────────────────────

  /components/{componentName}/environments/{environmentName}/endpoints/{endpointName}/expose:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/endpointName"
      - $ref: "#/components/parameters/projectNameQuery"
      - $ref: "#/components/parameters/endpointAPITrackId"

    post:
      deprecated: true
      summary: Deprecated compatibility alias for enabling Public visibility
      description: >
        Registers the deployed endpoint as a REST API on the WSO2 API Platform
        (upstream = the endpoint's own internal Service URL in this environment),
        deploys it asynchronously to the environment's default regular API
        Platform gateway. Idempotent by handle: re-exposing
        updates the upstream and keeps the API's existing policies.

        A newly exposed API is secured with api-key-auth on every operation
        except CORS preflight (OPTIONS) routes, so it is immediately testable
        with a test key and never sits open; the security routes change that. When console origins are configured, a CORS
        policy admitting them is seeded too.

        The API is keyed by (project, component, endpoint), not by environment, so one API
        exists per endpoint. The org is taken from the JWT `ouId` claim;
        `projectName` names the API Platform project the API is filed under.
      operationId: exposeEndpoint
      tags: [API Exposure]
      responses:
        "200":
          description: >
            Public visibility was already converged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointVisibilityResponse"
        "202":
          description: APIP is enabling Public visibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointVisibilityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: >
            The endpoint has no resolvable upstream yet (retry after
            deployment). Also returned for an endpoint name the component does
            not have, where a retry never succeeds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: API Platform integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: >
            Unexpected failure, including when the component has no
            ReleaseBinding in this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      deprecated: true
      summary: Unexpose an endpoint's API
      description: >
        Deprecated compatibility alias for removing Public visibility in this
        environment. It undeploys from managed regular gateways bound to this
        environment and leaves other environments and the APIP API intact.
      operationId: unexposeEndpoint
      tags: [API Exposure]
      responses:
        "200":
          description: Public visibility was already disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointVisibilityResponse"
        "202":
          description: APIP is disabling Public visibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointVisibilityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: API Platform integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Endpoint security ────────────────────────────────────────────────────────

  /components/{componentName}/environments/{environmentName}/endpoints/{endpointName}/api-keys:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/endpointName"
      - $ref: "#/components/parameters/projectNameQuery"
      - $ref: "#/components/parameters/endpointAPITrackId"

    get:
      summary: List the endpoint API's keys (masked)
      description: >
        Lists the consumer API keys of the endpoint's API, masked. Test keys
        (see `.../test-key`) are ephemeral smoke-test credentials and are never
        listed; any key whose display name starts with `test-key-` is treated
        as one. The API is keyed by (component, endpoint, track), so
        `{environmentName}` is ignored.
      operationId: listEndpointApiKeys
      tags: [Endpoint Security]
      responses:
        "200":
          description: API keys (masked)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKeySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: API Platform integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      summary: Create an API key for the endpoint's API
      description: >
        The plaintext key is generated server-side and returned ONCE; the API
        Platform stores only a hash, so only a masked form is retrievable
        afterwards. The body may be omitted (an empty body with
        Content-Length 0; any other body must be valid JSON); `displayName`
        defaults to `<api-handle>-key`. A key is only enforced while the API's
        security mode is `api-key`. The API is keyed by (component, endpoint, track),
        so `{environmentName}` is ignored. There is no exposure check: creating
        a key for an endpoint that is not exposed fails with 500, not 409.
      operationId: createEndpointApiKey
      tags: [Endpoint Security]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: API key created (plaintext returned once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: API Platform integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected failure, including when the endpoint is not exposed as an API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /components/{componentName}/environments/{environmentName}/endpoints/{endpointName}/test-key:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/endpointName"
      - $ref: "#/components/parameters/projectNameQuery"
      - $ref: "#/components/parameters/endpointAPITrackId"

    post:
      summary: Mint a short-lived test key for the endpoint's API
      description: >
        One-click test credential. Ensures api-key-auth is enforced on every
        operation of the API except CORS preflight routes (switching from
        jwt/none when needed, which redeploys the API exactly as PUT
        `.../security` does; a no-op when it is already on — the default after
        expose), then mints a key that
        expires after one hour and returns the plaintext once. Send it as
        `X-API-Key` (or the configured header) to invoke the exposed endpoint.
        At most three test keys stay live per API; older ones are revoked.

        For an AI-agent component the key is issued by agent-manager for the
        agent's AI gateway in this environment instead; `keyId` is then empty.
      operationId: createEndpointTestKey
      tags: [Endpoint Security]
      responses:
        "201":
          description: Test key created (plaintext returned once; `expiresAt` set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Endpoint is not exposed as an API yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >
            API Platform integration is not configured, or (AI agents) no AI
            gateway is registered for this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/environments/{environmentName}/endpoints/{endpointName}/api-keys/{keyName}:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/endpointName"
      - $ref: "#/components/parameters/keyName"
      - $ref: "#/components/parameters/projectNameQuery"
      - $ref: "#/components/parameters/endpointAPITrackId"

    delete:
      summary: Revoke an API key
      description: >
        `keyName` is the `name` reported by the key listing. The API is keyed
        by (component, endpoint), so `{environmentName}` is ignored.
      operationId: revokeEndpointApiKey
      tags: [Endpoint Security]
      responses:
        "204":
          description: API key revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: API Platform integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/environments/{environmentName}/endpoints/{endpointName}/security:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/endpointName"
      - $ref: "#/components/parameters/projectNameQuery"
      - $ref: "#/components/parameters/endpointAPITrackId"

    get:
      summary: Get the active security configuration of the exposed API
      description: >
        Reports the single active auth mode (none / api-key / jwt) and its
        options, read from the API's operations (where the gateway enforces it)
        and falling back to an API-level policy. `publicUrl` is the enforcing
        gateway's invoke URL, best-effort.

        For an AI-agent component the mode is read from agent-manager (which
        owns the AI gateway policy) and `publicUrl` is the agent's invoke URL in
        this environment; this is the only case where `{environmentName}` is
        used. Reading an agent's security also starts a background reconcile
        with agent-manager, which may redeploy the agent.
      operationId: getEndpointSecurity
      tags: [Endpoint Security]
      responses:
        "200":
          description: Current security configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Endpoint is not exposed as an API yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: API Platform integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      summary: Set the active security configuration of the exposed API
      description: >
        Sets the single active auth mode. The gateway ANDs multiple auth policies
        with no fallback, so exactly one mode is active at a time: "api-key",
        "jwt", or "none" (open). Every auth policy is cleared from every
        operation and the API level and the chosen one is attached per
        operation (CORS preflight routes excepted). Rate-limit policies are
        left untouched; an existing CORS policy gains the active mode's
        credential header in its allowed headers, since a preflight that
        rejects it breaks every cross-origin call.

        The API is redeployed and the call waits for it to settle (up to
        60 s, longer than the server's 30 s write timeout); a redeploy that fails
        or does not settle returns 500 although the new configuration is
        already saved.
        The API is keyed by (component, endpoint, track), so `{environmentName}` is
        ignored and the change applies in every environment.
        Not supported for AI-agent components (409): their gateway policy is
        owned by agent-manager.
      operationId: setEndpointSecurity
      tags: [Endpoint Security]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityConfig"
      responses:
        "200":
          description: >
            Updated; the response is the configuration the API now holds, as a
            save normalizes it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityConfig"
        "400":
          description: >
            Unreadable body, `mode` is not one of none, api-key, jwt, or a jwt
            setting the gateway can't enforce: an unknown key manager, more than
            20 audiences, a scope containing whitespace, more than 20 scopes in a
            list, or an operation the API doesn't have. The message names the
            value; nothing is changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The request body is over 1 MiB; nothing is changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Endpoint is not exposed as an API yet, or the component is an AI agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: API Platform integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/environments/{environmentName}/endpoints/{endpointName}/security/jwt:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/endpointName"
      - $ref: "#/components/parameters/projectNameQuery"
      - $ref: "#/components/parameters/endpointAPITrackId"

    put:
      summary: Enable/disable JWT authentication on the exposed API (single-policy toggle)
      description: >
        Enabling makes `jwt` the active mode (clearing api-key auth). Disabling
        opens the API only when JWT is the active mode; otherwise it is a no-op.
        The toggle sets only the key manager and audiences.
        Enabling also adds the mode's credential header to an existing CORS
        policy. The API is redeployed and the call waits for it to settle (up to
        60 s, longer than the server's 30 s write timeout); a redeploy that fails
        or does not settle returns 500 although the new configuration is
        already saved.
        The API is keyed by (component, endpoint, track), so `{environmentName}` is
        ignored and the change applies in every environment.
        Not supported for AI-agent components (409).
      operationId: setEndpointJwtAuth
      tags: [Endpoint Security]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetJWTAuthRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToggleResponse"
        "400":
          description: >
            Unreadable body, or a jwt setting the gateway can't enforce: an
            unknown key manager or more than 20 audiences. The message names the
            value; nothing is changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The request body is over 1 MiB; nothing is changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Endpoint is not exposed as an API yet, or the component is an AI agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: API Platform integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/environments/{environmentName}/endpoints/{endpointName}/security/api-key:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/endpointName"
      - $ref: "#/components/parameters/projectNameQuery"
      - $ref: "#/components/parameters/endpointAPITrackId"

    put:
      summary: Enable/disable API-key authentication on the exposed API (single-policy toggle)
      description: >
        Enabling makes `api-key` the active mode (clearing JWT auth) — required
        for minted API keys to actually be enforced. Disabling opens the API only
        when api-key is the active mode; otherwise it is a no-op.
        Enabling also adds the mode's credential header to an existing CORS
        policy. The API is redeployed and the call waits for it to settle (up to
        60 s, longer than the server's 30 s write timeout); a redeploy that fails
        or does not settle returns 500 although the new configuration is
        already saved.
        The API is keyed by (component, endpoint, track), so `{environmentName}` is
        ignored and the change applies in every environment.
        Not supported for AI-agent components (409).
      operationId: setEndpointApiKeyAuth
      tags: [Endpoint Security]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAPIKeyAuthRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToggleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: The request body is over 1 MiB; nothing is changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Endpoint is not exposed as an API yet, or the component is an AI agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: API Platform integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Endpoint policies ────────────────────────────────────────────────────────

  /components/{componentName}/environments/{environmentName}/endpoints/{endpointName}/policies:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/environmentName"
      - $ref: "#/components/parameters/endpointName"
      - $ref: "#/components/parameters/projectNameQuery"
      - $ref: "#/components/parameters/endpointAPITrackId"

    get:
      summary: Get the CORS and rate-limit configuration of the exposed API
      description: >
        Reports the non-auth gateway behaviour of the exposed API. Auth is
        reported separately by the /security route. The two are written
        independently, except that a security change adds its credential
        header to the CORS policy's allowed headers. The API is keyed by
        (component, endpoint), so `{environmentName}` is ignored.
      operationId: getEndpointPolicies
      tags: [Endpoint Policies]
      responses:
        "200":
          description: Current policy configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointPolicyConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Endpoint is not exposed as an API yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: API Platform integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      summary: Set the CORS and rate-limit configuration of the exposed API
      description: >
        Replaces the CORS and rate-limit policies: an omitted `cors` (or
        `enabled: false`) removes CORS, and an omitted `rateLimit` leaves the API
        unlimited. An "api" level rate limit is attached to the API so every
        route shares one counter; "resource" attaches a separate limit per
        operation; "unlimited" removes both. Auth policies are left untouched.
        Endpoint timeout is not settable: the gateway supports one, but
        platform-api does not expose it.

        The API is redeployed and the call waits for it to settle (up to
        60 s, longer than the server's 30 s write timeout); a redeploy that fails
        or does not settle returns 500 although the new configuration is
        already saved.
        The API is keyed by (component, endpoint, track), so `{environmentName}` is
        ignored and the change applies in every environment.
      operationId: setEndpointPolicies
      tags: [Endpoint Policies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndpointPolicyConfig"
      responses:
        "200":
          description: Updated; the configuration as re-read after the write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointPolicyConfig"
        "400":
          description: >
            Unreadable body, or a policy the gateway cannot enforce: an unknown
            rate-limit level or time unit, a non-positive request count, or
            `allowCredentials` combined with the wildcard origin "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Endpoint is not exposed as an API yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: API Platform integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Consumer applications ────────────────────────────────────────────────────
  # There is no subscription-token flow. A consumer application's credential is
  # an api-key on the exposed endpoint (see the .../api-keys and .../test-key
  # routes); the gateway enforces it via the api-key security mode.

  /applications:
    post:
      summary: Create a consumer application
      description: >
        Creating an application in a project the API Platform has never been
        told about (nothing exposed from it yet) fails with 500.
      operationId: createApplication
      tags: [Applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: API Platform integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      summary: List consumer applications in a project
      description: >
        A project the API Platform has never been told about (nothing exposed
        from it yet) yields an empty list.
      operationId: listApplications
      tags: [Applications]
      parameters:
        - name: projectName
          in: query
          required: true
          schema:
            type: string
          example: default-project
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
        "400":
          description: "`projectName` query parameter is missing"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: API Platform integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /applications/{applicationId}:
    parameters:
      - $ref: "#/components/parameters/applicationId"

    get:
      summary: Get a consumer application
      operationId: getApplication
      tags: [Applications]
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: API Platform integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      summary: Update a consumer application
      description: >
        An omitted `displayName` keeps the current one. `description` is always
        written, so omitting it clears the description.
      operationId: updateApplication
      tags: [Applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationRequest"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: API Platform integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      summary: Delete a consumer application
      description: Idempotent — deleting an application that does not exist succeeds.
      operationId: deleteApplication
      tags: [Applications]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: API Platform integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Alert rules ──────────────────────────────────────────────────────────────

  /components/{componentName}/alert-rules:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - name: projectName
        in: query
        required: false
        description: Accepted; has no effect.
        schema:
          type: string

    get:
      summary: List a component's alert rules
      description: >
        Alert rules are stored as alert-rule traits on the OpenChoreo Component.
        Each rule's `envConfigs` reports its enabled state per environment the
        component is bound to, read from the ReleaseBindings; it is omitted when
        no environment carries state for the rule. An environment whose state
        cannot be read is left out rather than failing the list.
      operationId: listAlertRules
      tags: [Alert Rules]
      responses:
        "200":
          description: Alert rules (empty array when there are none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      summary: Create an alert rule
      description: >
        Adds the alert-rule trait (an upsert keyed by `instanceName` — an
        existing rule with the same name is replaced), then generates a new
        release and points every Active ReleaseBinding at it. The rollout is
        best-effort: a failure there is logged, not returned.

        Rules are matched by `instanceName` against every trait on the
        component, not only alert-rule traits, so a name shared with another
        trait replaces that trait.
      operationId: createAlertRule
      tags: [Alert Rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleRequest"
      responses:
        "201":
          description: Alert rule created (`envConfigs` is not populated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "400":
          description: Unreadable body, missing `instanceName`, or `source.type` is not "log" or "metric"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/alert-rules/{instanceName}:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/instanceName"
      - name: projectName
        in: query
        required: false
        description: Accepted; has no effect.
        schema:
          type: string

    put:
      summary: Replace an alert rule
      description: >
        Replaces the rule named by the path (the body's `instanceName` is
        ignored), creating it when absent, and rolls the change out like
        create. The body is not validated beyond being readable JSON. Matching
        is by `instanceName` across all of the component's traits, as on
        create.
      operationId: updateAlertRule
      tags: [Alert Rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleRequest"
      responses:
        "200":
          description: Alert rule updated (`envConfigs` is not populated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      summary: Delete an alert rule
      description: >
        Removes every trait on the component whose `instanceName` matches (not
        only alert-rule traits) and rolls the change out like create. Deleting
        a rule that does not exist succeeds and still generates a release.
      operationId: deleteAlertRule
      tags: [Alert Rules]
      responses:
        "204":
          description: Alert rule deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /components/{componentName}/alert-rules/{instanceName}/environments/{environment}/config:
    parameters:
      - $ref: "#/components/parameters/componentName"
      - $ref: "#/components/parameters/instanceName"
      - $ref: "#/components/parameters/environment"
      - name: projectName
        in: query
        required: false
        description: Accepted; has no effect.
        schema:
          type: string

    put:
      summary: Enable or disable an alert rule in one environment
      description: >
        Sets the rule's enabled flag on the environment's ReleaseBinding. No new
        release is generated.
      operationId: updateAlertRuleEnvConfig
      tags: [Alert Rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleEnvConfigRequest"
      responses:
        "200":
          description: Environment state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Databases ───────────────────────────────────────────────────────────────

  /db-servers/availability:
    get:
      summary: Say whether managed databases can be provisioned here
      description: >
        `available` is false with reason `NOT_CONFIGURED` when this deployment
        has no WSO2 PaaS gateway (`PAAS_GATEWAY_BASE_URL`, `PAAS_API_KEY` and
        `PAAS_ACCOUNT_ID` unset). It does not call PaaS, so it answers even
        when PaaS is down.
      operationId: getDatabaseAvailability
      tags: [Databases]
      responses:
        "200":
          description: Whether databases are configured in this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseAvailability"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /db-servers/offering:
    get:
      summary: Get the plans a new database can be created on
      description: >
        The plans of the PaaS catalog's default database offer, priced from
        the catalog, with the PostgreSQL major every new database gets (the
        deployment's `PAAS_POSTGRES_VERSION`; users do not choose it), the
        longest name PaaS accepts and the plane new databases are placed on.
        A plan's `monthlyPrice` is its list price at the plan's default node
        count and storage, and is absent where PaaS publishes no price.
      operationId: getDatabaseOffering
      tags: [Databases]
      responses:
        "200":
          description: The plans on offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseOffering"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/PaaSUpstreamError"
        "503":
          description: >
            Databases are not configured here, the PaaS catalog offers no
            database, or it does not offer the configured PostgreSQL major.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /db-servers:
    get:
      summary: List the organization's databases
      description: >
        The databases of the caller's organization (its PaaS tenant's
        `default` project). An organization that has never created one has
        no tenant yet and gets an empty list; nothing is provisioned by a
        read.
      operationId: listDatabaseServers
      tags: [Databases]
      responses:
        "200":
          description: The organization's databases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseServerList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/PaaSUpstreamError"
        "503":
          $ref: "#/components/responses/PlatformServicesNotConfigured"

    post:
      summary: Create a database
      description: >
        Starts provisioning a PostgreSQL database; it lists as `CREATING`
        until PaaS has it running. The organization's PaaS tenant and its
        `default` project are created on the first create. Omitted fields
        take the catalog's defaults, and the PostgreSQL major is the
        deployment's. A plan that offers backups gets them from the start,
        kept for 7 days; a plan without them gets none. Every database is
        published on the PaaS TCP edge unless the deployment turns
        `PAAS_PUBLIC_ACCESS` off. Refused while the organization's
        subscription is suspended. Audited as `database_create`.
      operationId: createDatabaseServer
      tags: [Databases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDatabaseServerRequest"
            example:
              name: orders
              plan: standard
      responses:
        "201":
          description: Provisioning started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseServer"
        "400":
          description: >
            The body is not JSON, the name is not a DNS label (lowercase
            letters, digits and `-`, starting and ending with a letter or
            digit), `storageGi` is negative, or PaaS refused the request
            (its message is passed through).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SubscriptionSuspended"
        "409":
          description: The organization already has a database with this name (PaaS's message).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            PaaS refused the plan, storage or placement, for example a plan it
            does not offer or no room on the plane. Its message is written
            for the caller and passed through.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/PaaSRateLimited"
        "502":
          $ref: "#/components/responses/PaaSUpstreamError"
        "503":
          description: >
            Databases are not configured here, or the organization's first
            platform service is still waiting for its PaaS project to become
            active (`Retry-After: 10`). Retrying succeeds once it is.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /db-servers/{serverId}:
    parameters:
      - $ref: "#/components/parameters/serverId"

    get:
      summary: Get a database
      description: >
        The database with its live state: the address a client dials, the
        running PostgreSQL version, size, backup policy and backup health.
        `host` and `port` are the public endpoint when the database is
        published; otherwise they are the in-plane address, which only
        workloads on the PaaS plane can reach (`reachable: false`). Before
        PaaS has a live view of a new database, only the listed fields are
        set.
      operationId: getDatabaseServer
      tags: [Databases]
      responses:
        "200":
          description: The database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseServerDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DatabaseNotFound"
        "502":
          $ref: "#/components/responses/PaaSUpstreamError"
        "503":
          $ref: "#/components/responses/PlatformServicesNotConfigured"

    delete:
      summary: Delete a database
      description: >
        Starts tearing the database down. It lists as `DELETING` until PaaS
        finishes (a few minutes), then disappears and this path answers 404.
        The teardown drops the database's backups with it. Deleting a
        database already being torn down is accepted again. Allowed while
        the organization's subscription is suspended, so it can still clean
        up. Audited as `database_delete`.
      operationId: deleteDatabaseServer
      tags: [Databases]
      responses:
        "202":
          description: Teardown started, or already under way. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DatabaseNotFound"
        "409":
          description: >
            The database changed while the request was made (it was deleted
            and re-created under the same name). Reload and try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          $ref: "#/components/responses/PaaSUpstreamError"
        "503":
          $ref: "#/components/responses/PlatformServicesNotConfigured"

  /db-servers/{serverId}/credentials:
    parameters:
      - $ref: "#/components/parameters/serverId"

    get:
      summary: Reveal the database's admin credentials
      description: >
        Asks PaaS for the database's admin login and waits up to 10 seconds
        for it to be delivered. Every call is a new request to PaaS and
        nothing is stored; the response is `Cache-Control: no-store`. The
        same response carries the CA certificate a client verifies the
        server with. PaaS rate-limits these requests per service key, which
        every organization shares; a poll it refuses within the wait is
        retried after its `Retry-After`. Audited as a sensitive read,
        `database_credentials_reveal`.
      operationId: revealDatabaseCredentials
      tags: [Databases]
      responses:
        "200":
          description: The admin credentials
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseCredentials"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DatabaseNotFound"
        "429":
          $ref: "#/components/responses/PaaSRateLimited"
        "502":
          $ref: "#/components/responses/PaaSUpstreamError"
        "503":
          $ref: "#/components/responses/PlatformServicesNotConfigured"
        "504":
          description: >
            PaaS had not delivered the credentials within the wait. Nothing
            is lost; try again, which starts a new request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /db-servers/{serverId}/backups/enable:
    parameters:
      - $ref: "#/components/parameters/serverId"

    post:
      summary: Turn on backups
      description: >
        Turns on daily backups with point-in-time recovery, kept for a fixed
        7 days. PaaS applies the change asynchronously; the database's
        `backup` and `backupState` show it once it lands. There is no way to
        turn backups off, change the retention, or run a backup on demand.
        Refused while the organization's subscription is suspended. Audited
        as `database_backups_enable`.
      operationId: enableDatabaseBackups
      tags: [Databases]
      responses:
        "202":
          description: Backups requested; the policy asked for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseBackupPolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SubscriptionSuspended"
        "404":
          $ref: "#/components/responses/DatabaseNotFound"
        "409":
          description: >
            The database is still being created, or it changed while the
            request was made. Try again once it is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The database's plan does not offer backups (PaaS's message).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/PaaSRateLimited"
        "502":
          $ref: "#/components/responses/PaaSUpstreamError"
        "503":
          $ref: "#/components/responses/PlatformServicesNotConfigured"

  # ── Temporal ────────────────────────────────────────────────────────────────

  /temporal-servers/availability:
    get:
      summary: Say whether managed Temporal servers can be provisioned here
      description: >
        `available` is false with reason `NOT_CONFIGURED` when this deployment
        has no WSO2 PaaS gateway. It does not call PaaS, so it answers even
        when PaaS is down.
      operationId: getTemporalAvailability
      tags: [Temporal]
      responses:
        "200":
          description: Whether Temporal servers are configured in this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporalAvailability"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /temporal-servers/offering:
    get:
      summary: Get the plans a new Temporal server can be created on
      description: >
        The plans of the PaaS catalog's default Temporal offer, priced from
        the catalog, with the Temporal version every new server runs, the
        longest name PaaS accepts and the plane new servers are placed on.
        Temporal is priced per server, whatever the plan's replica count; its
        internal store is not billed apart. `monthlyPrice` is absent where
        PaaS publishes no price.
      operationId: getTemporalOffering
      tags: [Temporal]
      responses:
        "200":
          description: The plans on offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporalOffering"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/PaaSUpstreamError"
        "503":
          description: Temporal is not configured here, or the PaaS catalog offers no Temporal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /temporal-servers:
    get:
      summary: List the organization's Temporal servers
      description: >
        The Temporal servers of the caller's organization (its PaaS tenant's
        `default` project). An organization that has never created a platform
        service gets an empty list; nothing is provisioned by a read.
      operationId: listTemporalServers
      tags: [Temporal]
      responses:
        "200":
          description: The organization's Temporal servers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporalServerList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/PaaSUpstreamError"
        "503":
          $ref: "#/components/responses/PlatformServicesNotConfigured"

    post:
      summary: Create a Temporal server
      description: >
        Starts provisioning a Temporal server; it lists as `CREATING` until
        PaaS has it running, which takes a few minutes. Its one namespace is
        `default`. The organization's PaaS tenant and its
        `default` project are created on its first platform service. The
        plan sets the server's history shard count for its whole life.
        Refused while the organization's subscription is suspended. Audited
        as `temporal_create`.
      operationId: createTemporalServer
      tags: [Temporal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemporalServerRequest"
            example:
              name: payments
              plan: dev
      responses:
        "201":
          description: Provisioning started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporalServer"
        "400":
          description: >
            The body is not JSON, the name breaks the rule (lowercase
            letters, digits and `-`, starting with a letter and ending with
            a letter or digit), or PaaS refused the request (its message is
            passed through).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SubscriptionSuspended"
        "409":
          description: The organization already has a platform service with this name (PaaS's message).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            PaaS refused the plan or placement, for example a plan it does not
            offer or a plane without Temporal. Its message is passed through.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/PaaSRateLimited"
        "502":
          $ref: "#/components/responses/PaaSUpstreamError"
        "503":
          description: >
            Temporal is not configured here, or the organization's first
            platform service is still waiting for its PaaS project to become
            active (`Retry-After: 10`). Retrying succeeds once it is.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /temporal-servers/{temporalId}:
    parameters:
      - $ref: "#/components/parameters/temporalId"

    get:
      summary: Get a Temporal server
      description: >
        The server with its live state: the address workers dial, its
        namespace and the running Temporal version. `host` and `port` are the
        public endpoint when the server is published (gRPC over TLS, port
        443); otherwise they are the in-plane address, which only workloads
        on the PaaS plane can reach (`reachable: false`). Before PaaS has a
        live view of a new server, only the listed fields are set.
      operationId: getTemporalServer
      tags: [Temporal]
      responses:
        "200":
          description: The Temporal server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporalServerDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TemporalNotFound"
        "502":
          $ref: "#/components/responses/PaaSUpstreamError"
        "503":
          $ref: "#/components/responses/PlatformServicesNotConfigured"

    delete:
      summary: Delete a Temporal server
      description: >
        Starts tearing the server down, its workflow history with it. It
        lists as `DELETING` until PaaS finishes, then disappears and this
        path answers 404. Deleting a server already being torn down is
        accepted again. Allowed while the organization's subscription is
        suspended, so it can still clean up. Audited as `temporal_delete`.
      operationId: deleteTemporalServer
      tags: [Temporal]
      responses:
        "202":
          description: Teardown started, or already under way. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TemporalNotFound"
        "409":
          description: PaaS refused the delete for now (its message), for example while the server's backups are still being set up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          $ref: "#/components/responses/PaaSUpstreamError"
        "503":
          $ref: "#/components/responses/PlatformServicesNotConfigured"

  /temporal-servers/{temporalId}/credentials:
    parameters:
      - $ref: "#/components/parameters/temporalId"

    get:
      summary: Reveal the Temporal server's API key
      description: >
        Asks PaaS for the server's API key and waits up to 10 seconds for it
        to be delivered. Workers send it as a bearer token (`authorization:
        Bearer <key>`) over TLS to the public endpoint. Every call is a new
        request to PaaS and nothing is stored; the response is
        `Cache-Control: no-store`. Revealing does not rotate the key. PaaS
        rate-limits these requests per service key, which every organization
        shares. Audited as a sensitive read, `temporal_credentials_reveal`.
      operationId: revealTemporalCredentials
      tags: [Temporal]
      responses:
        "200":
          description: The API key and where to use it
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporalCredentials"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TemporalNotFound"
        "409":
          description: The server is not ready to hand out its key yet (PaaS's message).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/PaaSRateLimited"
        "502":
          $ref: "#/components/responses/PaaSUpstreamError"
        "503":
          $ref: "#/components/responses/PlatformServicesNotConfigured"
        "504":
          description: >
            PaaS had not delivered the key within the wait. Nothing is lost;
            try again, which starts a new request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ── Components ─────────────────────────────────────────────────────────────────

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT issued by the platform IDP. Signature and expiry are validated by
        the API gateway, not by this service, which only parses the token: a
        request is rejected with 401 when the header is missing or malformed,
        the token does not parse, or any of the `client_id`, `ouId`, `ouName`,
        `ouHandle` claims is absent. The token is forwarded to OpenChoreo and
        the other upstreams, which derive the organization from it; locally,
        `ouHandle` and `ouId` identify the organization. Cloud Editor routes
        also require `sub`.

  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
      example: 10
  parameters:
    # PATCH (wso2-cloud-client): the upstream document references these three
    # parameters from the agent-trace routes but never declares them, which
    # breaks every $ref resolver. Declared here with the shapes those routes
    # describe; remove once the upstream document declares them.
    traceId:
      name: traceId
      in: path
      required: true
      description: The trace's id, as the trace listing returns it.
      schema:
        type: string
    traceStartTime:
      name: startTime
      in: query
      required: false
      description: Start of the window, RFC 3339.
      schema:
        type: string
        format: date-time
    traceEndTime:
      name: endTime
      in: query
      required: false
      description: End of the window, RFC 3339.
      schema:
        type: string
        format: date-time
    serverId:
      name: serverId
      in: path
      required: true
      description: The database's id (its PaaS instance id), as returned by the list.
      schema:
        type: string
        format: uuid
      example: 3f0e9a52-7c1d-4b8e-9a43-2d6f1c0b7e15
    temporalId:
      name: temporalId
      in: path
      required: true
      description: The Temporal server's id (its PaaS instance id), as returned by the list.
      schema:
        type: string
        format: uuid
      example: 8b2c4d6e-1a3f-4c5b-9d7e-0f1a2b3c4d5e

    trackId:
      name: trackId
      in: path
      required: true
      description: >
        A deployment track's id. The component's UID, and its name, also name
        its default track.
      schema:
        type: string
      example: next-2a46a3

    endpointAPITrackId:
      name: deploymentTrackId
      in: query
      required: false
      description: >
        The deployment track whose API the request manages; `versionId` is
        read for the same thing when this is absent. Each track of an endpoint
        has an API of its own, with its own keys, security, policies and
        visibility, served at `/<base>/<version>`. Neither, the component's
        name or its UID means the default track; any other value is a track's
        id. An unknown track is a 404, and a track with no API version a 409.
      schema:
        type: string

    deploymentTrackId:
      name: deploymentTrackId
      in: query
      required: false
      description: >
        The deployment track a component-scoped request acts on. `versionId` is
        read for the same thing when this is absent; neither, the component's
        name or its UID means the default track, the component's main release
        line.
      schema:
        type: string

    scheduleReleaseId:
      name: releaseId
      in: query
      required: false
      description: >
        A release of the component. When no deployment track is named, the
        request acts on the track this release is deployed on; 404 when it is
        not deployed.
      schema:
        type: string

    projectName:
      name: projectName
      in: path
      required: true
      schema:
        type: string
      example: default-project

    componentName:
      name: componentName
      in: path
      required: true
      schema:
        type: string
      example: hello-world-service

    buildName:
      name: buildName
      in: path
      required: true
      schema:
        type: string
      example: hello-world-service-workflow-a1557f64

    environmentName:
      name: environmentName
      in: path
      required: true
      schema:
        type: string
      example: development

    environment:
      name: environment
      in: path
      required: true
      description: Environment name.
      schema:
        type: string
      example: development

    releaseId:
      name: releaseId
      in: path
      required: true
      schema:
        type: string

    podName:
      name: podName
      in: path
      required: true
      schema:
        type: string

    runId:
      name: runId
      in: path
      required: true
      schema:
        type: string

    endpointName:
      name: endpointName
      in: path
      required: true
      schema:
        type: string
      example: greeter-http

    endpointId:
      name: endpointId
      in: path
      required: true
      schema:
        type: string

    keyName:
      name: keyName
      in: path
      required: true
      schema:
        type: string
      example: prod-key

    applicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
      example: my-app

    fileName:
      name: fileName
      in: path
      required: true
      schema:
        type: string
      example: ca.pem

    groupName:
      name: groupName
      in: path
      required: true
      schema:
        type: string

    instanceName:
      name: instanceName
      in: path
      required: true
      schema:
        type: string

    pipelineName:
      name: pipelineName
      in: path
      required: true
      schema:
        type: string

    orgUuid:
      name: orgUuid
      in: path
      required: true
      schema:
        type: string

    orgNumericId:
      name: orgNumericId
      in: path
      required: true
      schema:
        type: string

    owner:
      name: owner
      in: path
      required: true
      schema:
        type: string
      example: wso2

    repo:
      name: repo
      in: path
      required: true
      schema:
        type: string
      example: integration-samples

    containerId:
      name: containerId
      in: path
      required: true
      description: >
        Accepted for route-shape parity with a future multi-container model.
        OpenChoreo's Workload CRD models exactly one container per component
        (no sidecars), so this value is otherwise unused — the update always
        applies to that single container.
      schema:
        type: string
      example: main

    projectNameQuery:
      name: projectName
      in: query
      required: false
      schema:
        type: string
      example: default-project

    projectNameRequiredQuery:
      name: projectName
      in: query
      required: true
      schema:
        type: string
      example: default-project

    mountPathQuery:
      name: mountPath
      in: query
      required: true
      description: Mount directory of the file to remove (disambiguates files that share a name).
      schema:
        type: string
      example: /conf/certs

    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: >
        Forwarded upstream unchanged. No response returns a continuation
        cursor, so a client cannot page past the first page.

  responses:
    BadRequest:
      description: Invalid request body or missing required field
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: >
        Missing or malformed bearer token, a required claim is absent, or an
        upstream service rejected the token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PaymentRequired:
      description: >
        The organization's plan limit would be exceeded. `message` carries the
        upstream wording when there is one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The caller is not permitted to perform this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Dependent service not configured or unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    SubscriptionSuspended:
      description: >
        The organization's integration platform subscription is suspended.
        `code` is `SUBSCRIPTION_SUSPENDED`; renewing the subscription lifts it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubscriptionSuspendedError"
    DatabaseNotFound:
      description: >
        No database with this id in the caller's organization: the id is not
        a UUID, belongs to another organization, or the database has been
        deleted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TemporalNotFound:
      description: >
        No Temporal server with this id in the caller's organization: the id
        is not a UUID, belongs to another organization or another kind of
        service, or the server has been deleted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PlatformServicesNotConfigured:
      description: >
        Platform services are not configured in this deployment (see
        `/db-servers/availability` and `/temporal-servers/availability`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PaaSRateLimited:
      description: PaaS is rate-limiting this service's key. Retry after `Retry-After` seconds when given.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PaaSUpstreamError:
      description: >
        A PaaS call failed, or PaaS refused this service's key. The error is
        logged and the message is generic. A PaaS 400, 404, 409 or 422 is
        instead passed through with that status and PaaS's message.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: HTTP status text.
          example: Not Found
        message:
          type: string
          example: project not found

    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    # ── Cloud editor ──────────────────────────────────────────────────────────

    CreateCodeServerInput:
      type: object
      required: [projectId]
      properties:
        userId:
          type: string
          description: >
            Advisory. The editor identity comes from the token's `sub` claim and
            nowhere else; a value that disagrees with it is rejected with 403,
            and an empty value is accepted.
        projectId:
          type: string
          description: Project name the editor belongs to.
          example: default-project
        componentId:
          type: string
          description: >
            Source component to open the editor for. Empty or the literal
            `null` addresses the project-level editor (a new integration with
            no source component yet).
          example: hello-world-service
        imageUrl:
          type: string
          description: >
            Editor image. Defaults to the configured `CODE_SERVER_IMAGE`; may
            pick a different tag of that image but never a different
            repository.
        sourceCommitHash:
          type: string
          description: >
            Commit of the source component to open the workspace at. Applied
            only when the editor is (re)deployed; ignored when an existing
            editor is resumed.

    CodeServerResult:
      type: object
      description: >
        A provisioned or provisioning editor. `editorUrl` is set if and only if
        `ready` is true, which holds if and only if `status` is `created` or
        `resumed`; `pendingEditorUrl` is set only while not ready. Both URLs
        carry the editor's connection token as `?tkn=` and grant access to the
        workspace — treat them as credentials.
      required: [ready, componentName, status]
      properties:
        editorUrl:
          type: string
          description: Editor address, present only once the editor is serving — safe to redirect to.
          example: "https://editor.example.com/?tkn=0123456789abcdef0123456789abcdef"
        pendingEditorUrl:
          type: string
          description: >
            The same final address, published while the editor is still coming
            up. Redirecting to it early lands on a gateway error.
        ready:
          type: boolean
          description: Whether the editor is serving.
        componentName:
          type: string
          description: >
            Hidden OpenChoreo component backing the editor, derived from
            (user, project, component).
          example: code-server-1a2b3c4d5e
        status:
          type: string
          enum: [created, resumed, starting, provisioning]
          description: >
            `provisioning` = not routed yet; `starting` = address known, editor
            not serving; `created` / `resumed` = serving. There is no failed
            status — the client keeps polling.

    SampleImageEntry:
      type: object
      required: [name, image_url]
      properties:
        name:
          type: string
          example: Code Server
        image_url:
          type: string
          description: Configured Cloud Editor image (`CODE_SERVER_IMAGE`).

    SampleImageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Empty when the Cloud Editor is not configured.
          items:
            $ref: "#/components/schemas/SampleImageEntry"

    # ── Organizations ─────────────────────────────────────────────────────────

    OrgEntry:
      type: object
      required: [handle, numericId]
      properties:
        handle:
          type: string
          description: Organization handle, from the JWT `ouHandle` claim.
          example: acme
        numericId:
          type: integer
          description: Always 0 — organizations have no numeric id on this platform.
          example: 0
        uuid:
          type: string
          description: >
            Organization id from the billing service when it is configured and
            reachable; the JWT `ouId` claim otherwise.

    OrgEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrgEntry"

    AvailabilityResponse:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
          example: true

    DefaultProjectRef:
      type: object
      required: [id, handler]
      properties:
        id:
          type: string
          description: Always empty.
          example: ""
        handler:
          type: string
          description: Always `default`.
          example: default

    OrgComponentLimits:
      type: object
      required: [billableComponentCount, componentCount]
      properties:
        billableComponentCount:
          type: integer
          example: 0
        componentCount:
          type: integer
          example: 0

    OrgSubscription:
      type: object
      required: [tierId, subscriptionId, subscriptionType, subscriptionStatus]
      properties:
        tierId:
          type: string
          description: Billing plan code, or the plan id when the plan has no code.
        subscriptionId:
          type: string
        subscriptionType:
          type: string
          description: Billing product code with a `-subscription` suffix.
          example: integration-platform-subscription
        subscriptionStatus:
          type: string
          description: Subscription status as reported by the billing service.

    OrgSubscriptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrgSubscription"

    # ── Repositories ──────────────────────────────────────────────────────────

    RepoBranch:
      type: object
      required: [name, isDefault]
      properties:
        name:
          type: string
          example: main
        isDefault:
          type: boolean

    RepoBranchList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RepoBranch"

    TreeNode:
      type: object
      required: [path, subPath, type]
      properties:
        path:
          type: string
          description: Full path from the repository root.
          example: src/main.bal
        subPath:
          type: string
          description: Leaf segment of `path`.
          example: main.bal
        type:
          type: string
          description: GitHub tree entry type — `blob` (file), `tree` (directory), or `commit` (submodule).
          example: blob
        children:
          type: array
          description: Entries inside a directory; omitted when there are none.
          items:
            $ref: "#/components/schemas/TreeNode"

    RepoTree:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TreeNode"

    # ── Ballerina Central ─────────────────────────────────────────────────────

    SaveBalCentralTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Ballerina Central access token (write-only; never returned).

    BalCentralTokenDetails:
      type: object
      description: Status of the organization's Ballerina Central token. The token value is never included.
      required: [configured]
      properties:
        configured:
          type: boolean
        addedOn:
          type: string
          format: date-time
          description: >
            When the token was last activated: its first save, or the first save
            after a removal. Replacing an active token keeps it unchanged.
        expiresOn:
          type: string
          format: date-time
          description: >
            Expiry decoded from the token's `exp` claim. The PUT response omits
            it when the token is not a JWT with an `exp` claim. GET reads a
            stored label that such a save (or a removal) does not clear, so it
            can report the expiry of a previously saved token.
    # ── Projects ──────────────────────────────────────────────────────────────

    Project:
      type: object
      description: >
        A project as the console reads it. OpenChoreo addresses projects by
        name, so `id` and `handler` are both the project's resource name — the
        value to use in `{projectName}` path segments.
      required:
        - id
        - orgId
        - name
        - handler
        - description
        - version
        - createdDate
        - updatedAt
        - region
        - type
        - defaultDeploymentPipelineId
        - gitProvider
        - gitOrganization
        - repository
        - branch
        - directoryPath
        - isPublicRepo
        - deleting
      properties:
        id:
          type: string
          description: Project resource name (same as `handler`).
          example: default-project
        orgId:
          type: integer
          description: Always 0 — the organization is identified by the JWT, not by this field.
          example: 0
        name:
          type: string
          description: Display name, falling back to the resource name.
          example: Default Project
        handler:
          type: string
          description: Project resource name.
          example: default-project
        description:
          type: string
        version:
          type: string
          description: Always empty.
        createdDate:
          type: string
          description: Creation time (RFC3339).
          example: "2026-08-01T12:00:00Z"
        updatedAt:
          type: string
          description: >
            Time of the project's most recent status-condition change, or its
            creation time when it has none (RFC3339).
        region:
          type: string
          description: Always empty.
        type:
          type: string
          description: Always empty.
        defaultDeploymentPipelineId:
          type: string
          description: Name of the project's deployment pipeline.
          example: default
        gitProvider:
          type: string
          description: github | public | bitbucket | gitlab-server; empty when no repository is linked.
        gitOrganization:
          type: string
        repository:
          type: string
        branch:
          type: string
        directoryPath:
          type: string
          description: Path within the repository, no leading slash; "" addresses the repository root.
        isPublicRepo:
          type: boolean
        deleting:
          type: boolean
          description: True while an accepted delete is still in progress.

    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"

    ProjectRepository:
      type: object
      description: >
        The repository a project is linked to. gitProvider, gitOrganization,
        repository and branch are jointly meaningful — every field is written on
        every store, so a subset would blank the rest.
      properties:
        gitProvider:
          type: string
          description: github | public | bitbucket | gitlab-server
          example: github
        gitOrganization:
          type: string
          example: wso2
        repository:
          type: string
          example: integration-samples
        branch:
          type: string
          example: main
        directoryPath:
          type: string
          description: Path within the repository, no leading slash; "" addresses the repository root.
          example: ballerina-integrator
        isPublicRepo:
          type: boolean

    CreateProjectRequest:
      description: >
        The repository fields are stored only when gitProvider,
        gitOrganization, repository and branch are all set; otherwise they are
        dropped and the project is created without a link.
      allOf:
        - type: object
          required: [name]
          properties:
            name:
              type: string
              description: Project handler (resource name).
              example: default-project
            displayName:
              type: string
              example: Default Project
            description:
              type: string
            deploymentPipeline:
              type: string
              description: Name of the deployment pipeline to bind the project to.
              example: default
        - $ref: "#/components/schemas/ProjectRepository"

    LinkProjectRepositoryRequest:
      allOf:
        - $ref: "#/components/schemas/ProjectRepository"
        - type: object
          # Jointly required: every field is rewritten on every call, so a request
          # that omitted one would erase it.
          required: [gitProvider, gitOrganization, repository, branch]

    UpdateProjectRequest:
      type: object
      description: Empty or omitted fields leave the current value in place.
      properties:
        displayName:
          type: string
        description:
          type: string
        deploymentPipeline:
          type: string
          description: Name of the deployment pipeline to bind the project to.

    ProjectContributor:
      type: object
      required: [id, displayName, email, pictureUrl, totalContributions]
      properties:
        id:
          type: integer
          description: Always 0.
          example: 0
        displayName:
          type: string
          example: Jane Doe
        email:
          type: string
          example: jane@example.com
        pictureUrl:
          type: string
          description: Avatar URL from the git provider; empty when unknown.
        totalContributions:
          type: integer
          description: Number of the author's commits across the project's recent commit histories.
          example: 12

    ProjectContributorList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectContributor"

    ProjectHandlerAvailability:
      type: object
      required: [handlerUnique]
      properties:
        handlerUnique:
          type: boolean
          description: True when no project in the organization has this handler.
        alternateHandlerCandidate:
          type: string
          description: Suffixed alternative, present only when the candidate is taken.
          example: my-project-x7k2p

    # ── Components ────────────────────────────────────────────────────────────

    Component:
      type: object
      description: >
        A component as the console reads it. OpenChoreo addresses components by
        name, so `id` and `handler` are both the component's resource name — the
        value to use in `{componentName}` path segments.
      required:
        - projectId
        - id
        - name
        - handler
        - displayName
        - displayType
        - description
        - status
        - componentSubType
        - version
        - createdAt
        - lastBuildDate
        - isPrebuilt
        - deleting
      properties:
        projectId:
          type: string
          description: Owning project's name.
          example: default-project
        id:
          type: string
          description: Component resource name (same as `handler`).
          example: hello-world-service
        name:
          type: string
          description: Display name, falling back to the resource name.
          example: Hello World Service
        handler:
          type: string
          description: Component resource name.
          example: hello-world-service
        displayName:
          type: string
          description: Display name, falling back to the resource name.
          example: Hello World Service
        displayType:
          type: string
          description: >
            `componentType` prefixed with the lower-cased buildpack type
            (e.g. "biService", "miAutomation"); just `componentType` when the
            buildpack is unknown.
          example: biService
        description:
          type: string
        status:
          type: string
          description: Reason of the component's most recent status condition.
        componentType:
          type: string
          description: >
            Logical type derived from the OpenChoreo ComponentType (or the
            component's type annotation). Unlisted ComponentTypes report as
            "automation".
          enum: [automation, service, aiAgent, mcpServer, eventIntegration, fileIntegration, proxy]
          example: service
        componentSubType:
          type: string
          nullable: true
          description: Always null.
        version:
          type: string
          description: Always empty.
        createdAt:
          type: string
          description: Creation time (RFC3339).
          example: "2026-08-01T12:00:00Z"
        lastBuildDate:
          type: string
          description: >
            Time of the component's most recent status-condition change, or its
            creation time when it has none — not the time of the last build.
        labels:
          type: array
          items:
            type: string
        apiId:
          type: string
          description: Never set.
        serviceAccessMode:
          type: string
          description: Never set.
        isPrebuilt:
          type: boolean
          description: True for components deployed from a prebuilt image rather than built from source.
        deploymentTracksEnabled:
          type: boolean
          description: >
            True for an integration created with deployment tracks, the only kind that can
            have more than one. Absent otherwise.
        buildpackType:
          type: string
          description: >
            BI for the Ballerina buildpack, MI for the MI buildpack, "other" for
            any other build workflow; omitted when the component has no workflow.
          enum: [BI, MI, other]
          example: BI
        deleting:
          type: boolean
          description: True while an accepted delete is still in progress.

    ComponentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Component"

    CreatedComponent:
      description: >
        The created component, with `warning` alongside its fields when a
        post-create step failed: the GitHub source binding could not be stored
        (so no build was started), or the first build of a GitHub-App component
        could not be started. The component itself exists either way.
      allOf:
        - $ref: "#/components/schemas/Component"
        - type: object
          properties:
            warning:
              type: string
              example: component created, but the first build could not be started; trigger a build from the component page
            sourceBindingError:
              type: string
              enum: [github-auth-required, failed]
              description: >
                Set when the GitHub source binding could not be stored, so the
                component cannot build. `github-auth-required` means the user
                must connect GitHub again; `failed` is any other failure.

    DeploymentTrack:
      type: object
      description: >
        A deployment track as every track route returns it: the component
        detail, the tracks list, and a created, updated or default track.
      required: [id, autoDeployEnabled, autoBuildEnabled, latest]
      properties:
        id:
          type: string
        autoDeployEnabled:
          type: boolean
        autoBuildEnabled:
          type: boolean
          description: >
            The component's auto-build, which applies to all its tracks: a push
            builds each track whose branch it is to.
        branch:
          type: string
        url:
          type: string
          description: Repository URL the track builds from.
        apiVersion:
          type: string
          description: The track's `vMAJOR.MINOR` API version; left out when it has none.
        latest:
          type: boolean
        description:
          type: string
        environments:
          type: array
          description: Where the track is deployed.
          items:
            $ref: "#/components/schemas/DeploymentTrackEnvironment"

    APIVersion:
      type: object
      required: [id, apiVersion, branch, latest]
      properties:
        id:
          type: string
        apiVersion:
          type: string
        branch:
          type: string
        latest:
          type: boolean

    ComponentDetail:
      description: A component with its organization handle, deployment tracks and API versions.
      allOf:
        - $ref: "#/components/schemas/Component"
        - type: object
          required: [orgHandler]
          properties:
            orgHandler:
              type: string
            deploymentTracks:
              type: array
              items:
                $ref: "#/components/schemas/DeploymentTrack"
            apiVersions:
              type: array
              items:
                $ref: "#/components/schemas/APIVersion"

    ComponentNameAvailability:
      type: object
      required: [componentNameUnique, alternateComponentName]
      properties:
        componentNameUnique:
          type: boolean
          description: True when no component in the organization has this name.
        alternateComponentName:
          type: string
          description: Suffixed alternative when the candidate is taken; empty otherwise.
          example: hello-world-service-x7k2p

    CreateComponentRequest:
      type: object
      description: >
        K8s-style body mirroring the OpenChoreo Component resource. Only
        `metadata.name` is validated by this service (400 when empty); the other
        required fields are enforced upstream, so a body missing them fails with
        500.
      required: [metadata, spec]
      properties:
        metadata:
          $ref: "#/components/schemas/ComponentMetadata"
        spec:
          $ref: "#/components/schemas/ComponentSpec"
        githubApp:
          $ref: "#/components/schemas/GitHubAppSource"
        azureDevOps:
          $ref: "#/components/schemas/AzureDevOpsSource"
        modelConfig:
          type: array
          description: >
            AI Agent (`proxy/agent-api`) components only; any other type is
            rejected with 400. Organization LLM providers to attach. agent-manager
            creates the agent's proxy and key on each and injects the URL and key
            as environment variables. An unknown provider is rejected with 400.
          items:
            $ref: "#/components/schemas/AgentModelConfig"
        mcpConfig:
          type: array
          description: >
            AI Agent (`proxy/agent-api`) components only; any other type is
            rejected with 400. Registered MCP proxies to attach, whose URLs are
            injected as environment variables. An unknown proxy is rejected with 400.
          items:
            $ref: "#/components/schemas/AgentMCPConfig"

    AgentModelConfig:
      type: object
      required: [providerName]
      properties:
        providerName:
          type: string
          description: Handle of the organization LLM provider.
        environmentVariables:
          type: array
          items:
            $ref: "#/components/schemas/AgentEnvVarName"

    AgentMCPConfig:
      type: object
      required: [proxyName]
      properties:
        proxyName:
          type: string
          description: Handle of the registered MCP proxy.
        environmentVariables:
          type: array
          items:
            $ref: "#/components/schemas/AgentEnvVarName"

    AgentEnvVarName:
      type: object
      description: Renames a variable agent-manager injects.
      required: [key, name]
      properties:
        key:
          type: string
          description: agent-manager's key for the variable, `url` or `apikey`.
        name:
          type: string
          description: The environment variable the agent reads.

    ComponentMetadata:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: >
            Requested component name, org-scoped. A conflict is resolved by
            suffixing (a suffixed name is trimmed to 63 characters), so the
            created name can differ. Only emptiness is checked here; a name
            OpenChoreo rejects fails with 500.
          example: hello-world-service
        annotations:
          type: object
          additionalProperties:
            type: string
          description: >
            Resource annotations, e.g. `openchoreo.dev/display-name` and
            `openchoreo.dev/description`.

    ComponentSpec:
      type: object
      description: >
        Not validated here; a spec OpenChoreo rejects (for example one without
        `owner.projectName`) fails with 500.
      properties:
        owner:
          $ref: "#/components/schemas/ComponentOwner"
        componentType:
          $ref: "#/components/schemas/ComponentTypeRef"
        autoDeploy:
          type: boolean
          description: Deploy automatically after a successful build. Ensures the project's release bindings first.
        autoBuild:
          type: boolean
          description: Start the initial build after creating the component.
        workflow:
          $ref: "#/components/schemas/ComponentWorkflowSpec"

    ComponentOwner:
      type: object
      required: [projectName]
      properties:
        projectName:
          type: string
          example: default-project

    ComponentTypeRef:
      type: object
      required: [name]
      properties:
        kind:
          type: string
          example: ComponentType
        name:
          type: string
          description: >
            OpenChoreo ComponentType name. `proxy/agent-api` creates an AI agent
            through agent-manager.
          example: deployment/integration-as-api

    ComponentWorkflowSpec:
      type: object
      properties:
        kind:
          type: string
          example: ClusterWorkflow
        name:
          type: string
          description: >
            Build workflow name. Names containing "ballerina" build with the
            Ballerina buildpack, names starting with "mi-" with the MI buildpack.
          example: ballerina-buildpack-builder
        parameters:
          $ref: "#/components/schemas/ComponentWorkflowParameters"

    ComponentWorkflowParameters:
      type: object
      properties:
        repository:
          $ref: "#/components/schemas/WorkflowRepository"

    WorkflowRepository:
      type: object
      properties:
        url:
          type: string
          example: https://github.com/wso2/integration-samples.git
        revision:
          $ref: "#/components/schemas/WorkflowRevision"
        appPath:
          type: string
          example: /ballerina-integrator/hello-world-service
        secretRef:
          type: string
          description: >
            Clone-secret reference. GitHub-App components carry an explicit
            empty string, which is set server-side when `githubApp` is sent.

    WorkflowRevision:
      type: object
      properties:
        branch:
          type: string
          example: main
        commit:
          type: string

    GitHubAppSource:
      type: object
      description: >
        Private-repository source binding for GitHub-App components. Stored by
        the service under the final component name and never forwarded to
        OpenChoreo. `branch`, `appPath` and `repositoryUrl` default to the
        workflow repository's values. Not validated here: a binding the git
        integration rejects leaves the component created with a `warning`, a
        `sourceBindingError` and no build, never a 400.
      required: [installationId, owner, repo]
      properties:
        installationId:
          type: integer
          format: int64
        owner:
          type: string
          example: wso2
        repo:
          type: string
          example: integration-samples
        branch:
          type: string
          example: main
        appPath:
          type: string
        repositoryUrl:
          type: string

    AzureDevOpsSource:
      type: object
      description: >
        Private Azure DevOps source binding. Stored under the final component
        name and never forwarded to OpenChoreo. It is mutually exclusive with
        `githubApp`; branch, appPath and repositoryUrl default from the workflow.
      required: [organization, adoProject, repo]
      properties:
        organization:
          type: string
        adoProject:
          type: string
        repo:
          type: string
        branch:
          type: string
        appPath:
          type: string
        repositoryUrl:
          type: string
          format: uri

    UpdateComponentRequest:
      type: object
      properties:
        displayName:
          type: string
          description: Empty leaves the current value in place.
        description:
          type: string
          description: Empty leaves the current value in place.
        labels:
          type: array
          items:
            type: string
          description: Omitted leaves the labels untouched; an empty array clears them.

    UpdateBuildParametersRequest:
      type: object
      required: [workflow]
      properties:
        workflow:
          $ref: "#/components/schemas/ComponentWorkflowSpec"

    ComponentModel:
      type: object
      description: Internal (OpenChoreo-normalized) component shape.
      required: [name]
      properties:
        uid:
          type: string
        name:
          type: string
        projectName:
          type: string
        displayName:
          type: string
        description:
          type: string
        buildpackType:
          type: string
          enum: [BI, MI, other]
        componentType:
          type: string
          enum: [automation, service, aiAgent, mcpServer, eventIntegration, fileIntegration, proxy]
        displayType:
          type: string
        autoDeploy:
          type: boolean
        autoBuild:
          type: boolean
        isPrebuilt:
          type: boolean
        isCodeServer:
          type: boolean
        deleting:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
        status:
          type: string
        deploymentTracks:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentTrackModel"
        labels:
          type: array
          items:
            type: string

    DeploymentTrackModel:
      type: object
      description: >
        A deployment track: a branch the integration builds and deploys on its
        own. A component created with deployment tracks has one per OpenChoreo
        ReleaseLine, and `latest` marks the default (oldest) one. A component
        created without them has one, synthesized from its workflow repository;
        without a repository it yields only `{"latest": false,
        "autoDeployEnabled": false}`.
      required: [latest, autoDeployEnabled, apiVersion]
      properties:
        id:
          type: string
          description: >
            The track's ReleaseLine name, or the component's UID for the single
            track of a component created without tracks.
        branch:
          type: string
          example: main
        commitSha:
          type: string
          description: Pinned commit of the workflow revision, if any.
        url:
          type: string
          description: Repository URL.
          example: https://github.com/wso2/integration-samples.git
        appPath:
          type: string
        componentId:
          type: string
          description: The component's name.
        latest:
          type: boolean
        autoDeployEnabled:
          type: boolean
        autoBuildEnabled:
          type: boolean
          description: >
            The component's auto-build, which applies to all its tracks: a push
            builds each track whose branch it is to.
        createdAt:
          type: string
        updatedAt:
          type: string
          description: Always the creation time.
        description:
          type: string
        apiVersion:
          type: string
          description: >
            The track's `vMAJOR.MINOR` API version, unique within its
            component. Empty for the single track of a component
            created without tracks, whose APIs are unversioned, and for a track
            that has not been given one.
          example: v1.0
        environments:
          type: array
          description: Where the track is deployed.
          items:
            $ref: "#/components/schemas/DeploymentTrackEnvironment"

    DeploymentTrackEnvironment:
      type: object
      required: [environment, ready]
      properties:
        environment:
          type: string
        release:
          type: string
        ready:
          type: boolean

    DeploymentTrackList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentTrack"

    CreateDeploymentTrackRequest:
      type: object
      required: [branch]
      properties:
        branch:
          type: string
          example: release/2.0
        description:
          type: string
        enableAutoDeploy:
          type: boolean
          description: Left out, the track follows the component's auto-deploy setting.
        enableAutoBuild:
          type: boolean
          description: >
            Auto-build is the component's, set with PATCH
            /components/{componentName}/auto-build; `true` is a 400.
        apiVersion:
          type: string
          pattern: '^v\d+\.\d+$'
          description: >
            The track's API version. Must be unique among
            the component's tracks. Left out, it is the minor after the highest
            version the component's tracks have, or `v1.0` when none does.
          example: v2.0

    UpdateDeploymentTrackRequest:
      type: object
      description: Every field is optional; a field left out keeps its value.
      properties:
        branch:
          type: string
        description:
          type: string
          description: An empty string removes the description.
        enableAutoDeploy:
          type: boolean
        enableAutoBuild:
          type: boolean
          description: >
            Auto-build is the component's, set with PATCH
            /components/{componentName}/auto-build; `true` is a 400.
        apiVersion:
          type: string
          pattern: '^v\d+\.\d+$'
          description: >
            Set once: a track that has no API version may be given one
            (validated as on create); a track that has one keeps it, and a
            different value is a 400.

    DeploymentTrackDeletable:
      type: object
      required: [canDelete]
      properties:
        canDelete:
          type: boolean
        message:
          type: string
          description: Why the track can't be deleted; absent when it can.

    ComponentRepository:
      type: object
      properties:
        gitProvider:
          type: string
          description: First label of the repository host (e.g. "github", "gitlab", "bitbucket").
          example: github
        organizationApp:
          type: string
          example: wso2
        nameApp:
          type: string
          example: integration-samples
        branch:
          type: string
          example: main
        appSubPath:
          type: string
          example: /ballerina-integrator/hello-world-service
        bitbucketServerUrl:
          type: string
          description: Never set.
        serverUrl:
          type: string
          description: The repository URL as configured on the component.
        projectApp:
          type: string
          description: Never set.
        treeUrl:
          type: string
          description: >
            Browser URL of the repository tree at the component's branch and app
            path (GitHub, GitLab, Bitbucket); the raw repository URL for other
            hosts.
          example: https://github.com/wso2/integration-samples/tree/main/ballerina-integrator/hello-world-service
        buildpackConfig:
          type: array
          description: >
            One entry with the build settings, present only when the build
            workflow supports unit tests, submodules or build environment
            variables (the Ballerina and MI builders).
          items:
            $ref: "#/components/schemas/BuildpackConfig"

    BuildpackConfig:
      type: object
      properties:
        versionId:
          type: string
          description: Always empty.
        isUnitTestEnabled:
          type: boolean
          description: Always false for a build workflow without unit tests.
        pullLatestSubmodules:
          type: boolean
          description: >
            Whether builds move git submodules to the tip of their tracked
            branch instead of the commit the repository pins. Omitted when the
            build workflow does not take the setting (the Ballerina and MI
            builders do).
        keyValues:
          type: array
          description: Build environment variables; omitted when none are set.
          items:
            $ref: "#/components/schemas/BuildEnvVar"

    BuildEnvVar:
      type: object
      required: [key, value]
      description: >
        An environment variable passed to the build (not to the running
        component). Stored in plain text on the component, so not for secrets.
      properties:
        key:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
          example: MI_VERSION
        value:
          type: string
          maxLength: 4096
          description: Single line; a value containing a line break is a 400.
          example: 4.4.0

    CommitAuthor:
      type: object
      properties:
        name:
          type: string
        date:
          type: string
        email:
          type: string
        avatarUrl:
          type: string

    CommitModel:
      type: object
      required: [sha, author]
      properties:
        sha:
          type: string
        message:
          type: string
        isLatest:
          type: boolean
          description: True for the newest commit in the list.
        author:
          $ref: "#/components/schemas/CommitAuthor"

    CommitList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommitModel"

    # ── Builds ────────────────────────────────────────────────────────────────

    TriggerBuildRequest:
      type: object
      description: Optional. Fields other than `sha` are ignored.
      properties:
        sha:
          type: string
          pattern: "^[0-9a-fA-F]{7,40}$"
          description: >
            Commit to build (7–40 hex characters; anything else is a 400).
            Omitted builds the branch tip.
          example: 7223cb07a1b2c3d4e5f60718293a4b5c6d7e8f90

    UpdateBuildpackConfigRequest:
      type: object
      description: Other fields the console sends are ignored.
      properties:
        isUnitTestEnabled:
          type: boolean
          description: >
            Run unit tests during the build. Enabling them on a build workflow
            without unit tests is a 400.
        pullLatestSubmodules:
          type: boolean
          description: >
            Update git submodules to the latest commit of their tracked branch
            during the build; false builds the commit the repository pins.
            Enabling it on a build workflow that does not check out submodules
            is a 400.
        environmentVariables:
          type: array
          maxItems: 50
          description: >
            Replaces the build environment variables; an empty list clears them.
            Names must be unique. Setting variables on a build workflow that takes
            none is a 400.
          items:
            $ref: "#/components/schemas/BuildEnvVar"

    TriggerBuildResponse:
      type: object
      required: [message, success]
      properties:
        message:
          type: string
          example: build triggered
        success:
          type: boolean
          example: true

    WorkflowTask:
      type: object
      required: [name, phase]
      properties:
        name:
          type: string
        phase:
          type: string
        startedAt:
          type: string
        completedAt:
          type: string

    WorkflowRun:
      type: object
      required: [trigger]
      properties:
        name:
          type: string
          example: hello-world-service-workflow-a1557f64
        namespace:
          type: string
        status:
          type: string
          description: >
            Pending, Running, Succeeded or Failed in practice, but not a closed
            set: any completion reason OpenChoreo reports is passed through with
            its `Workflow` prefix stripped.
          example: Running
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        componentName:
          type: string
        projectName:
          type: string
        image:
          type: string
          description: Built image, once the run has produced one.
        commit:
          type: string
          description: Commit the run built.
        annotations:
          type: object
          additionalProperties:
            type: string
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowTask"
        trigger:
          type: string
          description: >
            What started the run: "initial" while creating the component,
            "manual" on an explicit build request, "automatic" for the control
            plane's auto-build on git push.
          enum: [initial, manual, automatic]
          example: manual

    WorkflowRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/WorkflowRun"
        totalCount:
          type: integer
          description: Never set, so always omitted.

    BuildStep:
      type: object
      required: [number, name, status]
      properties:
        number:
          type: integer
        name:
          type: string
        status:
          type: string
        conclusion:
          type: string
        started_at:
          type: string
        completed_at:
          type: string

    BuildStage:
      type: object
      required: [log, status, steps]
      properties:
        log:
          type: string
          description: Newline-separated log lines, each prefixed with its timestamp when known.
        status:
          type: string
          description: Always empty.
        steps:
          type: array
          description: Always empty.
          items:
            $ref: "#/components/schemas/BuildStep"

    BuildRunLogs:
      type: object
      description: >
        Build logs in the init/build/deploy envelope the console's log viewer
        renders. All log lines are in `build`; `init` and `deploy` are always
        empty.
      required: [init, build, deploy]
      properties:
        init:
          $ref: "#/components/schemas/BuildStage"
        build:
          $ref: "#/components/schemas/BuildStage"
        deploy:
          $ref: "#/components/schemas/BuildStage"
    # ── Deployments ───────────────────────────────────────────────────────────

    MessageResponse:
      type: object
      description: Plain-string result of a mutation.
      required: [message]
      properties:
        message:
          type: string

    Author:
      type: object
      required: [name, date, email, avatarUrl]
      properties:
        name:
          type: string
        date:
          type: string
        email:
          type: string
        avatarUrl:
          type: string

    Commit:
      type: object
      required: [sha, message, isLatest, author]
      properties:
        sha:
          type: string
          description: Abbreviated (8-character) commit SHA.
          example: 3ddcb7ef
        message:
          type: string
        isLatest:
          type: boolean
          description: Always false.
        author:
          $ref: "#/components/schemas/Author"

    Build:
      type: object
      description: The build whose image is deployed.
      required: [buildId]
      properties:
        buildId:
          type: string
          description: >
            The build's WorkflowRun name when the deployed image maps back to a
            build, else the release name or commit.
        deployedAt:
          type: string
          description: Creation time of the bound ComponentRelease.
        runId:
          type: string
          description: >
            The build's WorkflowRun name; omitted when no build among the first
            20 WorkflowRuns OpenChoreo returns for the component matches the
            deployed image.
        commit:
          $ref: "#/components/schemas/Commit"

    ReleaseMgtDeploymentRef:
      type: object
      description: >
        Identity of the deployed release. OpenChoreo has no separate
        release-management id, so the bound ComponentRelease name serves as the
        release id.
      properties:
        releaseMgtReleaseId:
          type: string
          description: Full ComponentRelease name.
        releaseMgtDeploymentId:
          type: string
          description: Never populated.
        releaseMgtReleaseName:
          type: string
          description: The release name without its `<component>-` prefix, for display.

    ComponentDeployment:
      type: object
      required: [releaseId, cron, cronTimezone, configCount]
      properties:
        releaseId:
          type: string
          description: Name of the bound ComponentRelease.
        cron:
          type: string
          description: Cron schedule of a scheduled task; empty for other component types.
        cronTimezone:
          type: string
          description: >
            Always empty from GET .../deployments (the binding's timezone is not
            read; GET .../schedules carries it); always "UTC" from POST .../deploy.
        deploymentStatusV2:
          type: string
          description: >
            Derived from the ReleaseBinding: SUSPENDED when stopped (Undeploy),
            ACTIVE when Ready, IN_PROGRESS while rolling out, ERROR when the
            rollout failed.
          enum: [ACTIVE, IN_PROGRESS, ERROR, SUSPENDED]
        invokeUrl:
          type: string
          description: Never populated.
        imageUrl:
          type: string
          description: Never populated.
        configCount:
          type: integer
          description: Always 0.
        build:
          $ref: "#/components/schemas/Build"
        releaseMgtDeployment:
          $ref: "#/components/schemas/ReleaseMgtDeploymentRef"

    BuildRun:
      type: object
      required: [id, sha, started_at, completed_at, status, conclusion, conclusionV2,
        isAutoDeploy, isTriggeredAtCreation, name, failureReason, sourceCommitId]
      properties:
        id:
          type: integer
        sha:
          type: string
        started_at:
          type: string
        completed_at:
          type: string
        status:
          type: string
        conclusion:
          type: string
        conclusionV2:
          type: string
        isAutoDeploy:
          type: boolean
        isTriggeredAtCreation:
          type: boolean
        name:
          type: string
        failureReason:
          type: integer
        sourceCommitId:
          type: string
        buildRef:
          type: string

    BuildRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BuildRun"

    ReleaseMgtDeployment:
      type: object
      required: [id, release_mgt_id, environment_id, deployment_name, attempt,
        config_revision, status, comment, deployed_at, deployed_by, release_name,
        commit_hash, created_at]
      properties:
        id:
          type: string
          description: "`<component>-<environment>`."
          example: hello-world-service-development
        release_mgt_id:
          type: string
          description: Always empty.
        environment_id:
          type: string
          description: Environment name.
        deployment_name:
          type: string
          description: The bound release name.
        attempt:
          type: integer
          description: Always 0.
        config_revision:
          type: integer
          description: Always 0.
        status:
          type: string
          description: >
            ACTIVE → SUCCESS, ERROR → FAILED; in-progress and stopped bindings
            report PENDING.
          enum: [SUCCESS, FAILED, PENDING]
        comment:
          type: string
          description: Always empty.
        deployed_at:
          type: string
          description: Creation time of the bound ComponentRelease.
        deployed_by:
          type: string
          description: Always empty.
        release_name:
          type: string
        commit_hash:
          type: string
          description: Abbreviated (8-character) commit SHA of the deployed build.
        created_at:
          type: string

    ReleaseMgtDeploymentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseMgtDeployment"

    DeploymentTrackImage:
      type: object
      required: [imageId, createdAt, updatedAt, commitHash, commitMessage, builtAt, runId, author]
      properties:
        imageId:
          type: string
          description: The build's WorkflowRun name — the `imageId` to deploy.
          example: hello-world-service-workflow-a1557f64
        createdAt:
          type: string
          description: Build start time.
        updatedAt:
          type: string
          description: Always empty.
        commitHash:
          type: string
          description: Abbreviated (8-character) commit SHA.
        commitMessage:
          type: string
        builtAt:
          type: string
          description: Build completion time, else its start time when no completion time is recorded.
        runId:
          type: string
          description: Same as `imageId`.
        author:
          $ref: "#/components/schemas/Author"

    DeploymentTrackImageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentTrackImage"

    DeployDeploymentTrackInput:
      type: object
      properties:
        imageId:
          type: string
          description: >
            WorkflowRun name of the build to deploy. Empty releases the current
            Workload.
          example: hello-world-service-workflow-a1557f64
        environmentId:
          type: string
          description: >
            Environment name to bind the release to. Required except for AI
            agents (where it is ignored); it is not validated up front, so
            omitting it fails with 500.
          example: development
        cron:
          type: string
          description: Cron schedule (scheduled tasks only).
          example: "*/5 * * * *"
        cronTimezone:
          type: string
          example: UTC
        jobTimeoutSeconds:
          type: integer
          description: Per-run deadline of a scheduled task (component-wide).
        cronJobAllowConcurrency:
          type: boolean
          description: >
            Whether a scheduled run may start while the previous one is still
            running (component-wide; Allow vs Forbid concurrency policy).
        componentId:
          type: string
          description: Accepted for console parity; ignored.
        id:
          type: string
          description: Accepted for console parity; ignored.
        deploymentPipelineId:
          type: string
          description: Accepted for console parity; ignored.

    DeployPrebuiltInput:
      type: object
      required: [imageUrl]
      properties:
        imageUrl:
          type: string
          description: Container image to deploy.
          example: docker.io/wso2/prebuilt-integration:1.0.0
        configurations:
          type: array
          description: >
            Config values collected during setup, written onto the Workload. When
            absent, values previously saved for the component are used.
          items:
            $ref: "#/components/schemas/ConfigurationItem"
        componentId:
          type: string
          description: Accepted for console parity; ignored.
        appBranch:
          type: string
          description: >
            Accepted for console parity; ignored — the source branch is fixed on
            the component at create time.

    PromoteInput:
      type: object
      required: [deploymentPipelineId, sourceEnvironmentId, targetEnvironmentId, sourceReleaseId]
      properties:
        deploymentPipelineId:
          type: string
          description: Must match the project's current deployment pipeline.
        sourceEnvironmentId:
          type: string
          description: Environment name to promote from.
          example: development
        targetEnvironmentId:
          type: string
          description: Environment name to promote to.
          example: production
        sourceReleaseId:
          type: string
          description: Must match the active release currently bound in the source environment.
        apiVersionId:
          type: string
          description: Accepted for console parity; ignored.

    PromoteResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        proxyReconciliation:
          $ref: "#/components/schemas/ProxyReconciliationSummary"

    ProxyReconciliationSummary:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, DEGRADED, FAILED, NOT_APPLICABLE, PENDING_PROMOTION]
        statusUrl:
          type: string
        error:
          type: string

    ProxyReconciliationEndpoint:
      type: object
      required: [endpoint, status]
      properties:
        endpoint: { type: string }
        exposure:
          $ref: "#/components/schemas/EndpointExposure"
        gateway: { type: string }
        deploymentId: { type: string }
        buildId: { type: string }
        expectedDigest: { type: string }
        observedDigest: { type: string }
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, DEGRADED, FAILED, NOT_APPLICABLE, PENDING_PROMOTION]
        error: { type: string }

    ProxyReconciliationStatus:
      type: object
      required: [status, component, environment, endpoints]
      properties:
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, DEGRADED, FAILED, NOT_APPLICABLE, PENDING_PROMOTION]
        component: { type: string }
        environment: { type: string }
        componentRelease: { type: string }
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/ProxyReconciliationEndpoint"
        attemptCount: { type: integer }
        lastAttemptAt: { type: string, format: date-time }
        nextRetryAt: { type: string, format: date-time }
        error: { type: string }

    StopDeploymentInput:
      type: object
      required: [environment]
      properties:
        environment:
          type: string
          description: >
            Environment name to stop the component in. Not validated up front:
            when omitted no binding matches and the call returns 404 (500 for an
            AI agent).
          example: development
        orgHandler:
          type: string
          description: Accepted for console parity; ignored.
        componentId:
          type: string
          description: Accepted for console parity; ignored.
        releaseId:
          type: string
          description: Accepted for console parity; ignored.
        type:
          type: string
          description: Accepted for console parity; ignored.
        clearCron:
          type: boolean
          description: Accepted for console parity; ignored — stopping keeps the schedule.

    UpdateAutoDeployInput:
      type: object
      properties:
        autoDeployEnabled:
          type: boolean
          description: Not validated — an omitted field is read as false and disables auto-deploy.

    UpdateAutoBuildInput:
      type: object
      properties:
        autoBuildEnabled:
          type: boolean
          description: Not validated — an omitted field is read as false and disables auto-build.

    # ── Deployment pipelines ──────────────────────────────────────────────────

    PromotionPath:
      type: object
      required: [sourceEnvironment, targetEnvironments]
      properties:
        sourceEnvironment:
          type: string
          example: development
        targetEnvironments:
          type: array
          items:
            type: string
          example: [staging]

    DeploymentPipeline:
      type: object
      required: [name]
      properties:
        uid:
          type: string
        name:
          type: string
          example: default
        displayName:
          type: string
        description:
          type: string
        promotionPaths:
          type: array
          items:
            $ref: "#/components/schemas/PromotionPath"
        createdAt:
          type: string

    DeploymentPipelineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentPipeline"

    CreateDeploymentPipelineRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        promotionPaths:
          type: array
          items:
            $ref: "#/components/schemas/PromotionPath"

    UpdateDeploymentPipelineRequest:
      type: object
      properties:
        displayName:
          type: string
          description: Empty keeps the current value.
        description:
          type: string
          description: Empty keeps the current value.
        promotionPaths:
          type: array
          description: Replaces the pipeline's promotion paths when present.
          items:
            $ref: "#/components/schemas/PromotionPath"

    # ── Environments ──────────────────────────────────────────────────────────

    Environment:
      type: object
      required: [id, name, critical, scaleToZeroEnabled]
      properties:
        id:
          type: string
          description: >
            The environment's OpenChoreo name — the value to use in
            /environments/{environmentName} and wherever an environment id is
            expected.
          example: development
        name:
          type: string
          description: Display name, falling back to the OpenChoreo name.
          example: Development
        critical:
          type: boolean
          description: Whether this is a production environment.
        templateId:
          type: string
          description: Never populated.
        dpId:
          type: string
          description: Data plane the environment runs on.
        description:
          type: string
        createdAt:
          type: string
        apimEnvId:
          type: string
          description: Never populated.
        scaleToZeroEnabled:
          type: boolean
          description: Always false.

    EnvironmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Environment"

    CreateEnvironmentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: staging
        displayName:
          type: string
        description:
          type: string
        dataPlaneRef:
          type: string
          description: Data plane to place the environment on (see GET /dataplanes).
        isProduction:
          type: boolean

    UpdateEnvironmentRequest:
      type: object
      properties:
        displayName:
          type: string
          description: Empty keeps the current value.
        description:
          type: string
          description: Empty keeps the current value.
        isProduction:
          type: boolean
          description: Omit to keep the current value.

    # ── Data planes ───────────────────────────────────────────────────────────

    DataPlane:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: default

    DataPlaneList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DataPlane"
    # ── Schedules (release bindings) ────────────────────────────────────────────

    ReleaseBinding:
      type: object
      description: >
        A component's deployment in one environment. The cron fields are
        populated only for scheduled-task components; everything else applies to
        any component.
      required: [environment, cronExpression, state]
      properties:
        environment:
          type: string
          example: development
        componentName:
          type: string
        projectName:
          type: string
        cronExpression:
          type: string
          description: Empty when the component has no schedule or its schedule is stopped.
          example: "0 * * * *"
        cronTimezone:
          type: string
          example: Asia/Colombo
        state:
          type: string
          description: Desired state.
          enum: [Active, Undeploy]
        deploymentStatusV2:
          type: string
          description: Actual state, derived from the binding's status conditions.
          enum: [ACTIVE, SUSPENDED, IN_PROGRESS, ERROR]
        imagePullPolicy:
          type: string
          description: IfNotPresent when the binding sets none.
          example: IfNotPresent
        releaseName:
          type: string
          description: The ComponentRelease the binding currently points at.
        replicas:
          type: integer
        backoffLimit:
          type: integer
          description: Component-wide (same value in every environment).
        activeDeadlineSeconds:
          type: integer
          description: Component-wide (same value in every environment).
        concurrencyPolicy:
          type: string
          description: Component-wide (same value in every environment).
          enum: [Allow, Forbid, Replace]

    ReleaseBindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseBinding"

    ResourceQuantity:
      type: object
      description: A cpu/memory pair in Kubernetes quantity notation.
      properties:
        cpu:
          type: string
          example: 500m
        memory:
          type: string
          example: 512Mi

    ResourceRequirements:
      type: object
      description: Container sizing. Component types apply their own defaults when unset.
      properties:
        requests:
          $ref: "#/components/schemas/ResourceQuantity"
        limits:
          $ref: "#/components/schemas/ResourceQuantity"

    UpsertReleaseBindingRequest:
      type: object
      description: >
        General release-binding payload — despite the cron fields, most callers
        set no schedule at all. An omitted field leaves the binding's current
        value intact on update, except `cronExpression`: omitted or empty is
        written as a never-firing schedule, so resend the current cron to keep
        it.
      required: [environment]
      properties:
        environment:
          type: string
          example: development
        cronExpression:
          type: string
          description: Omitted or empty stops a scheduled task from firing, on create and on update.
          example: "0 * * * *"
        cronTimezone:
          type: string
          description: Empty keeps the current timezone on update.
          example: Asia/Colombo
        state:
          type: string
          enum: [Active, Undeploy]
          description: Defaults to Active on create; empty keeps the current state on update.
        imagePullPolicy:
          type: string
          description: Empty keeps the current policy (IfNotPresent on create).
          example: IfNotPresent
        releaseName:
          type: string
          description: >
            Empty keeps the current release on update. On create, empty generates
            a new ComponentRelease from the component's current Workload.
        backoffLimit:
          type: integer
          description: Component-wide — applies to every environment.
        activeDeadlineSeconds:
          type: integer
          description: Component-wide — applies to every environment.
        concurrencyPolicy:
          type: string
          enum: [Allow, Forbid, Replace]
          description: Component-wide; empty keeps the component's current policy.
        resources:
          description: >
            Omitted keeps the current sizing. When present it replaces it:
            requests, limits, cpu or memory left unset are cleared.
          allOf:
            - $ref: "#/components/schemas/ResourceRequirements"
        replicas:
          type: integer
          description: >
            Ignored. A schedule never changes how many replicas a workload
            runs; the binding keeps its current count.

    # ── Executions ──────────────────────────────────────────────────────────────

    Execution:
      type: object
      description: One run of a scheduled task (a Kubernetes Job).
      required: [jobId, status]
      properties:
        jobId:
          type: string
          description: The Job name.
          example: nightly-sync-development-29713548
        status:
          type: string
          description: Unknown for a run that has just been triggered or a Job with no reported status.
          enum: [Running, Succeeded, Failed, Unknown]
        startTime:
          type: string
          format: date-time
        completionTime:
          type: string
          format: date-time
        revisionId:
          type: string
          description: >
            Commit the run's image was built from (the image tag's revision) or,
            when a GitHub client is configured and the component builds from a
            repository subdirectory, the last commit that touched it.

    ExecutionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Execution"

    ExecutionHistoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Execution"
        nextCursor:
          type: string
          format: date-time
          description: >
            Pass as `before` to fetch the next (older) page. Omitted when no
            older runs remain; a present cursor may still yield an empty page.

    TriggerExecutionRequest:
      type: object
      description: A body that is not valid JSON is ignored, not rejected.
      properties:
        args:
          type: array
          description: >
            Container args for this run only. Omitted or empty keeps the CronJob's
            own args.
          items:
            type: string
          example: ["--full-sync"]

    ExecutionConfigs:
      type: object
      properties:
        cronjobFrequency:
          type: string
        cronjobTimezone:
          type: string
        cronjobAllowConcurrency:
          type: boolean
        timeoutSeconds:
          type: integer
        retryCount:
          type: integer

    ExecutionArgument:
      type: object
      required: [argumentName, argumentValue]
      properties:
        argumentName:
          type: string
        argumentValue:
          type: string

    UpdateJobConfigsInput:
      type: object
      description: >
        The ICP `JobConfigInput`, forwarded unchanged and not validated by this
        service: an omitted `orgHandler`, `componentId`, `environmentId` or
        `versionId` is sent to ICP as an empty string, and omitted optional
        fields are left out.
      properties:
        orgHandler:
          type: string
        componentId:
          type: string
        environmentId:
          type: string
        versionId:
          type: string
        cronFrequency:
          type: string
        cronTimezone:
          type: string
        jobTimeoutSeconds:
          type: integer
        cronJobAllowConcurrency:
          type: boolean
        jobRetryCount:
          type: integer

    UpdateJobConfigsResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          description: Always true on 200.

    # ── Resource tree ───────────────────────────────────────────────────────────

    ResourceRef:
      type: object
      required: [version, kind, name, uid]
      properties:
        group:
          type: string
        version:
          type: string
        kind:
          type: string
        namespace:
          type: string
        name:
          type: string
        uid:
          type: string

    HealthInfo:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: Healthy
        message:
          type: string

    ResourceNode:
      type: object
      description: One Kubernetes resource rendered for the component.
      required: [version, kind, name, uid]
      properties:
        group:
          type: string
        version:
          type: string
        kind:
          type: string
          example: Deployment
        namespace:
          type: string
        name:
          type: string
        uid:
          type: string
        resourceVersion:
          type: string
        createdAt:
          type: string
          format: date-time
        parentRefs:
          type: array
          items:
            $ref: "#/components/schemas/ResourceRef"
        object:
          type: object
          description: The raw Kubernetes object.
          additionalProperties: true
        health:
          $ref: "#/components/schemas/HealthInfo"

    ReleaseResourceTree:
      type: object
      required: [name, targetPlane, nodes]
      properties:
        name:
          type: string
        targetPlane:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ResourceNode"

    ResourceTreeResponse:
      type: object
      required: [renderedReleases]
      properties:
        renderedReleases:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseResourceTree"

    ResourceEvent:
      type: object
      required: [type, reason, message]
      properties:
        type:
          type: string
          example: Normal
        reason:
          type: string
          example: Pulled
        message:
          type: string
        count:
          type: integer
        firstTimestamp:
          type: string
          format: date-time
        lastTimestamp:
          type: string
          format: date-time
        source:
          type: string

    ResourceEventsResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ResourceEvent"

    PodLogEntry:
      type: object
      required: [timestamp, log]
      properties:
        timestamp:
          type: string
          format: date-time
        log:
          type: string
        container:
          type: string

    PodLogsResponse:
      type: object
      required: [logEntries]
      properties:
        logEntries:
          type: array
          items:
            $ref: "#/components/schemas/PodLogEntry"

    # ── Runtime ─────────────────────────────────────────────────────────────────

    ReleaseRuntimeDetails:
      type: object
      description: >
        Runtime snapshot of a component's currently bound release. Every field
        except `replicas` and `undeployed` is best-effort and omitted when it
        cannot be resolved.
      required: [replicas, undeployed]
      properties:
        componentId:
          type: string
          description: The component's OpenChoreo UID — not the name used in the path.
        releaseId:
          type: string
          description: The release's OpenChoreo UID — not the name used in the path.
        environment:
          type: string
        namespace:
          type: string
          description: Dataplane namespace the release runs in.
        replicas:
          type: integer
          description: Number of Pod objects in the release's resource tree, in any phase.
        undeployed:
          type: boolean
          description: True when the binding's state is Undeploy or no binding points at the release.
        image:
          type: string
          description: Image of a currently live pod.
        lastDeployedMessage:
          type: string
          description: Commit message of the build that produced `image`.

    PodResourceQuantities:
      type: object
      description: cpu/memory as Kubernetes quantity strings.
      properties:
        cpu:
          type: string
          example: 500m
        memory:
          type: string
          example: 128Mi

    PodContainerResources:
      type: object
      properties:
        requests:
          $ref: "#/components/schemas/PodResourceQuantities"
        limits:
          $ref: "#/components/schemas/PodResourceQuantities"

    PodSpecContainer:
      type: object
      required: [name]
      properties:
        name:
          type: string
        image:
          type: string
        resources:
          $ref: "#/components/schemas/PodContainerResources"

    PodMetadata:
      type: object
      required: [name, uid]
      properties:
        name:
          type: string
        uid:
          type: string
        namespace:
          type: string

    PodSpec:
      type: object
      required: [containers]
      properties:
        containers:
          type: array
          items:
            $ref: "#/components/schemas/PodSpecContainer"
        nodeName:
          type: string

    PodContainerState:
      type: object
      description: At most one of running / waiting / terminated is set.
      properties:
        running:
          type: object
          properties:
            startedAt:
              type: string
              format: date-time
        waiting:
          type: object
          properties:
            reason:
              type: string
              example: CrashLoopBackOff
            message:
              type: string
        terminated:
          type: object
          properties:
            reason:
              type: string
            exitCode:
              type: integer
              description: Omitted when 0.

    PodContainerStatus:
      type: object
      required: [name, ready, restartCount]
      properties:
        name:
          type: string
        ready:
          type: boolean
        restartCount:
          type: integer
        state:
          $ref: "#/components/schemas/PodContainerState"

    PodCondition:
      type: object
      required: [type, status]
      properties:
        type:
          type: string
          example: Ready
        status:
          type: string
          example: "True"
        lastTransitionTime:
          type: string
          format: date-time
        message:
          type: string
        reason:
          type: string

    PodStatus:
      type: object
      required: [phase]
      properties:
        phase:
          type: string
          example: Running
        startTime:
          type: string
          format: date-time
        containerStatuses:
          type: array
          items:
            $ref: "#/components/schemas/PodContainerStatus"
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/PodCondition"

    ClusterPod:
      type: object
      description: >
        A Kubernetes Pod trimmed to the fields the runtime page needs. Field
        names and nesting mirror the Kubernetes Pod API object.
      required: [metadata, spec, status]
      properties:
        metadata:
          $ref: "#/components/schemas/PodMetadata"
        spec:
          $ref: "#/components/schemas/PodSpec"
        status:
          $ref: "#/components/schemas/PodStatus"

    PodMetrics:
      type: object
      description: >
        Mirrors the Kubernetes metrics.k8s.io PodMetrics shape. Never populated:
        OpenChoreo has no per-pod metrics source.
      required: [metadata, containers]
      properties:
        metadata:
          type: object
          required: [name]
          properties:
            name:
              type: string
            namespace:
              type: string
        timestamp:
          type: string
          format: date-time
        window:
          type: string
        containers:
          type: array
          items:
            type: object
            required: [name, usage]
            properties:
              name:
                type: string
              usage:
                $ref: "#/components/schemas/PodResourceQuantities"

    ComponentLevelMetrics:
      type: object
      description: Usage and limits aggregated across all of the release's pods.
      required: [cpu, memory]
      properties:
        cpu:
          type: object
          required: [usedCores, limitCores]
          properties:
            usedCores:
              type: number
              description: Fractional cores (0.5 == 500m).
            limitCores:
              type: number
        memory:
          type: object
          required: [usedBytes, limitBytes]
          properties:
            usedBytes:
              type: integer
              format: int64
            limitBytes:
              type: integer
              format: int64

    ReleaseMetrics:
      type: object
      required: [podLevelMetrics]
      properties:
        podLevelMetrics:
          type: array
          description: Always empty — OpenChoreo has no per-pod metrics source.
          items:
            $ref: "#/components/schemas/PodMetrics"
        componentLevelMetrics:
          $ref: "#/components/schemas/ComponentLevelMetrics"
        metricsUnavailableReason:
          type: string
          enum: [sharedWithOtherTracks]
          description: >
            Why componentLevelMetrics is left out, when the user should know.
            `sharedWithOtherTracks`: the usage can't be told apart from another
            deployment track of the integration deployed in the same environment.

    PodEvent:
      type: object
      description: One Kubernetes lifecycle event for a pod.
      required: [id, reason, message]
      properties:
        id:
          type: string
          description: >
            The event's position in this response — a list key only, not
            comparable across requests.
        reason:
          type: string
          example: BackOff
        message:
          type: string
        kind:
          type: string
          description: Always "Pod".
          example: Pod
        count:
          type: integer
          description: Times the event recurred; omitted when unknown.
        timestamp:
          type: string
          format: date-time
          description: Last-seen time, falling back to first-seen; omitted when neither is known.

    PodLogsText:
      type: object
      required: [logs]
      properties:
        logs:
          type: string
          description: Newline-joined log lines.

    # ── Loggers ─────────────────────────────────────────────────────────────────

    Logger:
      type: object
      properties:
        componentName:
          type: string
        logLevel:
          type: string
          example: INFO
        runtimeIds:
          type: array
          items:
            type: string

    LoggerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Logger"

    UpdateLogLevelInput:
      type: object
      description: The ICP `UpdateLogLevelInput`, forwarded unchanged.
      properties:
        runtimeIds:
          type: array
          items:
            type: string
        componentName:
          type: string
        logLevel:
          type: string
          example: DEBUG

    UpdateLogLevelResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        commandIds:
          type: array
          items:
            type: string
    # ── File mounts ─────────────────────────────────────────────────────────────

    FileMount:
      type: object
      required: [mountPath]
      properties:
        fileName:
          type: string
          description: Ignored — the file name is taken from the path.
        mountPath:
          type: string
          description: Container directory the file is mounted into.
          example: /conf/certs
        content:
          type: string
          maxLength: 1048576
          description: >
            File content, mounted exactly as sent. At most 1 MiB, counted in
            bytes of the string as sent (for base64 content, the encoded
            length) — multi-byte characters count more than once.
          example: |
            -----BEGIN CERTIFICATE-----
            ...
            -----END CERTIFICATE-----
        isBase64:
          type: boolean
          default: false
          description: >
            Validation only: when true, `content` must be valid standard
            base64 (400 otherwise). The content is not decoded — the base64
            text itself is mounted — and the flag is neither stored nor
            returned.
        sensitive:
          type: boolean
          default: false
          description: >
            When true the content is stored in a SecretReference and mounted via
            valueFrom.secretKeyRef; otherwise it is mounted inline on the
            ReleaseBinding. Use for private keys and other secret material.

    FileMountListResponse:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileMountItem"

    FileMountItem:
      type: object
      required: [fileName, mountPath, sensitive, configType]
      properties:
        fileName:
          type: string
          example: ca.pem
        mountPath:
          type: string
          example: /conf/certs
        sensitive:
          type: boolean
          example: false
        configType:
          type: string
          description: Always "File" for mounted files.
          example: File
        content:
          type: string
          description: >
            Inline content of a non-sensitive file. Returned only by the
            single-file GET; omitted for sensitive (secret-backed) files and
            in list responses.

    # ── Env groups ──────────────────────────────────────────────────────────────

    EnvVarGroup:
      type: object
      description: >
        A named bundle of environment variables projected into a component's
        container for one environment. `sensitive` applies to the whole group:
        every key is secret-backed or none is. Responses always carry `name`
        and `sensitive`.
      properties:
        name:
          type: string
          description: Group name. Ignored in request bodies — taken from the path.
          example: app-settings
        sensitive:
          type: boolean
          default: false
        keys:
          type: array
          description: Variable names in the group, sorted. Response-only; ignored in request bodies.
          items:
            type: string
          example: [API_BASE_URL, LOG_LEVEL]
        data:
          type: object
          description: >
            Variable name → value. On write, required (at least one entry)
            unless `keep` is given; a stored key in neither `data` nor `keep`
            is removed. In a sensitive group every value must be non-empty,
            or the request fails with 400: name a stored secret in `keep` to
            leave it unchanged. Returned only by the single-group GET, where every
            value of a sensitive group is an empty string (secret values are
            write-only). Omitted in list responses.
          additionalProperties:
            type: string
          example:
            API_BASE_URL: https://api.example.com
            LOG_LEVEL: DEBUG
        keep:
          type: array
          description: >
            Write-only. Stored keys of a sensitive group that stay with their
            current value, so one key can change without re-sending the other
            secrets. Each must already be a secret of this group, be listed
            once and not also appear in `data`; otherwise the request fails
            with 400.
          items:
            type: string
          example: [DB_PASSWORD]

    EnvVarGroupListResponse:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          description: Sorted by name. Each group carries `name`, `sensitive` and `keys` only.
          items:
            $ref: "#/components/schemas/EnvVarGroup"

    # ── Config schema ───────────────────────────────────────────────────────────

    ConfigSchemaResponse:
      type: object
      required: [jsonSchema, configurations]
      properties:
        jsonSchema:
          type: string
          format: byte
          description: >
            Base64-encoded JSON Schema of the component's Ballerina
            configurables. A root `requiredLevel` integer is injected when
            absent: the schema depth at which the console's form splits
            required from optional fields. Empty when the build recorded no
            schema, and always empty in the save response.
        configurations:
          type: array
          nullable: true
          description: null on GET when no values are saved or deployed.
          items:
            $ref: "#/components/schemas/ConfigurationItem"
        commit:
          type: string
          description: Commit of the build the schema came from; omitted when the schema came from the Workload.
        buildName:
          type: string
          description: Build (workflow run) the schema came from; omitted when the schema came from the Workload.

    ConfigurationItem:
      type: object
      required: [key, values]
      properties:
        key:
          type: string
          example: wso2.myintegration.apiUrl
        values:
          type: array
          description: >
            Only the first value is read on save. A sensitive key's value is
            always returned as an empty string.
          items:
            $ref: "#/components/schemas/ConfigurationValue"
        isRequired:
          type: boolean
          description: Ignored on save and never returned.
        isSensitive:
          type: boolean
          description: >
            Store the value as a secret and redact it on read. Without the
            secret manager configured, sensitive values are saved but not
            projected to the running pod.
        isSet:
          type: boolean
          description: >
            True when a value is saved for this key — for a sensitive key this
            is the only signal that a (redacted) value exists.

    ConfigurationValue:
      type: object
      required: [value]
      properties:
        value:
          type: string
        environmentUuid:
          type: string
          description: >
            Ignored on save and never returned — values are scoped by the
            `{environmentName}` path segment.

    SaveConfigSchemaRequest:
      type: object
      properties:
        configurations:
          type: array
          items:
            $ref: "#/components/schemas/ConfigurationItem"
        commitHash:
          type: string
          description: Commit of the schema the values were entered against; recorded with the saved values and echoed back as `commit`.

    # ── Secrets ─────────────────────────────────────────────────────────────────

    JwtSecret:
      type: object
      required: [secret]
      properties:
        secret:
          type: string
          description: The secret issued by ICP. Empty when ICP returns no value.

    # ── Health check ────────────────────────────────────────────────────────────

    HealthCheck:
      type: object
      required: [environment]
      properties:
        environment:
          type: string
          example: development
        livenessProbe:
          $ref: "#/components/schemas/Probe"
        readinessProbe:
          $ref: "#/components/schemas/Probe"
        syncStatus:
          type: string
          description: >
            Reason of the ReleaseBinding's failing Ready condition (for example
            a rejected probe). Omitted while the binding is ready or still
            progressing.
        syncMessage:
          type: string
          description: Message of the failing Ready condition; omitted with `syncStatus`.

    UpdateHealthCheckRequest:
      type: object
      description: Both probes are replaced; an omitted probe is cleared.
      properties:
        livenessProbe:
          $ref: "#/components/schemas/Probe"
        readinessProbe:
          $ref: "#/components/schemas/Probe"

    Probe:
      type: object
      description: A Kubernetes probe. Exactly one of `httpGet`, `tcpSocket` or `exec` must be set.
      properties:
        httpGet:
          $ref: "#/components/schemas/HTTPGetAction"
        tcpSocket:
          $ref: "#/components/schemas/TCPSocketAction"
        exec:
          $ref: "#/components/schemas/ExecAction"
        initialDelaySeconds:
          type: integer
        periodSeconds:
          type: integer
        timeoutSeconds:
          type: integer
        failureThreshold:
          type: integer
        successThreshold:
          type: integer
          description: Must be 1 or omitted on a liveness probe.

    HTTPGetAction:
      type: object
      properties:
        path:
          type: string
          example: /health
        port:
          type: integer
          example: 9090
        httpHeaders:
          type: array
          items:
            $ref: "#/components/schemas/HTTPHeader"

    HTTPHeader:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string

    TCPSocketAction:
      type: object
      properties:
        port:
          type: integer
          example: 9090

    ExecAction:
      type: object
      description: Runs a command inside the container; exit code 0 passes.
      properties:
        command:
          type: array
          items:
            type: string

    # ── Autoscaling ─────────────────────────────────────────────────────────────

    Autoscaling:
      type: object
      required: [environment, supported, effective, memoryEffective, enabled, maxReplicasLimit]
      properties:
        environment:
          type: string
          example: development
        supported:
          type: boolean
          description: The component's type can autoscale.
        effective:
          type: boolean
          description: >
            The release deployed to this environment renders the setting.
            False until a component deployed before its type could autoscale
            is deployed again.
        memoryEffective:
          type: boolean
          description: >
            The release deployed to this environment renders a memory target.
            False until a component deployed before its type and HPA trait
            gained one is deployed again; such a release drops the target and
            scales on CPU alone, so enabling with a memory target is refused (409).
        enabled:
          type: boolean
        minReplicas:
          type: integer
          minimum: 1
          description: Omitted when never set.
        maxReplicas:
          type: integer
          minimum: 1
          description: Omitted when never set.
        cpuUtilizationPercentage:
          type: integer
          minimum: 1
          maximum: 100
          description: Average CPU utilization, relative to the CPU request, that the HPA targets. Omitted when never set.
        memoryUtilizationPercentage:
          type: integer
          minimum: 1
          maximum: 100
          description: >
            Average memory utilization, relative to the memory request, that the
            HPA also targets; it scales on whichever of CPU and memory asks for
            more replicas. Omitted when the HPA scales on CPU alone.
        maxReplicasLimit:
          type: integer
          description: Highest replica bound a write may set (AUTOSCALING_MAX_REPLICAS).
          example: 5
        status:
          $ref: "#/components/schemas/AutoscalingStatus"
        syncStatus:
          type: string
          description: >
            Reason of the ReleaseBinding's failing Ready condition, whatever
            caused it. Omitted while the binding is ready or still progressing.
        syncMessage:
          type: string
          description: Message of the failing Ready condition; omitted with `syncStatus`.

    AutoscalingStatus:
      type: object
      description: >
        The live HorizontalPodAutoscaler's own report. Present only while
        autoscaling is enabled and effective and the HPA has reported.
      required: [currentReplicas, desiredReplicas]
      properties:
        currentReplicas:
          type: integer
        desiredReplicas:
          type: integer
        currentCpuUtilizationPercentage:
          type: integer
          description: Average CPU utilization across the pods, relative to the CPU request.
        currentMemoryUtilizationPercentage:
          type: integer
          description: >
            Average memory utilization across the pods, relative to the memory
            request. Present only while the HPA targets memory.
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/AutoscalingCondition"

    AutoscalingCondition:
      type: object
      description: An HPA status condition, such as AbleToScale, ScalingActive or ScalingLimited.
      required: [type, status]
      properties:
        type:
          type: string
          example: ScalingActive
        status:
          type: string
          example: "False"
        reason:
          type: string
          example: FailedGetResourceMetric
        message:
          type: string
        lastTransitionTime:
          type: string
          format: date-time
          description: >
            When the condition took its current status. Tells a passing state, such
            as new pods not yet reporting metrics, from one that persists.

    UpdateAutoscalingRequest:
      type: object
      description: >
        Replaces the environment's autoscaling settings. Enabling requires
        every bound; the memory target is optional, and omitting it removes
        any stored one. Unknown fields are rejected.
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        minReplicas:
          type: integer
          minimum: 1
        maxReplicas:
          type: integer
          minimum: 1
        cpuUtilizationPercentage:
          type: integer
          minimum: 1
          maximum: 100
        memoryUtilizationPercentage:
          type: integer
          minimum: 1
          maximum: 100

    # ── Containers ─────────────────────────────────────────────────────────────

    ContainerPort:
      type: object
      required: [port, service_port, protocol]
      properties:
        name:
          type: string
          example: endpoint-9090
        port:
          type: integer
          example: 9090
        service_port:
          type: integer
          description: Mirrors `port` — there is no separate Service-port concept surfaced here.
          example: 9090
        protocol:
          type: string
          description: Defaults to TCP when the rendered container does not set one.
          example: TCP

    ReleaseContainer:
      type: object
      required: [ID, name, cpu, memory, cpu_limit, memory_limit]
      properties:
        ID:
          type: string
          description: Always "main" — OpenChoreo's Workload CRD models exactly one container per component (no sidecars).
          example: main
        name:
          type: string
          example: main
        type:
          type: string
          description: Always "MAIN".
          example: MAIN
        custom_image:
          type: string
          description: >
            The image the rendered workload runs. Always reported here, for
            platform-built and user-supplied images alike — the rendered
            Deployment carries no build provenance to tell them apart.
          example: "host.k3d.internal:10082/wc-01a00de6-edd6bea4-default-hello-world-service:v1-7223cb07"
        cpu:
          type: integer
          description: Milli-CPU request.
          example: 100
        memory:
          type: integer
          description: Mi request.
          example: 256
        cpu_limit:
          type: integer
          description: Milli-CPU limit.
          example: 100
        memory_limit:
          type: integer
          description: Mi limit.
          example: 256
        ports:
          type: array
          items:
            $ref: "#/components/schemas/ContainerPort"
        image_pull_policy:
          type: string
          example: IfNotPresent
        UpdatedAt:
          type: string
          description: >
            When the workload was last modified (RFC3339) — a Deployment's
            "Progressing" condition lastUpdateTime, or its creation timestamp
            as a fallback. Omitted when unknown.
          example: "2026-08-01T12:00:00Z"

    ReleaseContainerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 0 or 1 items — see ReleaseContainer.
          items:
            $ref: "#/components/schemas/ReleaseContainer"

    UpdateContainerRequest:
      type: object
      required: [cpu, cpu_limit, memory, memory_limit]
      properties:
        image_pull_policy:
          type: string
          description: Defaults to IfNotPresent when omitted.
          example: Always
        cpu:
          type: integer
          minimum: 1
          description: Milli-CPU request. Required, must be > 0 — this call fully replaces the component's resource sizing.
          example: 250
        cpu_limit:
          type: integer
          minimum: 1
          description: Milli-CPU limit. Required, must be > 0 — this call fully replaces the component's resource sizing.
          example: 500
        memory:
          type: integer
          minimum: 1
          description: Mi request. Required, must be > 0 — this call fully replaces the component's resource sizing.
          example: 128
        memory_limit:
          type: integer
          minimum: 1
          description: Mi limit. Required, must be > 0 — this call fully replaces the component's resource sizing.
          example: 256
    # ── Endpoints ──────────────────────────────────────────────────────────────

    APIResource:
      type: object
      description: One path + HTTP operation parsed from an endpoint's OpenAPI schema.
      required: [method, path]
      properties:
        method:
          type: string
          example: GET
        path:
          type: string
          example: /users
        summary:
          type: string
          example: List all users
        description:
          type: string
        operationId:
          type: string
          example: listUsers

    SchemaInfo:
      type: object
      description: Metadata extracted from the OpenAPI info section
      properties:
        title:
          type: string
          example: Hello World Service
        version:
          type: string
          example: "1.0.0"
        description:
          type: string
          example: A sample Ballerina service

    EndpointURL:
      type: object
      properties:
        host:
          type: string
        path:
          type: string
        port:
          type: integer
        scheme:
          type: string
          example: https

    EndpointURLs:
      type: object
      description: >
        `internal` is the in-cluster Service URL from the ReleaseBinding.
        `external` is the confirmed APIP gateway URL and is omitted unless
        Public visibility is enabled.
      properties:
        external:
          $ref: "#/components/schemas/EndpointURL"
        internal:
          $ref: "#/components/schemas/EndpointURL"

    EndpointResources:
      type: object
      required: [name, resources]
      properties:
        name:
          type: string
          description: Endpoint name as defined in the Workload spec
          example: http
        displayName:
          type: string
          description: Human-readable display name of the endpoint
          example: HTTP API
        type:
          type: string
          description: Endpoint type as declared on the Workload (e.g. HTTP, REST, GraphQL, Websocket, gRPC, TCP, UDP)
          example: HTTP
        port:
          type: integer
          example: 8080
        basePath:
          type: string
          example: /api/v1
        visibility:
          type: array
          description: Confirmed effective product visibility. Project is always present.
          items:
            type: string
            enum: [project, organization, public]
          example: [project, public]
        exposure:
          $ref: "#/components/schemas/EndpointExposure"
        visibilityStatus:
          $ref: "#/components/schemas/EndpointVisibilityStatus"
        urls:
          $ref: "#/components/schemas/EndpointURLs"
        schema:
          $ref: "#/components/schemas/SchemaInfo"
        schemaContent:
          type: string
          format: byte
          description: >
            The endpoint's OpenAPI document, base64-encoded as stored on the
            Workload. Present only when it parsed.
        resources:
          type: array
          description: Operations parsed from the schema; empty when there is no (parseable) schema.
          items:
            $ref: "#/components/schemas/APIResource"

    APIResourcesResponse:
      type: object
      required: [endpoints]
      properties:
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/EndpointResources"

    Endpoint:
      type: object
      required: [displayName, visibility]
      properties:
        displayName:
          type: string
        visibility:
          type: string
        apimId:
          type: string

    EndpointList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Endpoint"

    EnvEndpoint:
      type: object
      required: [id, releaseId, environmentId, displayName, type, visibility]
      properties:
        id:
          type: string
        releaseId:
          type: string
        environmentId:
          type: string
        displayName:
          type: string
        type:
          type: string
        visibility:
          type: string
        invokeUrl:
          type: string
        publicUrl:
          type: string
        apiContext:
          type: string

    EnvEndpointList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EnvEndpoint"

    EndpointSpecResponse:
      type: object
      required: [spec]
      properties:
        spec:
          type: string
          nullable: true

    SetEndpointVisibilityRequest:
      type: object
      required: [visibility]
      properties:
        visibility:
          type: array
          description: >
            Desired effective visibility. `project` is mandatory because it is
            implicit and cannot be disabled. At most one of `organization` and
            `public`; neither takes the endpoint off the gateway.
            `organization` requires a valid internal URL on the environment's
            default APIP gateway. Values are case-insensitive.
          items:
            type: string
            enum: [project, organization, public]
          example: [project, public]

    EndpointVisibilityResponse:
      type: object
      required: [visibility, visibilityStatus]
      properties:
        visibility:
          type: array
          description: What the gateway reports serving. Project is always present.
          items:
            type: string
            enum: [project, organization, public]
        visibilityStatus:
          $ref: "#/components/schemas/EndpointVisibilityStatus"
        exposure:
          $ref: "#/components/schemas/EndpointExposure"

    EndpointExposure:
      type: string
      enum: [none, public, organization]
      description: >
        The endpoint's saved gateway exposure in this environment, which every
        reconcile applies. `visibility` and `visibilityStatus` report what the
        gateway serves instead, which can be UNKNOWN. Absent when the saved
        choice could not be read.

    EndpointVisibilityStatus:
      type: object
      required: [public, organization]
      properties:
        public:
          $ref: "#/components/schemas/EndpointExposureState"
        organization:
          $ref: "#/components/schemas/EndpointExposureState"

    EndpointExposureState:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ENABLING, ENABLED, DISABLING, DISABLED, FAILED, UNKNOWN, UNAVAILABLE]
        url:
          type: string
        reason:
          type: string

    # ── API exposure + endpoint security ───────────────────────────────────────

    APIExposure:
      type: object
      description: A service endpoint exposed as a managed API on the WSO2 API Platform.
      required: [handle, context, gatewayId, status]
      properties:
        handle:
          type: string
          description: >
            The API Platform REST API handle, derived from (component, endpoint):
            a readable prefix plus a digest of the exact pair.
          example: greeter-greeter-http-1a2b3c4d
        context:
          type: string
          description: Gateway context path ("/" + handle).
          example: /greeter-greeter-http-1a2b3c4d
        gatewayId:
          type: string
          description: Handle of the gateway the API is deployed to.
        status:
          type: string
          description: Deployment status on the gateway.
          example: DEPLOYED
        publicUrl:
          type: string
          description: Public invoke URL of the exposed API (gateway endpoint + context), when resolvable.

    CreateAPIKeyRequest:
      type: object
      properties:
        displayName:
          type: string
          description: >
            Defaults to `<api-handle>-key`. Must not start with `test-key-`:
            that prefix marks test keys, which are never listed and are revoked
            automatically.
          example: prod-key
        expiresAt:
          type: string
          format: date-time
          description: Optional expiry, passed to the API Platform as given.

    APIKeyResult:
      type: object
      description: Returned once on creation. `apiKey` is the plaintext value, shown only here.
      required: [keyId, apiKey]
      properties:
        keyId:
          type: string
          description: Empty for an AI agent's test key, which agent-manager issues.
        displayName:
          type: string
        apiKey:
          type: string
          description: Plaintext API key — shown once, not retrievable later.
          example: ipaas_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        expiresAt:
          type: string
          format: date-time
          description: Set for short-lived test keys.

    APIKeySummary:
      type: object
      description: A masked API key.
      required: [name, maskedApiKey, status]
      properties:
        name:
          type: string
          description: Key id — the `keyName` to revoke it with.
        displayName:
          type: string
        maskedApiKey:
          type: string
          example: "***abcde"
        status:
          type: string
          example: active
        expiresAt:
          type: string
          format: date-time

    SecurityConfig:
      type: object
      description: >
        The single active authentication mode of an exposed endpoint's API.
        Exactly one mode is active at a time (the gateway ANDs auth policies
        with no fallback). Only the options block matching mode is meaningful.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [none, api-key, jwt]
          description: none = open, api-key = api-key-auth, jwt = jwt-auth.
          example: api-key
        apiKey:
          $ref: "#/components/schemas/APIKeySecurity"
        jwt:
          $ref: "#/components/schemas/JWTSecurity"
        publicUrl:
          type: string
          readOnly: true
          description: >
            The exposed API's invoke URL on the enforcing gateway — the URL to
            call, as opposed to the component's open raw route. Populated on GET
            (empty when unresolvable); ignored on PUT.
        operations:
          type: array
          readOnly: true
          items:
            $ref: "#/components/schemas/PolicyOperation"
          description: >
            The routes the API exposes, CORS preflights left out: the keys
            `jwt.operations` accepts. Populated on GET; ignored on PUT.

    APIKeySecurity:
      type: object
      description: Options of the api-key mode.
      properties:
        header:
          type: string
          description: Request header carrying the key (default X-API-Key).
          example: X-API-Key

    JWTSecurity:
      type: object
      description: >
        Options of the jwt mode. The key manager and audiences apply to every
        operation; scopes are set per operation.
      properties:
        issuers:
          type: array
          items:
            type: string
          description: >
            Gateway key-manager NAMES to trust (not URLs). Empty defaults to
            ThunderKeyManager, the environment's ThunderID, which is also the only
            name accepted today.
          example: [ThunderKeyManager]
        audiences:
          type: array
          maxItems: 20
          items:
            type: string
          description: >
            Optional allowed `aud` claim values; a token must carry at least one.
            Empty skips the audience check. Trimmed and de-duplicated on save.
        operations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ScopeRequirement"
          description: >
            Each operation's scope requirement, keyed "<METHOD> <path>" as
            PolicyOperation.key. An operation left out accepts any token the key
            manager and audiences accept, and a route a later build adds starts
            with none.
          # PATCH (wso2-cloud-client): the example here used allOf/anyOf keys
          # inside example values, which schema walkers read as combinators;
          # see ScopeRequirement for the shape.

    ScopeRequirement:
      type: object
      description: >
        The scopes one operation requires, checked against the token's
        space-separated `scope` claim. When both lists are set, both must hold.
        A scope can't contain whitespace.
      properties:
        allOf:
          type: array
          maxItems: 20
          items:
            type: string
          description: Every scope listed must be in the token.
        anyOf:
          type: array
          maxItems: 20
          items:
            type: string
          description: At least one scope listed must be in the token.

    SetJWTAuthRequest:
      type: object
      properties:
        enabled:
          type: boolean
          description: Not validated; omitted is treated as false (disable).
        issuers:
          type: array
          items:
            type: string
          description: Gateway key-manager NAMES to trust. Empty defaults to ThunderKeyManager, the only name accepted today.
        audiences:
          type: array
          maxItems: 20
          items:
            type: string
          description: >
            Optional allowed `aud` claim values; a token must carry at least one.
            Empty skips the audience check. Trimmed and de-duplicated on save.

    SetAPIKeyAuthRequest:
      type: object
      properties:
        enabled:
          type: boolean
          description: Not validated; omitted is treated as false (disable).
        key:
          type: string
          description: Header name carrying the key (default X-API-Key).
          example: X-API-Key
        in:
          type: string
          description: Accepted for wire compatibility and ignored — the key is always read from a header.
          example: header

    AuthToggleResponse:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Echo of the requested `enabled`.

    # ── Endpoint policies ──────────────────────────────────────────────────────

    EndpointPolicyConfig:
      type: object
      description: >
        The non-auth gateway behaviour of an exposed endpoint's API. Endpoint
        timeout ("resiliency" in the console) is deliberately absent: the
        gateway carries a resilience block on its own RestApi spec, but
        platform-api does not expose it, so no timeout set here could be
        enforced. GET always returns `cors` and `rateLimit`.
      properties:
        cors:
          $ref: "#/components/schemas/CORSConfig"
        rateLimit:
          $ref: "#/components/schemas/RateLimitConfig"
        platformOrigins:
          type: array
          readOnly: true
          description: >
            Origins the platform needs admitted (the console's own), named so a
            client can show them without offering to remove them. Read-only:
            ignored on PUT.
          items:
            type: string
        platformHeaders:
          type: array
          readOnly: true
          description: >
            The request header the active auth mode reads credentials from,
            which a CORS policy must allow. Read-only: ignored on PUT.
          items:
            type: string
        operations:
          type: array
          readOnly: true
          description: >
            Routes the exposed API actually has, so a per-operation limit can
            only be set on one that exists. When the endpoint carries a usable
            OpenAPI schema, its declared method/path pairs become the APIP
            operations and each path also gets an OPTIONS preflight operation.
            The catch-all method set on "/*" is retained only as a fallback for
            endpoints without a usable schema. Read-only: ignored on PUT.
          items:
            $ref: "#/components/schemas/PolicyOperation"

    PolicyOperation:
      type: object
      required: [key, method, path]
      properties:
        key:
          type: string
          description: '"<METHOD> <path>" — the identity RateLimitConfig.operations is keyed by.'
          example: GET /pets
        method:
          type: string
          example: GET
        path:
          type: string
          example: /pets

    CORSConfig:
      type: object
      description: >
        Cross-origin policy, attached at API level so it runs before
        authentication (otherwise the gateway 401s the browser's preflight).
        Disabled removes the policy entirely, so the gateway neither answers
        preflights nor strips upstream CORS headers.
      required: [enabled, allowCredentials]
      properties:
        enabled:
          type: boolean
        allowOrigins:
          type: array
          items:
            type: string
          description: Exact origins, a wildcard subdomain (https://*.example.com), or ["*"] for any.
        allowMethods:
          type: array
          items:
            type: string
        allowHeaders:
          type: array
          items:
            type: string
        allowCredentials:
          type: boolean
          description: Cannot be combined with the wildcard origin "*" (rejected with 400).

    RateLimitConfig:
      type: object
      description: >
        Request-rate limit. Only the fields matching level are meaningful:
        requestCount/timeUnit for "api", operations for "resource".
      required: [level]
      properties:
        level:
          type: string
          enum: [unlimited, api, resource]
          description: >
            api = one counter shared by the whole API, applied before
            authentication so rejected requests count too; resource = a
            separate counter per operation, applied after authentication so
            only authenticated requests count. An empty level is treated as
            unlimited.
        requestCount:
          type: integer
          description: Requests allowed per timeUnit. Must be greater than zero.
        timeUnit:
          type: string
          enum: [MINUTE, HOUR, DAY]
          description: Case-insensitive on write; empty means MINUTE.
        operations:
          type: object
          description: >
            Per-operation limits, keyed by "<METHOD> <path>" (e.g. "GET /pets").
            Absent operations are unlimited; keys naming no operation are ignored.
          additionalProperties:
            $ref: "#/components/schemas/RateLimitRule"

    RateLimitRule:
      type: object
      required: [requestCount, timeUnit]
      properties:
        requestCount:
          type: integer
          description: Must be greater than zero.
        timeUnit:
          type: string
          enum: [MINUTE, HOUR, DAY]
          description: Case-insensitive on write; empty means MINUTE. Always set on GET.

    # ── Consumer applications ──────────────────────────────────────────────────

    CreateApplicationRequest:
      type: object
      required: [displayName, projectName]
      properties:
        displayName:
          type: string
          example: My App
        projectName:
          type: string
          description: Project handle the application belongs to.
          example: default-project
        description:
          type: string

    UpdateApplicationRequest:
      type: object
      properties:
        displayName:
          type: string
          description: Omitted or empty keeps the current display name.
        description:
          type: string
          description: Always written — omitting it clears the description.

    Application:
      type: object
      description: >
        A consumer application. Org-scoped and shared across the org
        (platform-api does not model per-user ownership).
      required: [id, displayName]
      properties:
        id:
          type: string
          example: my-app
        displayName:
          type: string
        projectId:
          type: string
          description: API Platform handle of the owning project.
        description:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    # ── Alert rules ────────────────────────────────────────────────────────────

    AlertRuleSource:
      type: object
      description: The observability data source an alert rule evaluates.
      required: [type]
      properties:
        type:
          type: string
          enum: [log, metric]
        query:
          type: string
          description: Log query; used when type is "log".
        metric:
          type: string
          description: 'Metric name; used when type is "metric". Expected: cpu_usage, memory_usage.'

    AlertRuleCondition:
      type: object
      description: >
        When the alert fires. The service passes these values through to the
        component's alert-rule trait without checking them.
      required: [window, interval, operator, threshold]
      properties:
        window:
          type: string
          description: "Expected: 5m, 10m, 15m, 30m, 60m."
          example: 5m
        interval:
          type: string
          description: "Expected: 1m, 5m."
          example: 1m
        operator:
          type: string
          description: "Expected: gt, gte, lt, lte, eq."
          example: gt
        threshold:
          type: integer

    AlertRuleRequest:
      type: object
      description: >
        Body for both create and update. Create rejects an empty
        `instanceName` or a `source.type` other than "log"/"metric"; update
        validates nothing, and `condition` is never validated.
      properties:
        instanceName:
          type: string
          description: Rule identity on the component. Required on create; ignored on update (the path names the rule).
        description:
          type: string
        severity:
          type: string
          description: "Expected: info, warning, critical."
          example: warning
        source:
          $ref: "#/components/schemas/AlertRuleSource"
        condition:
          $ref: "#/components/schemas/AlertRuleCondition"

    AlertRuleEnvState:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    AlertRule:
      type: object
      required: [instanceName, source, condition]
      properties:
        instanceName:
          type: string
        description:
          type: string
        severity:
          type: string
        source:
          $ref: "#/components/schemas/AlertRuleSource"
        condition:
          $ref: "#/components/schemas/AlertRuleCondition"
        envConfigs:
          type: object
          description: Enabled state per environment name; omitted when no environment carries state for the rule.
          additionalProperties:
            $ref: "#/components/schemas/AlertRuleEnvState"

    AlertRuleEnvConfigRequest:
      type: object
      properties:
        enabled:
          type: boolean
          description: Not validated; omitted is treated as false (disable).

    # ── Databases ──────────────────────────────────────────────────────────────

    SubscriptionSuspendedError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [SUBSCRIPTION_SUSPENDED]

    DatabaseAvailability:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
        reason:
          type: string
          description: Why databases are unavailable; absent when available.
          enum: [NOT_CONFIGURED]

    DatabaseOffering:
      type: object
      required: [plans, postgresVersion]
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/DatabasePlan"
        defaultPlan:
          type: string
          description: The plan a create without `plan` gets.
          example: dev
        postgresVersion:
          type: string
          description: The PostgreSQL major every new database gets (`PAAS_POSTGRES_VERSION`).
          example: "17"
        maxNameLength:
          type: integer
          description: The longest database name PaaS accepts.
          example: 46
        plane:
          $ref: "#/components/schemas/ServicePlane"

    DatabasePlan:
      type: object
      required: [id, nodeCount, backups]
      properties:
        id:
          type: string
          example: standard
        nodeCount:
          type: integer
          description: Nodes a database on this plan runs; more than one is highly available.
          example: 3
        maxNodeCount:
          type: integer
        cpu:
          type: string
          description: CPU per node, as a Kubernetes quantity.
          example: "1"
        memory:
          type: string
          description: Memory per node, as a Kubernetes quantity.
          example: 2Gi
        defaultStorageGi:
          type: integer
          example: 5
        maxStorageGi:
          type: integer
        backups:
          type: boolean
          description: Whether the plan offers backups.
        monthlyPrice:
          type: number
          description: >
            List price per month at the plan's default node count and storage.
            Absent where PaaS publishes no price.
          example: 81
        currency:
          type: string
          example: USD

    ServicePlane:
      type: object
      description: Where new platform services run. Region and cloud are absent where PaaS records none.
      required: [name]
      properties:
        name:
          type: string
        displayName:
          type: string
        region:
          type: string
        cloud:
          type: string

    DatabaseServer:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
          description: The PaaS instance id.
        name:
          type: string
          description: Unique within the organization; a DNS label.
          example: orders
        status:
          type: string
          enum: [CREATING, ACTIVE, DELETING, DELETED, ERROR]
        statusMessage:
          type: string
          description: Why the database is in ERROR, when PaaS says.
        plan:
          type: string
          example: standard
        postgresVersion:
          type: string
          example: "17"
        nodeCount:
          type: integer
        storageGi:
          type: integer
        createdAt:
          type: string
          format: date-time

    DatabaseServerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DatabaseServer"

    DatabaseServerDetail:
      allOf:
        - $ref: "#/components/schemas/DatabaseServer"
        - type: object
          required: [reachable]
          properties:
            host:
              type: string
              description: The public endpoint's host when published, else the in-plane one.
            port:
              type: string
              example: "5432"
            reachable:
              type: boolean
              description: Whether `host` is reachable from outside the PaaS plane.
            runningVersion:
              type: string
              description: The PostgreSQL version actually running.
            cpu:
              type: string
            memory:
              type: string
            reconciling:
              type: boolean
              description: True while PaaS is still applying a change.
            backup:
              $ref: "#/components/schemas/DatabaseBackupPolicy"
            backupState:
              type: string
              description: >
                PaaS's own report of backup health, passed through, for
                example `Configured`, `NotScheduled`, `ArchivingPending`,
                `FirstBackupPending`, `BackupFailed` or `NoPlaneStore`.
            lastBackupAt:
              type: string
              format: date-time

    DatabaseBackupPolicy:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        schedule:
          type: string
          description: Cron schedule (seconds first), when PaaS reports one.
          example: "0 0 2 * * *"
        retentionDays:
          type: integer
          example: 7

    CreateDatabaseServerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: >
            Lowercase letters, digits and `-`, starting and ending with a letter
            or digit, at most the offering's `maxNameLength`; unique within the
            organization.
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
          example: orders
        plan:
          type: string
          description: A plan id from the offering; the catalog's default when omitted.
        storageGi:
          type: integer
          minimum: 0
          description: Storage in GiB; the plan's default when omitted or 0.

    DatabaseCredentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        database:
          type: string
          description: The default database to connect to.
        caCertificate:
          type: string
          description: PEM CA certificate to verify the server's TLS certificate with.
        host:
          type: string
        port:
          type: string

    # ── Temporal ───────────────────────────────────────────────────────────────

    TemporalAvailability:
      $ref: "#/components/schemas/DatabaseAvailability"

    TemporalOffering:
      type: object
      required: [plans]
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/TemporalPlan"
        defaultPlan:
          type: string
          description: The plan a create without `plan` gets.
          example: dev
        temporalVersion:
          type: string
          description: The Temporal version every new server runs (the catalog's).
          example: 1.31.2
        maxNameLength:
          type: integer
          description: The longest server name PaaS accepts.
          example: 29
        plane:
          $ref: "#/components/schemas/ServicePlane"

    TemporalPlan:
      type: object
      required: [id, replicas]
      properties:
        id:
          type: string
          example: standard
        replicas:
          type: integer
          description: How many of each Temporal service (frontend, history, matching, worker) the plan runs.
          example: 2
        cpu:
          type: string
          description: CPU the plan's Temporal services reserve in total, as a Kubernetes quantity.
          example: "2.2"
        memory:
          type: string
          description: Memory the plan's Temporal services reserve in total, as a Kubernetes quantity.
          example: 4.5Gi
        historyShards:
          type: integer
          description: >
            The server's history shard count, which bounds its workflow
            throughput. Fixed for the server's life: a later plan change keeps
            it.
          example: 16
        storageGi:
          type: integer
          description: Size of the server's internal store.
          example: 10
        monthlyPrice:
          type: number
          description: List price per server per month. Absent where PaaS publishes no price.
          example: 99
        currency:
          type: string
          example: USD

    TemporalServer:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
          description: The PaaS instance id.
        name:
          type: string
          description: Unique among the organization's platform services.
          example: payments
        status:
          type: string
          enum: [CREATING, ACTIVE, DELETING, DELETED, ERROR]
        statusMessage:
          type: string
          description: Why the server is in ERROR, when PaaS says.
        plan:
          type: string
          example: dev
        namespace:
          type: string
          description: >
            The Temporal namespace registered at create: `default`, or the
            server's name when its create named no namespace.
          example: default
        createdAt:
          type: string
          format: date-time

    TemporalServerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TemporalServer"

    TemporalServerDetail:
      allOf:
        - $ref: "#/components/schemas/TemporalServer"
        - type: object
          required: [reachable]
          properties:
            host:
              type: string
              description: The public endpoint's host when published, else the in-plane one.
              example: payments-ab12cd34ef.svc.dev.paas.wso2.com
            port:
              type: string
              example: "443"
            reachable:
              type: boolean
              description: Whether `host` is reachable from outside the PaaS plane.
            runningVersion:
              type: string
              description: The Temporal version actually running.
              example: 1.31.2

    CreateTemporalServerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: >
            Lowercase letters, digits and `-`, starting with a letter and
            ending with a letter or digit, at most the offering's
            `maxNameLength`; unique among the organization's platform
            services.
          pattern: "^[a-z]([a-z0-9-]*[a-z0-9])?$"
          example: payments
        plan:
          type: string
          description: A plan id from the offering; the catalog's default when omitted.

    TemporalCredentials:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string
          format: password
          description: "Sent by workers as `authorization: Bearer <apiKey>`."
        namespace:
          type: string
        host:
          type: string
        port:
          type: string

    KnowledgeBase:
      type: object
      required: [name, projectName, environment, config, secretKeys, dataSources]
      properties:
        name:
          type: string
          description: The KB Service component's name.
        displayName:
          type: string
        description:
          type: string
        projectName:
          type: string
          example: ai-services
        environment:
          type: string
          description: The development environment the knowledge base runs in.
        config:
          type: object
          additionalProperties:
            type: string
          description: Non-secret settings (VECTORDB_PROVIDER, COLLECTION_NAME, EMBEDDING_MODEL, ...).
        secretKeys:
          type: array
          items:
            type: string
        status:
          type: string
          description: KB Service deployment status (ACTIVE, IN_PROGRESS, ERROR, SUSPENDED).
        serviceUrl:
          type: string
          description: The KB Service's external URL, once routed.
        dataSources:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeBaseDataSource"
        createdAt:
          type: string
        updatedAt:
          type: string
          description: When the KB Service last rolled out (a new release or a restart in place, which saving its settings does).

    KnowledgeBaseList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeBase"

    KnowledgeBaseDataSource:
      type: object
      required: [name, config, secretKeys]
      properties:
        name:
          type: string
          description: The ingestion component's name.
        displayName:
          type: string
        config:
          type: object
          additionalProperties:
            type: string
          description: Non-secret source settings (DATASOURCE, AWS_BUCKET_NAME, ...).
        secretKeys:
          type: array
          items:
            type: string
        cronExpression:
          type: string
          description: Empty for a source that runs only when triggered.
        cronTimezone:
          type: string
        status:
          type: string
        releaseName:
          type: string
        createdAt:
          type: string

    CreateKnowledgeBaseRequest:
      type: object
      required: [name, config]
      properties:
        name:
          type: string
          pattern: "^[a-z]([a-z0-9-]{0,38}[a-z0-9])?$"
        displayName:
          type: string
        description:
          type: string
        config:
          type: object
          additionalProperties:
            type: string
          description: Must set VECTORDB_PROVIDER, COLLECTION_NAME, EMBEDDING_MODEL_PROVIDER and EMBEDDING_MODEL.
        secrets:
          type: object
          additionalProperties:
            type: string
        dataSource:
          $ref: "#/components/schemas/CreateKnowledgeBaseDataSourceRequest"

    UpdateKnowledgeBaseRequest:
      type: object
      required: [config]
      properties:
        displayName:
          type: string
        description:
          type: string
        config:
          type: object
          additionalProperties:
            type: string
          description: Replaces the non-secret settings.
        secrets:
          type: object
          additionalProperties:
            type: string
          description: >
            The full set of secrets to keep. A secret sent empty keeps its
            stored value; a secret left out is removed.

    CreateKnowledgeBaseDataSourceRequest:
      type: object
      required: [name, config]
      properties:
        name:
          type: string
          pattern: "^[a-z]([a-z0-9-]{0,38}[a-z0-9])?$"
        displayName:
          type: string
        config:
          type: object
          additionalProperties:
            type: string
          description: Must set DATASOURCE (gdrive or amazons3).
        secrets:
          type: object
          additionalProperties:
            type: string
        cronExpression:
          type: string
          description: Empty runs the ingestion once, now.
        cronTimezone:
          type: string
