# Trivy ignore file for known low-risk vulnerabilities.
#
# YAML format so that suppressions can be scoped with `paths`. Prefer a scoped
# entry over a bare one: a suppression without `paths` applies to every target
# in the scan, so a newly added lockfile that introduces a fresh vulnerable copy
# of the same package would be hidden silently.
#
# Only list a finding here when no usable fix exists — either Trivy reports an
# empty "Fixed Version", or the only fixed release is an incompatible major.
# Anything with a usable fix must instead be pinned via globalOverrides in
# common/config/rush/pnpm-config.json.
#
# This file is wired into CI via the `trivyignores` input of the Trivy step in
# .github/workflows/build.yml. Trivy reads a single ignore file, so every
# suppression must live here.

vulnerabilities:
  # No fix released by the author.
  # https://github.com/wso2/vscode-extensions/issues/550
  - id: CVE-2020-36851
    statement: No fix released by the author.

  - id: CVE-2025-14505
    statement: No fix released by the author.

  # ajv. NOTE: unlike the entries above, a fix now exists (8.18.0 for the 8.x
  # line; the 6.x copy is already past the 6.14.0 fix). Per the policy at the
  # top of this file this should be pinned via globalOverrides rather than
  # suppressed here — tracked as follow-up, kept only to avoid breaking the
  # build gate in the meantime.
  - id: CVE-2025-69873
    paths:
      - common/config/rush/pnpm-lock.yaml
    statement: >-
      ajv: fix available in 8.18.0. Suppressed pending a globalOverrides pin;
      this entry should be removed once that pin lands.

  # Used only in nested dependencies, not directly by our codebase.
  # No fix released by the author.
  - id: CVE-2026-26996
    statement: Nested dependency only. No fix released by the author.

  # brace-expansion — DoS via unbounded expansion length. The fix exists only in
  # 5.0.8 and was never backported to the 1.x/2.x lines (1.1.16 and 2.1.2 are
  # the latest published releases of each). 5.x is not a drop-in replacement: it
  # removed the CommonJS default export that minimatch 3.x/5.x/9.x call, so
  # forcing those lines to 5.0.8 breaks them at runtime. The 5.x line IS pinned
  # to 5.0.8 via globalOverrides, so this entry covers only the 1.x/2.x
  # transitives in the two Rush lockfiles plus the copy in the ballerina-grammar
  # submodule's own package-lock.json, which Rush overrides cannot reach.
  # Scoped to those three lockfiles so a vulnerable copy appearing anywhere else
  # still fails the scan. Remove once upstream backports the fix, or once
  # nothing depends on minimatch below v10.
  - id: CVE-2026-14257
    paths:
      - common/autoinstallers/rush-plugins/pnpm-lock.yaml
      - common/config/rush/pnpm-lock.yaml
      - workspaces/ballerina/ballerina-extension/grammar/ballerina-grammar/package-lock.json
    statement: >-
      Fixed only in brace-expansion 5.0.8, which drops the CommonJS default
      export that minimatch 3.x/5.x/9.x depend on. The 1.x/2.x lines are pinned
      to their latest published releases instead.
